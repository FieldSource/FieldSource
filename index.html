    ['Kentucky Bluegrass Seed','lb','Seed','4.25','2026-01-01',''],
  ];
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'materials_template.csv';
  a.click();
}

async function importMaterialsCSV(file){
  if(!file) return;
  const statusEl = document.getElementById('mat-import-status');

  const text = await file.text();
  const lines = text.trim().split('\n');
  const header = lines[0].split(',').map(h=>h.replace(/"/g,'').trim().toLowerCase());

  const nameIdx = header.indexOf('name');
  const unitIdx = header.indexOf('unit');
  const catIdx = header.indexOf('category');
  const priceIdx = header.indexOf('price');
  const dateIdx = header.indexOf('effective date');
  const notesIdx = header.indexOf('notes');

  if(nameIdx<0||unitIdx<0){ 
    alert('CSV must have at least Name and Unit columns.'); 
    return; 
  }

  const rows = lines.slice(1).map(line=>{
    // Handle quoted CSV values
    const cols = [];
    let cur = '', inQuote = false;
    for(const ch of line){
      if(ch==='"'){ inQuote=!inQuote; }
      else if(ch===','&&!inQuote){ cols.push(cur.trim()); cur=''; }
      else cur+=ch;
    }
    cols.push(cur.trim());
    return cols;
  }).filter(r=>r[nameIdx]);

  if(!rows.length){ alert('No data rows found in CSV.'); return; }

  // Show progress
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'mat-import-overlay';
  overlay.innerHTML = `<div class="modal-sheet" style="max-width:400px;text-align:center">
    <div class="sheet-title">Importing Materials</div>
    <div id="mat-import-progress" style="font-size:14px;color:var(--text-2);margin:16px 0">Starting...</div>
    <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:0 0 16px">
      <div id="mat-import-bar" style="height:100%;width:0%;background:var(--green);border-radius:3px;transition:width .2s"></div>
    </div>
    <div id="mat-import-log" style="font-size:12px;color:var(--text-3);max-height:150px;overflow-y:auto;text-align:left"></div>
  </div>`;
  document.body.appendChild(overlay);

  const progEl = document.getElementById('mat-import-progress');
  const barEl = document.getElementById('mat-import-bar');
  const logEl = document.getElementById('mat-import-log');

  let created=0, updated=0, pricesSet=0, errors=0;
  const effectiveDate = new Date().toISOString().split('T')[0];

  for(let i=0; i<rows.length; i++){
    const row = rows[i];
    const name = row[nameIdx]?.replace(/"/g,'')||'';
    const unit = row[unitIdx]?.replace(/"/g,'')||'';
    const category = catIdx>=0 ? (row[catIdx]?.replace(/"/g,'')||'') : '';
    const price = priceIdx>=0 ? parseFloat(row[priceIdx]?.replace(/"/g,'')||'0') : 0;
    const date = dateIdx>=0 ? (row[dateIdx]?.replace(/"/g,'')||effectiveDate) : effectiveDate;
    const notes = notesIdx>=0 ? (row[notesIdx]?.replace(/"/g,'')||'') : '';

    if(!name||!unit){ errors++; continue; }

    const pct = Math.round((i+1)/rows.length*100);
    progEl.textContent = `Processing ${i+1} of ${rows.length}...`;
    barEl.style.width = pct+'%';

    try {
      // Check if material exists
      const existing = materialsList.find(m=>m.name.toLowerCase()===name.toLowerCase());

      if(existing){
        // Update material details
        await sbFetch('PATCH', `/rest/v1/materials?id=eq.${existing.id}`, { unit, category, notes });
        existing.unit=unit; existing.category=category; existing.notes=notes;
        updated++;
        logEl.innerHTML += `<div>✓ Updated: ${name}</div>`;
      } else {
        // Create new material
        await sbFetch('POST', '/rest/v1/materials', { name, unit, category, notes, created_by: currentUser?.email||'' });
        // Fetch new id
        const newMats = await sbFetch('GET', `/rest/v1/materials?name=eq.${encodeURIComponent(name)}&order=created_at.desc&limit=1`);
        const newId = newMats?.[0]?.id;
        if(newId){
          materialsList.push({ id:newId, name, unit, category, notes, createdBy: currentUser?.email||'' });
          if(price>0){
            await sbFetch('POST', '/rest/v1/material_prices', { material_id: newId, price_per_unit: price, effective_date: date, set_by: currentUser?.email||'' });
            materialPrices.push({ id: 'tmp'+Date.now(), materialId: newId, price, effectiveDate: date, setBy: currentUser?.email||'', notes:'' });
            pricesSet++;
          }
        }
        created++;
        logEl.innerHTML += `<div>+ Added: ${name}${price?` ($${price.toFixed(2)}/${unit})`:'no price'}</div>`;
      }

      // Set price for existing materials too if provided
      if(existing && price>0){
        await sbFetch('POST', '/rest/v1/material_prices', { material_id: existing.id, price_per_unit: price, effective_date: date, set_by: currentUser?.email||'' });
        materialPrices.push({ id: 'tmp'+Date.now(), materialId: existing.id, price, effectiveDate: date, setBy: currentUser?.email||'', notes:'' });
        pricesSet++;
      }
    } catch(e){
      errors++;
      logEl.innerHTML += `<div style="color:#dc2626">✕ Error: ${name} — ${e.message}</div>`;
    }
    logEl.scrollTop = logEl.scrollHeight;
  }

  progEl.textContent = `Done — ${created} added, ${updated} updated, ${pricesSet} prices set${errors?' ('+errors+' errors)':''}`;
  barEl.style.width='100%';
  logEl.innerHTML += `<div style="margin-top:8px;font-weight:600;color:var(--green-dark)">Import complete</div>`;

  // Add close button
  overlay.querySelector('.modal-sheet').innerHTML += `<div style="margin-top:16px"><button onclick="document.getElementById('mat-import-overlay').remove();renderMaterials()" style="padding:8px 20px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;width:100%">Done</button></div>`;
}

async function submitInvApprovalUpload(){
  const jobId = document.getElementById('ia-job-select').value;
  const vendorName = document.getElementById('ia-vendor').value.trim();
  const amount = parseFloat(document.getElementById('ia-amount').value)||0;
  const invoiceDate = document.getElementById('ia-date').value;
  const description = document.getElementById('ia-desc').value.trim();
  const fileInput = document.getElementById('ia-file');
  const file = fileInput?.files[0];

  if(!jobId||!vendorName||!amount){ alert('Job, vendor, and amount are required.'); return; }

  const statusEl = document.getElementById('ia-upload-status');
  if(statusEl){ statusEl.textContent='Uploading...'; statusEl.style.color='var(--text-3)'; }

  let fileUrl = '', fileName = '';
  if(file){
    try {
      const ab = await file.arrayBuffer();
      const ts = new Date().toISOString().replace(/[:.]/g,'-');
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      fileName = `${ts}_${safeName}`;
      const path = `${jobId}/${fileName}`;
      const up = await fetch(`https://pldlvtlbgxizbppaliag.supabase.co/storage/v1/object/invoices-test/${path}`, {
        method:'POST',
        headers:{ 'Authorization':`Bearer ${sbToken()}`, 'apikey':SUPABASE_KEY, 'Content-Type':file.type||'application/octet-stream', 'x-upsert':'true' },
        body: ab,
      });
      if(up.ok) fileUrl = path;
    } catch(e){ console.warn('File upload failed:', e); }
  }

  // Get PO number from jobs
  const job = jobs.find(j=>j.id===jobId||j.client===jobId);
  const poNum = job?.poNumber||'';

  try {
    await sbFetch('POST', '/rest/v1/invoices_test', {
      job_id: jobId,
      po_number: poNum,
      invoice_date: invoiceDate||null,
      vendor_name: vendorName,
      invoice_amount: amount,
      invoice_file_name: file?.name||'',
      invoice_file_url: fileUrl,
      description,
      uploaded_by: currentUser?.email||'',
      approval_status: 'Pending',
      invoice_number: invNum,
    });
    if(statusEl){ statusEl.textContent='✓ Invoice submitted for approval'; statusEl.style.color='var(--green-dark)'; }
    if(fileInput) fileInput.value='';
    document.getElementById('ia-vendor').value='';
    document.getElementById('ia-amount').value='';
    document.getElementById('ia-date').value='';
    document.getElementById('ia-desc').value='';
    await reloadInvApproval();
  } catch(e){
    if(statusEl){ statusEl.textContent='Failed: '+e.message; statusEl.style.color='#dc2626'; }
  }
}

function renderInvApproval(){
  const userEmail = (currentUser?.email||'').toLowerCase();
  const canApprove = APPROVER_EMAILS.includes(userEmail);
  const canUploadInv = UPLOADER_EMAILS.includes(userEmail);

  // Invoice file approvals (Dan's queue)
  const pendingInvoiceApprovals = invoiceFiles.filter(f=>f.approvalStatus==='pending');

  const pending = invApprovalList.filter(i=>i.status==='Pending');
  const rejected = invApprovalList.filter(i=>i.status==='Rejected');
  const approved = invApprovalList.filter(i=>i.status==='Approved');

  // PO Dashboard data
  const poDashboard = {};
  jobs.forEach(j=>{
    if(j.poAmount){
      if(!poDashboard[j.client]) poDashboard[j.client] = { budget: j.poAmount, spent: 0, poNumber: j.poNumber||'' };
    }
  });
  approved.forEach(inv=>{
    const job = jobs.find(j=>j.id===inv.jobId||j.client===inv.jobId);
    const key = job?.client||inv.jobId;
    if(!poDashboard[key]) poDashboard[key] = { budget: 0, spent: 0, poNumber: inv.finalPoNumber||'' };
    poDashboard[key].spent += inv.invoiceAmount;
  });

  const statusBadge = s => {
    const map = { Pending:'#f59e0b', Approved:'#16a34a', Rejected:'#dc2626', Resolved:'#6b7280' };
    return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:${map[s]||'#999'}20;color:${map[s]||'#999'}">${s}</span>`;
  };

  const invCard = (inv, showActions=true) => {
    const date = inv.uploadedAt ? new Date(inv.uploadedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—';
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            ${statusBadge(inv.status)}
            <span style="font-weight:600;font-size:14px;color:var(--text)">${inv.vendorName}</span>
            <span style="font-size:15px;font-weight:700;color:var(--green-dark);font-family:'DM Mono',monospace">${poFmt(inv.invoiceAmount)}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px;font-size:12px;color:var(--text-2)">
            <div><span style="color:var(--text-3)">Job:</span> <strong>${inv.jobId}</strong></div>
            <div><span style="color:var(--text-3)">PO:</span> ${inv.finalPoNumber||inv.poNumber||'—'}</div>
            <div><span style="color:var(--text-3)">Invoice #:</span> ${inv.invoiceNumber||'—'}</div>
            <div><span style="color:var(--text-3)">Date:</span> ${inv.invoiceDate||'—'}</div>
            <div><span style="color:var(--text-3)">Uploaded by:</span> ${inv.uploadedBy?.split('@')[0]||'—'}</div>
            ${inv.invoiceFileName?`<div><span style="color:var(--text-3)">File:</span> 📄 ${inv.invoiceFileName}</div>`:'<div></div>'}
          </div>
          ${inv.description?`<div style="font-size:12px;color:var(--text-3);margin-bottom:4px">📝 ${inv.description}</div>`:''}
          ${inv.rejectionReason?`<div style="font-size:12px;color:#dc2626;margin-top:4px">⚠ ${inv.rejectionReason}</div>`:''}
          ${inv.nextStep?`<div style="font-size:12px;color:#92400e;margin-top:2px">→ ${inv.nextStep}${inv.assignedTo?' ('+inv.assignedTo.split('@')[0]+')':''}</div>`:''}
          ${inv.followUpNotes?`<div style="font-size:11px;color:var(--text-3);margin-top:4px;white-space:pre-wrap;border-left:2px solid var(--border);padding-left:8px">${inv.followUpNotes}</div>`:''}
          ${inv.dropboxPath?`<div style="font-size:11px;color:var(--green-dark);margin-top:4px">📁 ${inv.dropboxPath}</div>`:''}
          ${inv.approvalNotes?`<div style="font-size:11px;color:var(--text-3);margin-top:2px">Note: ${inv.approvalNotes}</div>`:''}
        </div>
        <div style="font-size:11px;color:var(--text-3);text-align:right;white-space:nowrap">${date}</div>
      </div>
      ${showActions && canApprove && inv.status==='Pending' ? `<div style="display:flex;gap:8px;margin-top:10px">
        <button onclick="openApproveModal(${inv.id})" style="padding:6px 16px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer">✓ Approve</button>
        <button onclick="openRejectModal(${inv.id})" style="padding:6px 16px;background:#dc2626;color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer">✕ Reject</button>
      </div>` : ''}
      ${showActions && inv.status==='Rejected' ? `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button onclick="openAddNotesModal(${inv.id})" style="padding:5px 12px;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;cursor:pointer">+ Add Notes</button>
        <button onclick="markInvResubmitted(${inv.id})" style="padding:5px 12px;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;cursor:pointer">↩ Mark Resubmitted</button>
        <button onclick="markInvResolved(${inv.id})" style="padding:5px 12px;background:none;border:1px solid #dc2626;color:#dc2626;border-radius:var(--radius-sm);font-size:12px;cursor:pointer">✓ Mark Resolved</button>
      </div>` : ''}
    </div>`;
  };

  // Job selector options
  const jobOptions = [...new Set(jobs.map(j=>j.client).filter(Boolean))].sort()
    .map(c=>`<option value="${c}">${c}</option>`).join('');

  let html = `<div style="margin-bottom:20px">
    <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px">Invoice Approvals</div>

    ${pendingInvoiceApprovals.length>0?`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:13px;font-weight:700;color:var(--text)">⏳ Pending Approval (${pendingInvoiceApprovals.length})</div>
        <div style="font-size:12px;color:#92400e;background:#fff7ed;border:1px solid #fed7aa;border-radius:99px;padding:3px 10px;font-weight:600">Waiting on: Dan Haller</div>
      </div>
      ${pendingInvoiceApprovals.map(f=>{
        const safe = f.id.replace(/'/g,"\\'");
        const safePath = f.filePath.replace(/'/g,"\\'");
        const safeFile = f.fileName.replace(/'/g,"\\'");
        const safeProject = f.projectName.replace(/'/g,"\\'");
        return `<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px;color:var(--text)">${f.vendorName||f.fileName}</div>
            <div style="font-size:12px;color:var(--text-2)">${f.projectName}${f.invoiceNum?' · Inv #'+f.invoiceNum:''}</div>
            ${f.notes?`<div style="font-size:11px;color:var(--text-3)">${f.notes}</div>`:''}
          </div>
          <div style="font-weight:700;font-size:14px;color:var(--green-dark);font-family:'DM Mono',monospace;flex-shrink:0">${f.amount?'$'+Number(f.amount).toLocaleString('en-US',{minimumFractionDigits:2}):'—'}</div>
          <div style="display:flex;gap:6px;flex-shrink:0;align-items:center">
            <button onclick="openInvoiceFile('${safePath}','${safeFile}','${safeProject}')" title="Open document" style="padding:5px 10px;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;cursor:pointer">↗ View</button>
            ${canApprove?`<button id="approve-btn-${safe}" onclick="approveInvoice('${safe}')" style="padding:5px 12px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer">✓ Approve</button>`:''}
            ${canApprove?`<button onclick="rejectInvoice('${safe}')" style="padding:5px 12px;background:none;border:1px solid #fca5a5;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;color:#dc2626">✕ Reject</button>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`:''}
`;

  // Upload section
  if(canUploadInv){
    html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px">Submit Invoice for Approval</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <label class="form-label">Job *</label>
          <select id="ia-job-select" style="width:100%;padding:8px 10px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg)">
            <option value="">-- Select job --</option>
            ${jobOptions}
          </select>
        </div>
        <div>
          <label class="form-label">Vendor *</label>
          <input type="text" id="ia-vendor" placeholder="e.g. Sherwin-Williams" style="width:100%;padding:8px 10px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);box-sizing:border-box">
        </div>
        <div>
          <label class="form-label">Amount *</label>
          <input type="number" id="ia-amount" step="0.01" placeholder="0.00" style="width:100%;padding:8px 10px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);box-sizing:border-box">
        </div>
        <div>
          <label class="form-label">Invoice Date</label>
          <input type="date" id="ia-date" style="width:100%;padding:8px 10px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);box-sizing:border-box">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <label class="form-label">Invoice #</label>
          <input type="text" id="ia-inv-num" placeholder="e.g. 9725" style="width:100%;padding:8px 10px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);box-sizing:border-box">
        </div>
        <div>
          <label class="form-label">Description / Notes</label>
          <input type="text" id="ia-desc" placeholder="What is this invoice for?" style="width:100%;padding:8px 10px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);box-sizing:border-box">
        </div>
      </div>
      <div style="margin-bottom:10px">
        <label class="form-label">Attach PDF (optional)</label>
        <input type="file" id="ia-file" accept=".pdf,.jpg,.jpeg,.png" style="font-size:13px">
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <button onclick="submitInvApprovalUpload()" style="padding:8px 20px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer">Submit for Approval</button>
        <div id="ia-upload-status" style="font-size:12px;color:var(--text-3)"></div>
      </div>
    </div>`;
  }

  // PO Dashboard
  const dashEntries = Object.entries(poDashboard).filter(([,v])=>v.spent>0||v.budget>0);
  if(dashEntries.length){
    html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px">PO Spend Tracking</div>
      <div style="display:grid;gap:10px">`;
    dashEntries.forEach(([jobName, d])=>{

      html += `<div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:13px;font-weight:500;color:var(--text)">${jobName}${d.poNumber?' <span style="font-size:11px;color:var(--text-3)">'+d.poNumber+'</span>':''}</span>

        </div>
        <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${Math.min(pct,100)}%;background:${color};border-radius:3px;transition:width .3s"></div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // PO/legacy pending approvals — only show if there are items
  if(pending.length){
    html += `<div style="margin-bottom:20px">
      <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px">

      </div>`;
    html += pending.map(i=>invCard(i)).join('');
    html += `</div>`;
  }

  // Needs Action (Rejected)
  if(rejected.length){
    html += `<div style="margin-bottom:20px">
      <div style="font-size:14px;font-weight:700;color:#dc2626;margin-bottom:10px">
        ⚠ Needs Action <span style="font-size:12px;font-weight:400;color:var(--text-3)">(${rejected.length})</span>
      </div>
      ${rejected.map(i=>invCard(i)).join('')}
    </div>`;
  }

  // Approved (collapsed)
  if(approved.length){
    html += `<div style="margin-bottom:20px">
      <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px">
        Approved <span style="font-size:12px;font-weight:400;color:var(--text-3)">(${approved.length})</span>
      </div>
      ${approved.map(i=>invCard(i,false)).join('')}
    </div>`;
  }

  html += `</div>`;
  document.getElementById('main-content').innerHTML = html;
}

function bellTimeOff(){ return (typeof timeOffEntries!=='undefined' ? timeOffEntries : []).filter(e=>e.status==='Pending' && typeof timeOffForMe==='function' && timeOffForMe(e)); }
function updateApprovalBell(pulse){
  const inv = bellInvoices().length, to = bellTimeOff().length, total = inv + to;
  const bell = document.getElementById('approval-bell');
  const badge = document.getElementById('approval-badge');
  if(bell){

async function approveInvoice(id){
  const f = invoiceFiles.find(x=>x.id===id);
  if(!f) return;
  const btn = document.getElementById('approve-btn-'+id);
  if(btn){ btn.textContent='Approving...'; btn.disabled=true; }
  try {
    await sbFetch('PATCH', `/rest/v1/invoice_files?id=eq.${id}`, {
      approval_status: 'approved',
      approved_by: currentUser?.email||'',
      approved_at: new Date().toISOString(),
    });
    // Now send to Dropbox
    const res = await fetch(`https://pldlvtlbgxizbppaliag.supabase.co/storage/v1/object/sign/invoices/${f.filePath}`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${sbToken()}`, 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ expiresIn: 60 }),
    });
    const data = await res.json();
    if(data.signedURL){
      const fullUrl = `https://pldlvtlbgxizbppaliag.supabase.co/storage/v1${data.signedURL}`;
      const fileRes = await fetch(fullUrl);
      const blob = await fileRes.blob();
      const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
      const dropRes = await fetch('/.netlify/functions/upload-to-dropbox', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+(currentToken||'') },
        body: JSON.stringify({ fileData: base64, fileName: f.fileName, projectName: f.projectName, vendorName: f.vendorName }),
      });
      const dropData = await dropRes.json();
      if(dropData.error) throw new Error('Dropbox: ' + dropData.error);
      console.log('Dropbox upload success:', dropData.path);
    } else {
      throw new Error('Could not get signed URL for file');
    }
    await loadInvoices();
    updateApprovalBell();
    if(view==='inv-approval') renderInvApproval();
    else renderInvoiceList();
  } catch(e){
    alert('Approval failed: ' + e.message);
    if(btn){ btn.textContent='Approve'; btn.disabled=false; }
  }
}

async function extractInvoiceData(file){
  console.log('extractInvoiceData called, file.type:', file.type, 'file.name:', file.name, 'file.size:', file.size);
  const isPDF = file.type==='application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  const isImage = file.type.startsWith('image/') || file.name.toLowerCase().match(/\.(jpg|jpeg|png|gif|webp)$/);
  console.log('isPDF:', isPDF, 'isImage:', isImage);
  if(!isPDF && !isImage){ console.log('Skipping extraction - not PDF or image'); return null; }
  // Force correct mime type for PDFs regardless of what browser reports
  const mimeType = isPDF ? 'application/pdf' : file.type;

  // Convert to base64
  const base64 = await new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });

  try {
    const payload = JSON.stringify({
      fileData: base64,
      fileType: mimeType,
      clientList: CLIENTS.join(', '),
    });
    console.log('Sending to extract-invoice, payload size:', payload.length, 'fileType:', mimeType);
    const response = await fetch('/.netlify/functions/extract-invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+(currentToken||'') },
      body: payload,
    });
    console.log('extract-invoice response status:', response.status);

    if(!response.ok) throw new Error('Extraction service error: ' + response.status);
    const text = await response.text();
    console.log('extract-invoice response body:', text.slice(0, 500));
    return JSON.parse(text);
  } catch(e){
    console.error('Invoice extraction failed:', e.message);
    return null;
  }
}

// ── INVOICE QUEUE ─────────────────────────────────────────────
let invoiceQueue = [];
let invoiceQueueIndex = 0;
let invoiceQueueResults = [];

async function startInvoiceQueue(files){
  if(!files.length) return;
  invoiceQueue = [...files];
  invoiceQueueIndex = 0;
  invoiceQueueResults = [];
  await processNextInQueue();
}

async function processNextInQueue(){
  if(invoiceQueueIndex >= invoiceQueue.length){
    // All done — show summary if more than 1
    if(invoiceQueue.length > 1){
      showQueueSummary();
    }
    return;
  }
  const file = invoiceQueue[invoiceQueueIndex];
  const statusEl = document.getElementById('inv-upload-status');
  if(statusEl){ statusEl.textContent = `Reading file ${invoiceQueueIndex+1} of ${invoiceQueue.length}...`; statusEl.style.color='var(--text-3)'; }
  await uploadInvoiceFile('', '', file, '', false);
}

function showQueueSummary(){
  const done = invoiceQueueResults.filter(r=>r.ok).length;
  const failed = invoiceQueueResults.filter(r=>!r.ok).length;
  const statusEl = document.getElementById('inv-upload-status');
  if(statusEl){
    statusEl.textContent = `✓ ${done} of ${invoiceQueue.length} invoices filed${failed?' · '+failed+' skipped':''}`;
    statusEl.style.color = 'var(--green-dark)';
  }
  invoiceQueue = [];
  invoiceQueueIndex = 0;
}

async function uploadInvoiceFile(jobId, projectName, file, notes='', skipExtraction=false){
  if(!file) return;
  const maxSize = 25 * 1024 * 1024;
  if(file.size > maxSize){ alert('File too large. Max 25MB.'); return; }

  const statusEl = document.getElementById('inv-upload-status');
  if(statusEl){ statusEl.textContent = 'Reading invoice...'; statusEl.style.color='var(--text-3)'; }

  // Always extract and always confirm — never auto-file silently
  if(!skipExtraction){
    try {
      const extracted = await extractInvoiceData(file);
      window._pendingFullText = extracted?.full_text||'';
      showInvoiceConfirmModal(file, extracted, notes);
      if(statusEl){ statusEl.textContent = ''; }
      return;
    } catch(e){
      console.error('AI extraction failed:', e.message, e.stack);
      showInvoiceConfirmModal(file, null, notes);
      if(statusEl){ statusEl.textContent = ''; }
      return;
    }
  }

  // Build folder path: Project/Vendor/filename
  const vendor = (window._pendingVendor||'').replace(/[^a-zA-Z0-9 _-]/g,'').trim() || 'Unknown Vendor';
  window._pendingVendor = null;
  const safeProject = (projectName||'General').replace(/[^a-zA-Z0-9 _-]/g,'_');
  const safeVendor = vendor.replace(/\s+/g,'_');
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const ts = new Date().toISOString().replace(/[:.]/g,'-');
  const filePath = `${safeProject}/${safeVendor}/${ts}_${safeName}`;

  try {
    const arrayBuf = await file.arrayBuffer();
    const uploadRes = await fetch(`https://pldlvtlbgxizbppaliag.supabase.co/storage/v1/object/${INVOICE_BUCKET}/${filePath}`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${sbToken()}`,
        'apikey': SUPABASE_KEY,
        'Content-Type': file.type||'application/octet-stream',
        'x-upsert': 'true',
      },
      body: arrayBuf,
    });
    if(!uploadRes.ok){ throw new Error('Storage upload failed: ' + uploadRes.statusText); }

    const requiresApproval = ['canal winchester'].some(p=>(projectName||'').toLowerCase().includes(p));
    console.log('Filing invoice — projectName:', projectName, 'requiresApproval:', requiresApproval);
    const meta = {
      job_id: null,
      project_name: projectName||'General',
      vendor_name: vendor,
      file_name: file.name,
      file_path: filePath,
      file_size: file.size,
      file_type: file.type||'application/octet-stream',
      uploaded_by: currentUser?.email||'',
      notes: notes,
      amount: window._pendingAmount||null,
      invoice_num: window._pendingInvoiceNum||'',
      invoice_date: window._pendingInvoiceDate||null,
      extracted_text: window._pendingExtractedText||'',
      approval_status: requiresApproval ? 'pending' : 'approved',
    };
    await sbFetch('POST', '/rest/v1/invoice_files', meta);

    // Auto-create direct cost entry if we have enough info
    if(projectName && vendor && window._pendingAmount){
      try {
        const costRow = {
          site: projectName,
          vendor: vendor,
          amount: window._pendingAmount,
          date: window._pendingInvoiceDate || new Date().toISOString().split('T')[0],
          notes: notes || file.name,
          invoice_num: window._pendingInvoiceNum || '',
          created_at: new Date().toISOString(),
        };
        await sbFetch('POST', '/rest/v1/direct_costs', costRow);
        await loadCosts();
      } catch(e){ console.warn('Could not auto-create cost entry:', e); }
      window._pendingAmount = null;
      window._pendingInvoiceDate = null;
      window._pendingInvoiceNum = null;
    }

    // Upload to Dropbox — skip if pending approval
    if(!requiresApproval){
      try {
        const base64 = await new Promise((res,rej)=>{
          const r = new FileReader();
          r.onload = ()=>res(r.result.split(',')[1]);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        await fetch('/.netlify/functions/upload-to-dropbox', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+(currentToken||'') },
          body: JSON.stringify({ fileData: base64, fileName: file.name, projectName, vendorName: vendor }),
        });
      } catch(e){ console.warn('Dropbox upload failed:', e); }
    }

    await loadInvoices();
    if(statusEl){
      statusEl.textContent = requiresApproval
        ? `✓ Filed — pending Dan Haller approval before Dropbox`
        : `✓ Filed under ${projectName} / ${vendor}`;
      statusEl.style.color = requiresApproval ? '#f59e0b' : 'var(--green-dark)';
    }
    renderInvoices();
  } catch(e){
    console.error('Upload error:', e);
    if(statusEl){ statusEl.textContent = 'Upload failed: ' + e.message; statusEl.style.color='#dc2626'; }
  }
}

async function sendCheckedToDropbox(){
  const checked = [...document.querySelectorAll('#dropbox-retry-overlay input[type=checkbox]:checked')];
  if(!checked.length){ alert('Select at least one invoice.'); return; }
  const btn = document.getElementById('dropbox-retry-send-btn');
  const status = document.getElementById('dropbox-retry-status');
  if(btn){ btn.disabled=true; btn.textContent=`Sending 0 of ${checked.length}...`; }
  let success=0, failed=0;
  for(let i=0; i<checked.length; i++){
    const id = checked[i].dataset.id;
    if(status) status.textContent = `Sending ${i+1} of ${checked.length}...`;
    try { await retryDropboxUpload(id, true); success++; }
    catch(e){ failed++; }
  }
  if(status){ status.textContent = `✓ ${success} sent${failed?' · '+failed+' failed':''}`;  status.style.color='var(--green-dark)'; }
  if(btn){ btn.textContent='Done'; btn.disabled=false; }
  setTimeout(()=>{ document.getElementById('dropbox-retry-overlay')?.remove(); }, 2000);
}

}

async function retryDropboxUpload(id, silent=false){
  const f = invoiceFiles.find(x=>x.id===id);
  if(!f) return;
  try {
    // Download file from Supabase storage
    const res = await fetch(`https://pldlvtlbgxizbppaliag.supabase.co/storage/v1/object/sign/invoices/${f.filePath}`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${sbToken()}`, 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ expiresIn: 60 }),
    });
    const data = await res.json();
    if(!data.signedURL) throw new Error('Could not get signed URL');
    const fullUrl = `https://pldlvtlbgxizbppaliag.supabase.co/storage/v1${data.signedURL}`;
    const fileRes = await fetch(fullUrl);
    const blob = await fileRes.blob();
    const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
    // Upload to Dropbox
    const dropRes = await fetch('/.netlify/functions/upload-to-dropbox', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+(currentToken||'') },
      body: JSON.stringify({ fileData: base64, fileName: f.fileName, projectName: f.projectName, vendorName: f.vendorName }),
    });
    const dropData = await dropRes.json();
    if(dropData.error) throw new Error(dropData.error);
    if(!silent){
      const msg = document.createElement('div');
      msg.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1f18;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999';
      msg.textContent='✓ Sent to Dropbox';
      document.body.appendChild(msg);
      setTimeout(()=>msg.remove(),2500);
    }
  } catch(e){
    if(!silent) alert('Failed: '+e.message);
    else throw e;
  }
}

function fmtFileSize(bytes){
  if(!bytes) return '—';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(1) + ' MB';
}

function fileIcon(type){
  if(!type) return '📄';
  if(type.includes('pdf')) return '📕';
  if(type.includes('image')) return '🖼️';
  if(type.includes('spreadsheet')||type.includes('excel')||type.includes('xlsx')) return '📊';
  if(type.includes('word')||type.includes('docx')) return '📝';
  return '📄';
}

function getReportFilteredInvoices(){
  let filtered = invoiceFiles;
  if(reportDateFrom) filtered = filtered.filter(f=>f.uploadedAt&&f.uploadedAt.slice(0,10)>=reportDateFrom);
  if(reportDateTo) filtered = filtered.filter(f=>f.uploadedAt&&f.uploadedAt.slice(0,10)<=reportDateTo);
  if(invoiceJobFilter!=='All') filtered = filtered.filter(f=>f.projectName===invoiceJobFilter);
  if(invoiceVendorFilter!=='All') filtered = filtered.filter(f=>f.vendorName===invoiceVendorFilter);
  if(reportMinAmount) filtered = filtered.filter(f=>f.amount&&f.amount>=parseFloat(reportMinAmount));
  return filtered;
}

function downloadInvoiceReport(type){
  const filtered = getReportFilteredInvoices();
  const total = filtered.reduce((s,f)=>s+(f.amount||0),0);

  // Build summaries
  const byVendor = {};
  filtered.forEach(f=>{ if(!f.vendorName) return; if(!byVendor[f.vendorName]) byVendor[f.vendorName]={total:0,count:0}; byVendor[f.vendorName].total+=f.amount||0; byVendor[f.vendorName].count++; });
  const byProject = {};
  filtered.forEach(f=>{ if(!f.projectName) return; if(!byProject[f.projectName]) byProject[f.projectName]={total:0,count:0}; byProject[f.projectName].total+=f.amount||0; byProject[f.projectName].count++; });
  const byMonth = {};
  filtered.forEach(f=>{ if(!f.uploadedAt||!f.amount) return; const m=f.uploadedAt.slice(0,7); if(!byMonth[m]) byMonth[m]={total:0,count:0}; byMonth[m].total+=f.amount; byMonth[m].count++; });

  if(type==='csv'){
    // Build multi-sheet CSV (3 sections separated by blank rows)
    const lines = [];
    const dateStr = new Date().toLocaleDateString('en-US');
    lines.push(`Field Source Invoice Report — ${dateStr}`);
    lines.push(`Filters: Project=${invoiceJobFilter}, Vendor=${invoiceVendorFilter}, From=${reportDateFrom||'—'}, To=${reportDateTo||'—'}, Min Amount=${reportMinAmount||'—'}`);
    lines.push(`Total: ${filtered.length} invoices, ${poFmt(total)}`);
    lines.push('');

    lines.push('BY VENDOR');
    lines.push('Vendor,Total,Count');
    Object.entries(byVendor).sort((a,b)=>b[1].total-a[1].total).forEach(([v,d])=>lines.push(`"${v}",${d.total.toFixed(2)},${d.count}`));
    lines.push('');

    lines.push('BY PROJECT');
    lines.push('Project,Total,Count');
    Object.entries(byProject).sort((a,b)=>b[1].total-a[1].total).forEach(([p,d])=>lines.push(`"${p}",${d.total.toFixed(2)},${d.count}`));
    lines.push('');

    lines.push('BY MONTH');
    lines.push('Month,Total,Count');
    Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([m,d])=>{
      const label = new Date(m+'-15').toLocaleDateString('en-US',{month:'long',year:'numeric'});
      lines.push(`"${label}",${d.total.toFixed(2)},${d.count}`);
    });
    lines.push('');

    lines.push('ALL INVOICES');
    lines.push('Vendor,Project,Amount,Invoice Date,Uploaded,Invoice #,Notes');
    filtered.sort((a,b)=>b.amount-a.amount).forEach(f=>{
      lines.push(`"${f.vendorName||''}","${f.projectName||''}",${(f.amount||0).toFixed(2)},"${f.invoiceDate||''}","${f.uploadedAt?f.uploadedAt.slice(0,10):''}","${f.invoiceNum||''}","${(f.notes||'').replace(/"/g,"'")}"`);
    });

    const csv = lines.join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `FieldSource_Invoice_Report_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();

  } else if(type==='pdf'){
    // Build HTML and print to PDF
    const dateStr = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    const win = window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>Field Source Invoice Report</title>
    <style>
      body{font-family:Arial,sans-serif;color:#1a1f18;padding:32px;max-width:900px;margin:0 auto;font-size:12px}
      h1{color:#2a6a22;font-size:20px;margin-bottom:4px}
      h2{color:#2a6a22;font-size:14px;margin:24px 0 8px;border-bottom:2px solid #2a6a22;padding-bottom:4px}
      .meta{color:#666;font-size:11px;margin-bottom:24px}
      .summary{display:flex;gap:24px;background:#f0f7ee;padding:12px 16px;border-radius:6px;margin-bottom:24px}
      .summary div{text-align:center}
      .summary .num{font-size:20px;font-weight:700;color:#2a6a22}
      .summary .lbl{font-size:10px;color:#666;text-transform:uppercase}
      table{width:100%;border-collapse:collapse;margin-bottom:8px}
      th{background:#2a6a22;color:#fff;padding:6px 10px;text-align:left;font-size:11px}
      td{padding:6px 10px;border-bottom:1px solid #e8f5e3;font-size:11px}
      tr:nth-child(even) td{background:#f7faf6}
      .bar-cell{position:relative}
      .bar{height:10px;background:#3a8c2f;border-radius:3px;display:inline-block}
      .amount{font-weight:700;color:#2a6a22}
      @media print{body{padding:16px}}
    </style></head><body>
    <h1>Field Source Invoice Report</h1>
    <div class="meta">Generated ${dateStr} · ${filtered.length} invoices · ${invoiceJobFilter!=='All'?'Project: '+invoiceJobFilter+' · ':''}${invoiceVendorFilter!=='All'?'Vendor: '+invoiceVendorFilter+' · ':''}${reportDateFrom?'From: '+reportDateFrom+' · ':''}${reportDateTo?'To: '+reportDateTo:''}
    </div>
    <div class="summary">
      <div><div class="num">${filtered.length}</div><div class="lbl">Invoices</div></div>
      <div><div class="num">${poFmt(total)}</div><div class="lbl">Total Spend</div></div>
      <div><div class="num">${Object.keys(byVendor).length}</div><div class="lbl">Vendors</div></div>
      <div><div class="num">${Object.keys(byProject).length}</div><div class="lbl">Projects</div></div>
    </div>

    <h2>By Vendor</h2>
    <table><tr><th>Vendor</th><th>Total</th><th>Count</th></tr>
    ${Object.entries(byVendor).sort((a,b)=>b[1].total-a[1].total).map(([v,d])=>`<tr><td>${v}</td><td class="amount">${poFmt(d.total)}</td><td>${d.count}</td></tr>`).join('')}
    </table>

    <h2>By Project</h2>
    <table><tr><th>Project</th><th>Total</th><th>Count</th></tr>
    ${Object.entries(byProject).sort((a,b)=>b[1].total-a[1].total).map(([p,d])=>`<tr><td>${p}</td><td class="amount">${poFmt(d.total)}</td><td>${d.count}</td></tr>`).join('')}
    </table>

    <h2>Monthly Spend</h2>
    <table><tr><th>Month</th><th>Total</th><th>Count</th></tr>
    ${Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,d])=>{
      const label=new Date(m+'-15').toLocaleDateString('en-US',{month:'long',year:'numeric'});
      return `<tr><td>${label}</td><td class="amount">${poFmt(d.total)}</td><td>${d.count}</td></tr>`;
    }).join('')}
    </table>

    <h2>All Invoices</h2>
    <table><tr><th>Vendor</th><th>Project</th><th>Amount</th><th>Inv Date</th><th>Uploaded</th><th>Invoice #</th></tr>
    ${filtered.sort((a,b)=>(b.amount||0)-(a.amount||0)).map(f=>`<tr><td>${f.vendorName||'—'}</td><td>${f.projectName||'—'}</td><td class="amount">${poFmt(f.amount||0)}</td><td>${f.invoiceDate||'—'}</td><td>${f.uploadedAt?f.uploadedAt.slice(0,10):'—'}</td><td>${f.invoiceNum||'—'}</td></tr>`).join('')}
    </table>
    </body></html>`);
    win.document.close();
    setTimeout(()=>win.print(), 500);
  }

async function saveJob(){
  const client=getClientValue();
  const field=document.getElementById('f-field').value.trim();
  const service=getServiceValue();
  const startDate=document.getElementById('f-start').value;
  const duration=parseInt(document.getElementById('f-duration').value)||1;
  const notes=document.getElementById('f-notes').value.trim();
  if(!startDate){alert('Please pick a start date.');return}
  const includeWeekends=document.getElementById('f-weekends')?document.getElementById('f-weekends').checked:false;
  const selectedDays=getSelectedDays();
  const services = [...pickedServices].map(s=>{
    if(s==='Other'){
      const otherText = document.getElementById('f-service-other') ? document.getElementById('f-service-other').value.trim() : '';
      return otherText || 'Other';
    }
    return s;
  });
  console.log('pickedServices at save time:', pickedServices, 'services:', services);
  const task = document.getElementById('f-task') ? document.getElementById('f-task').value.trim() : '';
  const rentalEquip = document.getElementById('f-rental-equip') ? document.getElementById('f-rental-equip').value.trim() : '';
  const createdBy = editId ? (jobs.find(j=>j.id===editId)||{}).createdBy||'' : getDisplayName(currentUser&&currentUser.email);
  const data={client,field,service:services[0]||'',services,startDate,duration,crew:[...pickedCrew],equip:[...pickedEquip],touchUp:touchUpOn,notes,task,rentalEquip,includeWeekends,selectedDays,crewDays:Object.keys(pickedCrewDays).length?{...pickedCrewDays}:null,createdBy};
  const btn=document.querySelector('.btn-save');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  try{
    if(editId){
      await dbSaveJob(data, editId);
      const existing=jobs.find(j=>j.id===editId);
      Object.assign(existing,{...data,id:editId,createdBy:existing.createdBy||data.createdBy,rentalEquip:data.rentalEquip||existing.rentalEquip||''});
    } else {
      const newId=await dbSaveJob(data);
      if(newId) jobs.push({...data,id:newId});
    }
    save();closeModal();render();
  } catch(e){
    alert('Error saving job. Check your connection.');
    console.error(e);
    if(btn){btn.disabled=false;btn.textContent='Save job';}
  }
}
async function deleteJob(id){
  if(!confirm('Remove this job?')) return;
  try{
    await dbDeleteJob(id);
    jobs=jobs.filter(j=>j.id!==id);
    save();closeModal();render();
  } catch(e){
    alert('Error removing job.');
    console.error(e);
  }
}

function setRSiteClient(siteId, val){
  const site = reportSites.find(s=>s.id===siteId);
  if(!site) return;
  if(val==='__custom__'){
    site.client='';
    const inp = document.getElementById('r-custom-'+siteId);
    if(inp) inp.style.display='block';
  } else {
    site.client=val;
    const inp = document.getElementById('r-custom-'+siteId);
    if(inp) inp.style.display='none';
  }
}

function setRSiteField(siteId, field, val){
  const site = reportSites.find(s=>s.id===siteId);
  if(site) site[field]=val;
}

function setReportEquipTab(siteId, cat){
  activeEquipTab=cat;
  renderReportSiteContent(siteId);
}

function toggleRCrew(siteId, person, el){
  const site = reportSites.find(s=>s.id===siteId);
  if(!site) return;
  if(!site.additionalCrew) site.additionalCrew=[];
  if(site.additionalCrew.includes(person)){
    site.additionalCrew=site.additionalCrew.filter(x=>x!==person);
    el.classList.remove('picked');
  } else {
    site.additionalCrew.push(person);
    el.classList.add('picked');
  }
  const sel=document.getElementById('r-crew-sel-'+siteId);
  if(sel) sel.textContent=site.additionalCrew.length?'With: '+site.additionalCrew.join(', '):'No additional crew';
}

function toggleREquip(siteId, e, el){
  const site = reportSites.find(s=>s.id===siteId);
  if(!site) return;
  if(!site.equip) site.equip=[];
  if(site.equip.includes(e)){
    site.equip=site.equip.filter(x=>x!==e);
    el.classList.remove('picked');
  } else {
    site.equip.push(e);
    el.classList.add('picked');
  }
  const sel=document.getElementById('r-equip-sel-'+siteId);
  if(sel) sel.innerHTML=site.equip.length?site.equip.map(e=>`<span class="report-pill">🔧 ${e}</span>`).join(''):'<div style="font-size:12px;color:var(--text-3)">None selected</div>';
}

function toggleRIssue(siteId){
  const site=reportSites.find(s=>s.id===siteId);
  if(!site) return;
  site.hasIssue=!site.hasIssue;
  renderReportSiteContent(siteId);
}

async function getGoogleToken(){
  const now=Math.floor(Date.now()/1000);
  const header=btoa(JSON.stringify({alg:'RS256',typ:'JWT'}));
  const claim=btoa(JSON.stringify({
    iss:SHEETS_CONFIG.clientEmail,
    scope:'https://www.googleapis.com/auth/spreadsheets',
    aud:'https://oauth2.googleapis.com/token',
    exp:now+3600,iat:now
  }));
  const sigInput=`${header}.${claim}`;
  // Import the private key for signing
  const pemKey=SHEETS_CONFIG.privateKey.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g,'');
  const binaryKey=Uint8Array.from(atob(pemKey),c=>c.charCodeAt(0));
  const cryptoKey=await crypto.subtle.importKey(
    'pkcs8',binaryKey.buffer,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']
  );
  const signature=await crypto.subtle.sign(
    'RSASSA-PKCS1-v1_5',cryptoKey,
    new TextEncoder().encode(sigInput)
  );
  const sig=btoa(String.fromCharCode(...new Uint8Array(signature)));
  const jwt=`${sigInput}.${sig}`;
  const resp=await fetch('https://oauth2.googleapis.com/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`
  });
  const data=await resp.json();
  return data.access_token;
}

async function appendToSheet(data){
  try{
    const token=await getGoogleToken();
    const row=[
      data.reportDate,
      data.client,
      data.field||'',
      data.filedBy,
      data.timeIn||'',
      data.timeOut||'',
      data.workDone||'',
      data.productsUsed||'',
      (data.equipUsed||[]).join(', '),
      data.hasIssue?'Yes':'No',
      data.issueNotes||''
    ];
    await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_CONFIG.spreadsheetId}/values/${SHEETS_CONFIG.sheetName}!A1:K1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,
      {
        method:'POST',
        headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
        body:JSON.stringify({values:[row]})
      }
    );
  } catch(e){
    console.warn('Google Sheets sync failed (report still saved to Supabase):',e);
  }
}

async function saveReport(){
  const reportDate = document.getElementById('r-date').value;
  const filedBy = document.getElementById('r-filedby').value;
  if(!reportDate){alert('Please pick a date.');return;}
  if(!filedBy){alert('Please select who is filing this.');return;}

  // Use reportSites array which is kept in sync via setRSiteClient/setRSiteField
  const sitesToSave = reportSites.map(site=>{
    // Also grab textarea values from DOM since oninput may not fire on all browsers
    const workDone = (document.querySelector('#report-site-'+site.id+' textarea')||{}).value || site.workDone || '';
    return {...site, workDone};
  }).filter(s=>s.client && s.client.trim());

  if(!sitesToSave.length){alert('Please fill in at least one site.');return;}

  const btn=document.querySelector('.btn-save');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  try{
    for(const site of sitesToSave){
      const data={jobId:'',client:site.client,field:site.field,reportDate,filedBy,timeIn:site.timeIn,timeOut:site.timeOut,workDone:site.workDone,productsUsed:'',equipUsed:site.equip||[],hasIssue:site.hasIssue,issueNotes:site.issueNotes,additionalCrew:site.additionalCrew||[]};
      const newId=await dbSaveReport(data);
      if(newId) reports.unshift({...data,id:newId,createdAt:new Date().toISOString()});
      appendToSheet(data);
      if(site.hasIssue&&site.issueNotes){
        const woData={reportId:newId||'',client:site.client,field:site.field,issueNotes:site.issueNotes,status:'open',scheduledDate:'',scheduledCrew:[]};
        const woId=await dbSaveWorkOrder(woData);
        if(woId) workOrders.unshift({...woData,id:woId,createdAt:new Date().toISOString()});
        updateWoBadge();
      }
    }
    closeModal();
    renderReports();
  } catch(e){
    alert('Error saving report. Check your connection.');
    console.error(e);
    if(btn){btn.disabled=false;btn.textContent='Submit report';}
  }
}

function exportReport(id){
  const r = reports.find(x=>x.id===id);
  if(!r) return;
  const equipList = (r.equipUsed||[]).join(', ')||'—';
  const parts = [];
  parts.push('*Daily Field Report*');
  parts.push('*' + r.client + (r.field?' · '+r.field:'') + '*');
  parts.push(r.reportDate + '  |  Filed by: ' + r.filedBy);
  if(r.timeIn&&r.timeOut) parts.push('On site: ' + r.timeIn + ' - ' + r.timeOut);
  parts.push('');
  if(r.workDone) parts.push('*Work Done:*\n' + r.workDone);
  if(equipList !== '—') parts.push('*Equipment:*\n' + equipList);
  if(r.hasIssue && r.issueNotes) parts.push('*Issue Flagged:*\n' + r.issueNotes);
  const lines = parts.join('\n');

  navigator.clipboard.writeText(lines).then(()=>{
    // Show a brief confirmation
    const btn = document.querySelector('.btn-save');
    if(btn){ const orig=btn.textContent; btn.textContent='✓ Copied!'; setTimeout(()=>btn.textContent=orig, 2000); }
  }).catch(()=>{
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = lines;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.querySelector('.btn-save');
    if(btn){ const orig=btn.textContent; btn.textContent='✓ Copied!'; setTimeout(()=>btn.textContent=orig, 2000); }
  });
}

async function deleteReport(id){
  if(!confirm('Delete this report? This cannot be undone.')) return;
  try{
    // Delete any linked work order first
    await sbFetch('DELETE', `/rest/v1/work_orders?report_id=eq.${id}`);
    // Then delete the report
    await sbFetch('DELETE', `/rest/v1/field_reports?id=eq.${id}`);
    reports=reports.filter(r=>r.id!==id);
    workOrders=workOrders.filter(w=>w.reportId!==id);
    updateWoBadge();
    closeModal();
    renderReports();
  } catch(e){ alert('Error deleting report.'); console.error(e); }
}

  for(let h=5;h<=22;h++){
    for(let m=0;m<60;m+=30){
      const ampm=h<12?'AM':'PM';
      const hour=h>12?h-12:h===0?12:h;
      const min=m===0?'00':'30';
      const label=`${hour}:${min} ${ampm}`;
      opts+=`<option value="${label}"${selectedVal===label?' selected':''}>${label}</option>`;
    }
  }
  return opts;
}

function calcMileageMiles(){
  const s = parseFloat(document.getElementById('ml-odo-start').value)||0;
  const e = parseFloat(document.getElementById('ml-odo-end').value)||0;
  const el = document.getElementById('ml-miles-display');
  if(e > s){ el.textContent = (e-s).toFixed(1)+' mi'; el.style.color='var(--green-dark)'; }
  else if(s||e){ el.textContent = 'Invalid'; el.style.color='#dc2626'; }
  else { el.textContent = '—'; el.style.color='var(--green-dark)'; }
}

function setMileageTripType(t){
  mileageTripType = t;
  document.getElementById('ml-type-commute').classList.toggle('picked', t==='commute');
  document.getElementById('ml-type-personal').classList.toggle('picked', t==='personal');
}

function closeMileageModal(){
  const el = document.getElementById('mileage-overlay');
  if(el) el.remove();
  mileageModalOpen = false;
}

async function saveMileageLog(){
  const date = document.getElementById('ml-date').value;
  const vIdx = document.getElementById('ml-vehicle').selectedIndex;
  const vehicle = MILEAGE_VEHICLES[vIdx];
  const odoStart = parseFloat(document.getElementById('ml-odo-start').value);
  const odoEnd = parseFloat(document.getElementById('ml-odo-end').value);
  const purpose = document.getElementById('ml-purpose').value.trim();
  const errEl = document.getElementById('ml-error');
  errEl.textContent = '';

  if(!date){ errEl.textContent='Date is required.'; return; }
  if(isNaN(odoStart)||isNaN(odoEnd)){ errEl.textContent='Both odometer readings are required.'; return; }
  if(odoEnd <= odoStart){ errEl.textContent='Odometer end must be greater than odometer start.'; return; }

  const btn = document.querySelector('#mileage-overlay .btn-save');
  btn.disabled=true; btn.textContent='Saving...';
  try {
    await dbSaveMileageLog({ date, vehicleId: vehicle.id, vehicleLabel: vehicle.label, odoStart, odoEnd, tripType: mileageTripType, purpose });
    await loadMileage();
    closeMileageModal();
    renderMileage();
  } catch(e){
    errEl.textContent = 'Error saving. Please try again.';
    btn.disabled=false; btn.textContent='Save';
  }
}

async function deleteMileageEntry(id){
  if(!confirm('Remove this mileage entry?')) return;
  await dbDeleteMileageLog(id);
  await loadMileage();
  renderMileage();
}

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px">
          ${sorted.map(([person,days])=>`
            <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:13px;color:var(--text)">${person}</span>
              <span style="font-size:16px;font-weight:700;color:var(--green-dark);font-family:'DM Mono',monospace">${days}d</span>
            </div>`).join('')}
        </div>
      </div>`;
    }
  }

  // Pending requests
  if(pending.length){
    html += `<div style="font-weight:600;margin-bottom:8px;font-size:13px;color:#92400e">PENDING REQUESTS (${pending.length})</div>`;
    html += pending.map(e=>entryHtml(e, canApprove)).join('');
  }

  // Approved upcoming
  if(approved.length){
    html += `<div style="font-weight:600;margin:${pending.length?'16px':0} 0 8px;font-size:13px;color:var(--text-2)">APPROVED — UPCOMING</div>`;
    html += approved.map(e=>entryHtml(e, false)).join('');
  }

  if(!pending.length && !approved.length){
    html += `<div style="color:var(--text-3);font-size:13px;padding:20px 0">No upcoming time off.</div>`;
  }

  // Past/Denied
  if(past.length){
    html += `<div style="margin-top:16px"><button onclick="showPastTimeOff=!showPastTimeOff;renderTimeOff();" style="background:none;border:none;color:var(--text-3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:underline">${showPastTimeOff?'Hide past':'Show past ('+past.length+')'}</button></div>`;
    html += `<div id="past-timeoff" style="display:${showPastTimeOff?'block':'none'}">${past.map(e=>entryHtml(e,false)).join('')}</div>`;
  }

  document.getElementById('main-content').innerHTML = html;
}

async function saveTimeOff(){
  const person = document.getElementById('to-person').value;
  const startDate = document.getElementById('to-start').value;
  const endDate = document.getElementById('to-end').value;
  const note = document.getElementById('to-note').value.trim();
  const errEl = document.getElementById('to-error');
  errEl.textContent = '';
  if(!startDate || !endDate){ errEl.textContent = 'Please set both start and end dates.'; return; }
  if(endDate < startDate){ errEl.textContent = 'End date must be on or after start date.'; return; }
  try {
    const existing = editingTimeOffId ? timeOffEntries.find(x=>x.id===editingTimeOffId) : null;
    const status = existing ? existing.status : 'Pending';
    const requestedBy = existing ? existing.requestedBy : getDisplayName(currentUser&&currentUser.email);
    await dbSaveTimeOff({person, startDate, endDate, note, status, requestedBy}, editingTimeOffId);
    await loadTimeOff();
    updateTimeOffBadge();
    closeTimeOffForm();
    renderTimeOff();
  } catch(e) {
    errEl.textContent = 'Error saving. Please try again.';
  }
}

async function deleteTimeOffEntry(){

  editingTimeOffId = null;
  renderTimeOff();
}

async function submitNewWorkOrder(reportId){
  const client = document.getElementById('nwo-client').value;
  const field = document.getElementById('nwo-field').value.trim();
  const issue = document.getElementById('nwo-issue').value.trim();
  const errEl = document.getElementById('nwo-error');
  if(!issue){ errEl.textContent='Please describe the issue.'; return; }
  const btn = document.querySelector('#new-wo-overlay .btn-save');
  btn.disabled=true; btn.textContent='Submitting...';
  try {
    const data = { client, field, issueNotes: issue, status:'open', reportId: reportId||null, scheduledDate:'', scheduledCrew:[] };
    const newId = await dbSaveWorkOrder(data);
    if(newId){ data.id=newId; workOrders.unshift({...data, id:String(newId), createdAt:new Date().toISOString()}); }
    updateWoBadge();
    document.getElementById('new-wo-overlay').remove();
    // If on work orders view, refresh it
    if(view==='workorders') renderWorkOrders();
    // Show a brief confirmation
    const confirm2 = document.createElement('div');

  } catch(e){
    errEl.textContent = 'Error submitting. Please try again.';
    btn.disabled=false; btn.textContent='Submit Work Order';
  }
}

function renderWorkOrders(){
  const allClients = ['All', ...new Set(workOrders.map(w=>w.client).filter(Boolean))].sort((a,b)=>a==='All'?-1:a.localeCompare(b));
  const byStatus = woStatusFilter==='all' ? workOrders : workOrders.filter(w=>w.status===woStatusFilter);
  const filtered = woSiteFilter==='All' ? byStatus : byStatus.filter(w=>w.client===woSiteFilter);

  const openCount=workOrders.filter(w=>w.status==='open').length;
  const schedCount=workOrders.filter(w=>w.status==='assigned').length;
  const resolvedCount=workOrders.filter(w=>w.status==='resolved').length;

  let html=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
    <div class="stat-card" style="cursor:pointer;border-color:${woStatusFilter==='open'?'#ef4444':'var(--border)'}" onclick="setWoStatus('open')"><div class="stat-num" style="color:#dc2626">${openCount}</div><div class="stat-label">Open</div></div>
    <div class="stat-card" style="cursor:pointer;border-color:${woStatusFilter==='assigned'?'#f59e0b':'var(--border)'}" onclick="setWoStatus('scheduled')"><div class="stat-num" style="color:#d97706">${schedCount}</div><div class="stat-label">Assigned</div></div>
    <div class="stat-card" style="cursor:pointer;border-color:${woStatusFilter==='resolved'?'#22c55e':'var(--border)'}" onclick="setWoStatus('resolved')"><div class="stat-num" style="color:#16a34a">${resolvedCount}</div><div class="stat-label">Resolved</div></div>
  </div>`;

  html += `<div class="site-filter-row">${allClients.map(c=>{
    const safe = c.replace(/'/g,"\\'");
    return `<button class="site-chip${woSiteFilter===c?' active':''}" onclick="setWoSite('${safe}')">${c}</button>`;
  }).join('')}</div>`;

  if(!filtered.length){
    const labels={open:'No open work orders.',scheduled:'No assigned work orders.',resolved:'No resolved work orders.',all:'No work orders yet.'};
    html+=`<div class="empty-state"><p>${labels[woStatusFilter]||'No work orders.'}</p></div>`;
  } else {
    filtered.forEach(w=>{
      const stLabel={open:'Open',scheduled:'Assigned',resolved:'Resolved'}[w.status]||w.status;
      const stCls={open:'wo-status-open',scheduled:'wo-status-assigned',resolved:'wo-status-resolved'}[w.status]||'wo-status-open';
      html+=`<div class="wo-card wo-${w.status}" onclick="openWoModal('${w.id}')">
        <div class="wo-card-header">
          <div>
            <div class="wo-card-title">${w.client}${w.field?' · '+w.field:''}</div>
            <div class="wo-card-meta">Created ${w.createdAt?w.createdAt.slice(0,10):''}</div>
          </div>
          <span class="wo-status-badge ${stCls}">${stLabel}</span>
        </div>
        <div class="wo-issue-text">${w.issueNotes}</div>
        ${w.status==='assigned'&&w.scheduledDate?`<div class="wo-schedule-info">📅 Scheduled for ${w.scheduledDate}${(w.scheduledCrew||[]).length?' · '+(w.scheduledCrew||[]).join(', '):''}</div>`:''}
      </div>`;
    });
  }
  document.getElementById('main-content').innerHTML=html;
}
function setWoSite(c){ woSiteFilter=c; renderWorkOrders(); }
function setWoStatus(s){ woStatusFilter=s; renderWorkOrders(); }

        <label class="form-label">Assign this work order</label>
        <div style="font-size:12px;color:var(--text-3);margin-bottom:6px">Assigning will add this to the main job calendar automatically.</div>

    </div>

let woPicked=[];
function buildWoCrewGrid(pre){
  woPicked=pre||woPicked||[];
  return CREW.map(c=>`<div class="sel-opt${woPicked.includes(c)?' picked':''}" onclick="toggleWoCrew('${c}')">${c}</div>`).join('');
}
function toggleWoCrew(name){
  woPicked=woPicked.includes(name)?woPicked.filter(c=>c!==name):[...woPicked,name];
  const g=document.getElementById('wo-crew-grid');
  if(g) g.innerHTML=buildWoCrewGrid(woPicked);
}
async function scheduleWo(id){
  const w=workOrders.find(x=>x.id===id);
  if(!w) return;
  const scheduledDate=document.getElementById('wo-date').value;
  if(!scheduledDate){alert('Pick a date to schedule.');return;}
  const scheduledCrew=[...woPicked];
  const btn=document.querySelector('.btn-save');
  if(btn){btn.disabled=true;btn.textContent='Assigning...';}
  try{
    const updated={...w,status:'assigned',scheduledDate,scheduledCrew};
    await dbSaveWorkOrder(updated,id);
    Object.assign(w,{status:'assigned',scheduledDate,scheduledCrew});
    // Auto-add to jobs calendar
    const newJob={
      client:w.client,field:w.field,service:'Work Order',
      startDate:scheduledDate,duration:1,crew:scheduledCrew,equip:[],
      touchUp:false,notes:'Work order: '+w.issueNotes.slice(0,80),includeWeekends:false
    };
    const newId=await dbSaveJob(newJob);
    if(newId) jobs.push({...newJob,id:newId});
    save();
    updateWoBadge();
    closeModal();
    renderWorkOrders();
  } catch(e){
    alert('Error scheduling work order.');console.error(e);
    if(btn){btn.disabled=false;btn.textContent='Schedule';}
  }
}
async function resolveWo(id){
  if(!confirm('Mark this work order as resolved?')) return;
  const w=workOrders.find(x=>x.id===id);
  if(!w) return;
  try{
    await dbSaveWorkOrder({...w,status:'resolved'},id);
    w.status='resolved';
    updateWoBadge();
    closeModal();
    renderWorkOrders();
  } catch(e){ alert('Error resolving work order.'); console.error(e); }
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.textContent = '';
  if(!email||!password){ errEl.textContent='Please enter your email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in...';
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok || data.error){ errEl.textContent = data.error_description || data.msg || 'Invalid email or password.'; btn.disabled=false; btn.textContent='Sign in'; return; }
    currentUser = data.user;
    currentToken = data.access_token;
    refreshToken = data.refresh_token;
    isAdmin = ADMIN_EMAILS.includes(currentUser.email.toLowerCase());
    isScheduler = isAdmin || SCHEDULER_EMAILS.includes(currentUser.email.toLowerCase());
    isReportOnly = !isScheduler && REPORT_ONLY_EMAILS.includes(currentUser.email.toLowerCase());
    localStorage.setItem('fs_token', currentToken);
    localStorage.setItem('fs_refresh', refreshToken);
    localStorage.setItem('fs_user', JSON.stringify(currentUser));
    localStorage.setItem('fs_login_at', String(Date.now()));
    showApp();
  } catch(e){
    errEl.textContent = 'Connection error. Please try again.';
    btn.disabled=false; btn.textContent='Sign in';
  }
}

// ── TOKEN REFRESH ────────────────────────────────────────────
let refreshToken = null;

// Seconds until the current login token expires (read from the token itself).
function tokenSecondsLeft(){
  try{
    const part = (currentToken||'').split('.')[1];
    const exp = JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/'))).exp;
    return exp - Date.now()/1000;
  }catch(e){ return -1; }
}

// Renew the login. Returns true if we have a good token afterwards.
// Only logs out when Supabase actually rejects the refresh token, never on a network blip.
let refreshInFlight = null;
function refreshSession(){
  if(!refreshToken) refreshToken = localStorage.getItem('fs_refresh');
  if(!refreshToken) return Promise.resolve(tokenSecondsLeft() > 0);
  if(refreshInFlight) return refreshInFlight;
  refreshInFlight = (async ()=>{
    try{
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok || data.error){
        if(res.status===400 || res.status===401){ doLogout(); return false; }
        return tokenSecondsLeft() > 0;
      }
      currentToken = data.access_token;
      refreshToken = data.refresh_token;
      localStorage.setItem('fs_token', currentToken);
      localStorage.setItem('fs_refresh', refreshToken);
      return true;
    } catch(e){ console.warn('Token refresh failed', e); return tokenSecondsLeft() > 0; }
    finally { refreshInFlight = null; }
  })();
  return refreshInFlight;
}

// ── ONE LOGIN PER DAY ──
// A login lasts until 3:00 AM the next morning, then everyone signs in again for the new day.
const DAILY_LOGOUT_HOUR = 3;
function loginExpiredForDay(){
  let at = +localStorage.getItem('fs_login_at') || 0;
  if(!at){ at = Date.now(); localStorage.setItem('fs_login_at', String(at)); } // sessions from before this change start counting now
  const cutoff = new Date(at);
  cutoff.setHours(DAILY_LOGOUT_HOUR, 0, 0, 0);
  if(cutoff.getTime() <= at) cutoff.setDate(cutoff.getDate() + 1);
  return Date.now() >= cutoff.getTime();
}
function endDailySession(){
  doLogout();
  const e = document.getElementById('login-error');
  if(e) e.textContent = 'New day: please sign in again.';
}

// Make sure the token is good for at least 5 more minutes; renew it if not.
async function ensureFreshToken(){
  if(!currentToken) return false;
  if(currentUser && loginExpiredForDay()){ endDailySession(); return false; }
  if(tokenSecondsLeft() > 300) return true;
  return refreshSession();
}

// Check every minute, and right away when you come back to the tab or wake the computer.
setInterval(()=>{ if(currentUser) ensureFreshToken(); }, 60 * 1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && currentUser) ensureFreshToken(); });
window.addEventListener('focus', ()=>{ if(currentUser) ensureFreshToken(); });

// Calls to the tracker's own server functions also get a fresh token automatically.
(function(){
  const _fetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if(url.startsWith('/.netlify/functions/') && init && init.headers && init.headers['Authorization'] && currentToken){
      await ensureFreshToken();
      init = { ...init, headers: { ...init.headers, 'Authorization': 'Bearer ' + (currentToken||'') } };
    }
    return _fetch(input, init);
  };
})();

// ── DRAG AND DROP ────────────────────────────────────────────
let dragJobId = null;

function handleDragStart(e, jobId){
  dragJobId = jobId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', jobId);
  setTimeout(()=>{ if(e.target) e.target.classList.add('dragging'); }, 0);
}

function handleDragEnd(e){
  if(e.target) e.target.classList.remove('dragging');
  document.querySelectorAll('.day-col').forEach(c=>c.classList.remove('drag-over'));
  dragJobId = null;
}

function handleDragOver(e, ds){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.day-col').forEach(c=>c.classList.remove('drag-over'));
  const col = document.getElementById('daycol-'+ds);
  if(col) col.classList.add('drag-over');
}

function handleDragLeave(e, ds){
  // Only remove if leaving the column entirely
  if(!e.currentTarget.contains(e.relatedTarget)){
    const col = document.getElementById('daycol-'+ds);
    if(col) col.classList.remove('drag-over');
  }
}

async function handleDrop(e, newStartDate){
  e.preventDefault();
  document.querySelectorAll('.day-col').forEach(c=>c.classList.remove('drag-over'));
  if(!dragJobId) return;
  const job = jobs.find(j=>j.id===dragJobId);
  if(!job) return;
  if(job.startDate === newStartDate) return; // no change

  // Check for equipment conflicts on the new dates
  const dur = parseInt(job.duration)||1;
  const conflicts = [];
  (job.equip||[]).forEach(eq=>{
    const conflictJob = trailerConflictJob(eq, newStartDate, dur, job.id);
    if(conflictJob) conflicts.push({ eq, conflictJob });
  });

  if(conflicts.length){
    const names = conflicts.map(c=>`${c.eq} (conflicts with ${c.conflictJob.client})`).join('\n');
    const ok = confirm(`Equipment conflict on new date:\n\n${names}\n\nMove the job anyway?`);
    if(!ok){ dragJobId=null; return; }
  }

  // Apply the move
  const oldStart = job.startDate;
  job.startDate = newStartDate;
  try{
    await dbSaveJob(job, job.id);
    render();
  } catch(err){
    job.startDate = oldStart; // revert on failure
    alert('Error moving job. Please try again.');
    render();
  }
  dragJobId = null;
}

  'Dan Sr':        '#bfdbfe', // soft blue
  'Dan Jr':        '#fbcfe8', // soft pink
  'Brandon Stith': '#fef08a', // soft yellow
  'Brandon Moore': '#bbf7d0', // soft green
  'Greg':          '#fed7aa', // soft orange

  'Wes':           '#a5f3fc', // soft cyan

  'Killer':        '#d1fae5', // soft mint
  'Sly':           '#fde8d8', // soft peach
  'Penlin':        '#e0e7ff', // soft indigo
};
const INTERN_COLOR = '#fef3c7'; // soft amber for interns
const MULTI_COLOR  = '#d1fae5'; // team green for 2+ people
const OFF_COLOR    = '#fecaca'; // soft red for off days

function getCrewColor(crew, service){
  if(!crew||!crew.length) return null;
  // Off duty — light gray-blue
  if(service==='Off') return OFF_COLOR;
  // Filter out Sub: entries
  const realCrew = crew.filter(c=>!c.startsWith('Sub:'));
  if(!realCrew.length) return null;
  // 2+ people = team green
  if(realCrew.length > 1) return MULTI_COLOR;
  // Single person
  const person = realCrew[0];
  if(CREW_COLORS[person]) return CREW_COLORS[person];
  if(person.toLowerCase().includes('intern')) return INTERN_COLOR;
  return null;
}

async function doForgotPassword(){
  const email = document.getElementById('forgot-email').value.trim();
  const errEl = document.getElementById('forgot-error');
  const sucEl = document.getElementById('forgot-success');
  const btn = document.getElementById('forgot-btn');

  btn.disabled=true; btn.textContent='Sending...';
  try{

    });

let resetAccessToken = null;

async function doResetPassword(){
  const pw = document.getElementById('reset-password').value;
  const pw2 = document.getElementById('reset-password2').value;
  const errEl = document.getElementById('reset-error');
  const sucEl = document.getElementById('reset-success');
  const btn = document.getElementById('reset-btn');
  errEl.textContent=''; sucEl.textContent='';
  if(!pw || pw.length < 8){ errEl.textContent='Password must be at least 8 characters.'; return; }
  if(pw !== pw2){ errEl.textContent='Passwords do not match.'; return; }
  if(!resetAccessToken){ errEl.textContent='Session expired. Please request a new reset link.'; return; }
  btn.disabled=true; btn.textContent='Saving...';
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method:'PUT',
      headers:{
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + resetAccessToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if(!res.ok || data.error){
      errEl.textContent = data.message || data.error_description || 'Failed to update password.';
      btn.disabled=false; btn.textContent='Set new password';
      return;
    }
    sucEl.textContent='Password updated! Signing you in...';
    currentToken = resetAccessToken;
    currentUser = data;
    isAdmin = ADMIN_EMAILS.includes((currentUser.email||'').toLowerCase());
    isScheduler = isAdmin || SCHEDULER_EMAILS.includes((currentUser.email||'').toLowerCase());
    isReportOnly = !isScheduler && REPORT_ONLY_EMAILS.includes((currentUser.email||'').toLowerCase());
    localStorage.setItem('fs_token', currentToken);
    localStorage.setItem('fs_user', JSON.stringify(currentUser));
    localStorage.setItem('fs_login_at', String(Date.now()));
    resetAccessToken = null;
    history.replaceState(null, '', window.location.pathname);
    setTimeout(()=>{ document.getElementById('reset-screen').style.display='none'; showApp(); }, 1200);
  } catch(e){
    errEl.textContent='Connection error. Please try again.';
    btn.disabled=false; btn.textContent='Set new password';
  }
}

function checkForRecoveryToken(){
  const hash = window.location.hash;
  if(!hash) return false;
  const params = new URLSearchParams(hash.replace('#',''));
  const type = params.get('type');
  const token = params.get('access_token');
  if(type === 'recovery' && token){
    resetAccessToken = token;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('reset-screen').style.display='flex';
    return true;
  }
  return false;
}

// Drag-to-scroll for site filter rows
document.addEventListener('mousedown', e=>{
  const row = e.target.closest('.site-filter-row');
  if(!row) return;
  row.dataset.dragging='1';
  row.dataset.startX = e.pageX;
  row.dataset.scrollLeft = row.scrollLeft;
  row.style.cursor='grabbing';
});
document.addEventListener('mousemove', e=>{
  const rows = document.querySelectorAll('.site-filter-row[data-dragging="1"]');
  rows.forEach(row=>{
    const dx = e.pageX - Number(row.dataset.startX);
    row.scrollLeft = Number(row.dataset.scrollLeft) - dx;
  });
});
document.addEventListener('mouseup', ()=>{
  document.querySelectorAll('.site-filter-row[data-dragging="1"]').forEach(row=>{
    row.dataset.dragging='0';
    row.style.cursor='grab';
  });
});
