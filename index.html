function billUpdateRow(k){
  const r = billState.rows[k], amt = billRowAmount(r), after = r.billedAmt + amt, over = after > r.amount + 0.5, neg = amt < -0.005;
  const cell = document.getElementById('bill-amt-'+k);
  if(cell) cell.innerHTML = `<b style="${over||neg?'color:#dc2626':''}">${arMoney(amt)}</b>${over?'<div style="font-size:10px;color:#dc2626">over the contract line</div>':neg?'<div style="font-size:10px;color:#dc2626">less than already billed</div>':amt?`<div style="font-size:10px;color:var(--text-3)">${r.amount?Math.round(after/r.amount*100):0}% after</div>`:''}`;
  const t = document.getElementById('bill-total'); if(t) t.textContent = arMoney(billState.rows.reduce((s,x)=>s+billRowAmount(x),0));
}
function billFillRemaining(){
  billState.rows.forEach(r=>{ const left = Math.max(0, r.amount - r.billedAmt);
    r.input = billState.mode==='pct' ? (r.amount && left>0.005 ? '100' : '') : billState.mode==='qty' ? (r.rate && left>0.005 ? String(Math.round(left/r.rate*10000)/10000) : '') : (left>0.005 ? String(Math.round(left*100)/100) : ''); });
  renderInvoiceBuilder();
}
function billConfirm(){

}

let sendState = null;
// Fill QuickBooks template placeholders so the preview reads like the real email
function fillQbPlaceholders(text, info){
  const due = info.due_date ? new Date(info.due_date+'T12:00:00').toLocaleDateString('en-US') : '';
  const map = { 'invoice no.':info.doc_number, 'invoice number':info.doc_number, 'customer name':info.customer, 'customer display name':info.customer, 'full name':info.customer,
    'company name':'Field Source LLC', 'balance due':arMoney(info.balance), 'amount':arMoney(info.total), 'invoice amount':arMoney(info.total), 'due date':due };
  return String(text||'').replace(/\[([^\]]+)\]/g, (m,k)=>{ const v = map[k.trim().toLowerCase()]; return v!=null && v!=='' ? v : m; });
}

async function openHandoff(estId){
  const e = estimates.find(x=>x.id===estId);
  if(!e || !e.qbNumber) return;
  const num = e.qbNumber;
  try{
    const ex = await sbFetch('GET', `/rest/v1/tracker_jobs?estimate_number=eq.${encodeURIComponent(num)}&select=estimate_number`);
    if(ex && ex.length){ alert(`Estimate #${num} is already in the tracker. One estimate, one job.`); return; }
    const qe = await sbFetch('GET', `/rest/v1/qb_estimates?estimate_number=eq.${encodeURIComponent(num)}&select=id,total,customer_name,qb_status&limit=1`);
    if(!qe || !qe.length){ alert(`Estimate #${num} isn't in the QuickBooks sync yet. Run the sync, then try again.`); return; }
    if(qe[0].qb_status!=='Accepted' && !confirm(`QuickBooks shows estimate #${num} as "${qe[0].qb_status}", not Accepted. Ryan's flow pushes only accepted estimates. Push it anyway?`)) return;
    const ql = await sbFetch('GET', `/rest/v1/qb_estimate_lines?estimate_id=eq.${qe[0].id}&item_type=eq.SalesItemLineDetail&select=line_number,description,quantity,unit_price,amount&order=line_number`);
    if(!ql || !ql.length){ alert(`QuickBooks has no priced lines on estimate #${num}.`); return; }

    const items = ql.map((l,i)=>{
      const qty = Number(l.quantity)||1, lump = qty===1;
      return { line:i+1, description:l.description||'', qty, unit: lump?'LS':'EA', rate:Number(l.unit_price)||0,
               value:Math.round((Number(l.amount)||0)*100)/100, method: lump?'lump_sum':'unit', milestone:'' };
    });
    handoff = {
      num, estId, qbTotal: Math.round((Number(qe[0].total)||0)*100)/100,
      job: { job_name: e.projectName||'', client: qe[0].customer_name||e.client||'', site:'', po_number:'',
             accepted_date: e.acceptedDate||'', job_type: e.type==='Maintenance'?'Maintenance':'Project',
             billing_mode:'billed', closeout_mode:'turnkey', pm:'', pm_email:'', billing_contact:'', billing_email:'', notes:'' },
      items, pattern:'single_day',
      sched:{ date:'', start:'', end:'', weekdaysOnly:true, days:[2], every:1, dates:'', window:'', count:1 },
      visits: [],
    };
    document.getElementById('est-detail-overlay')?.remove();
    renderHandoff();
  }catch(err){ alert('Could not start the handoff: '+err.message); }
}

function handoffGenDates(){
  const s = handoff.sched, p = handoff.pattern, out = [];
  const D = x=>new Date(x+'T12:00:00'), F = x=>x.toLocaleDateString('en-CA');
  if(p==='single_day'){ if(s.date) out.push(s.date); }
  else if(p==='contiguous' || p==='recurring'){
    if(!s.start || !s.end || D(s.end) < D(s.start)) return null;
    const start = D(s.start);
    for(let t=D(s.start); t<=D(s.end) && out.length<400; t.setDate(t.getDate()+1)){
      const w = t.getDay();
      if(p==='contiguous'){ if(s.weekdaysOnly && (w===0||w===6)) continue; out.push(F(t)); }
      else {
        const wk = Math.floor((t - start)/(7*864e5));
        if(wk % (Number(s.every)||1)===0 && s.days.includes(w)) out.push(F(t));
      }
    }
  }
  else if(p==='specific_dates'){
    s.dates.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{
      let m = x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/), y, mo, d;
      if(m){ y=+m[1]; mo=+m[2]; d=+m[3]; }
      else if((m = x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){ mo=+m[1]; d=+m[2]; y=+m[3]; if(y<100) y+=2000; }
      if(y) out.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    });
    out.sort();
  }
  else if(p==='window_tbd'){ for(let i=0;i<Math.max(1,Math.min(60,Number(s.count)||1));i++) out.push(null); }
  return out;
}

function handoffGenerate(){
  const dates = handoffGenDates();
  if(!dates || !dates.length){ alert('Fill in the schedule so at least one visit can be created.'); return; }
  const n = dates.length;
  handoff.visits = dates.map((d,i)=>({
    planned_date: d, target_window: handoff.pattern==='window_tbd' ? (handoff.sched.window||'') : '',
    alloc: handoff.items.map(it=>{
      if(it.method==='milestone') return i===n-1;
      const total = it.method==='unit' ? it.qty : 100;
      const step = it.method==='unit' ? Math.round(total/n*100)/100 : Math.round(total/n*10)/10;
      return i<n-1 ? step : Math.round((total - step*(n-1))*100)/100;
    }),
  }));
  renderHandoff();
}

function handoffChecks(){
  const res = handoff.items.map((it,li)=>{
    if(it.method==='milestone'){
      const c = handoff.visits.filter(v=>v.alloc[li]===true).length;
      return { ok: c===1, text: c===1?'milestone on 1 visit':`milestone on ${c} visits (needs exactly 1)` };
    }
    const sum = Math.round(handoff.visits.reduce((t,v)=>t+(Number(v.alloc[li])||0),0)*100)/100;
    const target = it.method==='unit' ? it.qty : 100;
    const lab = it.method==='unit' ? `${sum} of ${target} ${it.unit}` : `${sum}% of 100%`;
    return { ok: Math.abs(sum-target)<0.005, text: Math.abs(sum-target)<0.005 ? lab : `${lab} (${sum<target?'under':'over'})` };
  });
  const lineTotal = Math.round(handoff.items.reduce((t,i)=>t+i.value,0)*100)/100;
  const empty = handoff.visits.filter(v=>!v.alloc.some(a=>a===true || Number(a)>0)).length;
  return { lines: res, lineTotal, totalOk: Math.abs(lineTotal-handoff.qbTotal)<0.005, empty };
}

function handoffRefreshChecks(){
  const c = handoffChecks();
  c.lines.forEach((r,i)=>{ const el=document.getElementById('ho-chk-'+i); if(el){ el.textContent=r.text; el.style.color=r.ok?'#15803d':'#b91c1c'; } });
  const tot = document.getElementById('ho-total');
  if(tot){ tot.textContent = `Lines ${fmtEstMoney2(c.lineTotal)} vs QuickBooks ${fmtEstMoney2(handoff.qbTotal)}${c.totalOk?' ✓':' ✗ does not match'}`; tot.style.color = c.totalOk?'#15803d':'#b91c1c'; }
  const em = document.getElementById('ho-empty');
  if(em) em.textContent = c.empty ? `${c.empty} visit${c.empty===1?'':'s'} cover no work items.` : '';
}

async function saveHandoff(){
  const h = handoff, j = h.job;
  if(!j.job_name.trim() || !j.client.trim()){ alert('Job name and client are required.'); return; }
  if(!h.visits.length){ alert('Create at least one visit.'); return; }
  const c = handoffChecks();
  const problems = [];
  c.lines.forEach((r,i)=>{ if(!r.ok) problems.push(`Line ${h.items[i].line}: ${r.text}`); });
  if(!c.totalOk) problems.push(`Line total ${fmtEstMoney2(c.lineTotal)} doesn't match QuickBooks ${fmtEstMoney2(h.qbTotal)}`);
  if(c.empty) problems.push(`${c.empty} visit(s) cover no work items`);
  h.items.forEach(it=>{ if(it.method==='milestone' && !it.milestone.trim()) problems.push(`Line ${it.line}: milestone needs a name`); });
  const summary = `Push estimate #${h.num} to the tracker?\n\n${j.job_name} · ${j.client}\n${j.job_type} · ${j.billing_mode==='tracked'?'Tracked':'Billed'} · ${j.closeout_mode==='qc'?'QC / owner approved':'Turnkey'}\n${h.items.length} work items · ${h.visits.length} visits · ${fmtEstMoney2(h.qbTotal)}`
    + (problems.length ? `\n\nFLAGGED:\n- ${problems.join('\n- ')}\n\nSave anyway?` : '');
  if(!confirm(summary)) return;

  const btn = document.getElementById('ho-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const num = h.num, wid = it=>`${num}-L${String(it.line).padStart(2,'0')}`;
  let jobCreated = false;
  try{
    const dup = await sbFetch('GET', `/rest/v1/tracker_jobs?estimate_number=eq.${encodeURIComponent(num)}&select=estimate_number`);
    if(dup && dup.length) throw new Error(`Estimate #${num} was pushed by someone else in the meantime.`);
    await sbFetch('POST', '/rest/v1/tracker_jobs', {
      estimate_number: num, job_name: j.job_name.trim(), client: j.client.trim(), site: j.site, po_number: j.po_number,
      accepted_date: j.accepted_date || null, contract_total: h.qbTotal, job_type: j.job_type, status: 'Scheduled',
      pm: j.pm, pm_email: j.pm_email, foreman: '', billing_contact: j.billing_contact, billing_email: j.billing_email,
      qb_link: '', billing_tab: '', notes: j.notes, billing_mode: j.billing_mode, closeout_mode: j.closeout_mode,
      created_by: (currentUser&&currentUser.email)||'',
    });
    jobCreated = true;
    await sbFetch('POST', '/rest/v1/tracker_work_items', h.items.map(it=>({
      work_item_id: wid(it), estimate_number: num, line: it.line, qb_item: '', description: it.description,
      contract_qty: it.qty, unit: it.unit, rate: it.rate, contract_value: it.value,
      completion_method: it.method, milestone: it.method==='milestone' ? it.milestone.trim() : '',
    })));
    await sbFetch('POST', '/rest/v1/tracker_visits', h.visits.map((v,vi)=>({
      visit_id: `${num}-V${String(vi+1).padStart(2,'0')}`, estimate_number: num,
      planned_date: v.planned_date || null, target_window: v.target_window || '',
      status: v.planned_date ? 'Planned' : 'Unscheduled', crew: '',
      planned: h.items.map((it,li)=>{
        const a = v.alloc[li];
        if(it.method==='milestone') return a===true ? { work_item_id: wid(it), planned_qty:null, planned_pct:null, milestone:true } : null;
        if(!(Number(a)>0)) return null;
        return it.method==='unit'
          ? { work_item_id: wid(it), planned_qty: Number(a), planned_pct: null, milestone: null }
          : { work_item_id: wid(it), planned_qty: null, planned_pct: Number(a), milestone: null };
      }).filter(Boolean),
      actuals: {},
    })));
    document.getElementById('handoff-overlay')?.remove();
    const first = h.visits.map(v=>v.planned_date).filter(Boolean).sort()[0];
    handoff = null;
    alert(`Estimate #${num} is in the tracker.\n${h.items.length} work items, ${h.visits.length} visits${first?`, first visit ${first}`:''}.`);
    openEstimateDetail(h.estId);
  }catch(err){
    if(jobCreated){
      try{
        await sbFetch('DELETE', `/rest/v1/tracker_visits?estimate_number=eq.${encodeURIComponent(num)}`);
        await sbFetch('DELETE', `/rest/v1/tracker_work_items?estimate_number=eq.${encodeURIComponent(num)}`);
        await sbFetch('DELETE', `/rest/v1/tracker_jobs?estimate_number=eq.${encodeURIComponent(num)}`);
      }catch(e2){ console.error('Rollback failed', e2); }
    }
    alert('Nothing was saved: ' + err.message);
    btn.disabled = false; btn.textContent = 'Confirm and push to tracker';
  }
}

async function qqLoadScript(src){
  if(document.querySelector(`script[src="${src}"]`)) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load '+src)); document.head.appendChild(s); });
}

function qqImgInfo(dataUrl){
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight,im}); im.onerror=rej; im.src=dataUrl; });
}

// Shrink an uploaded logo to a white-backed JPEG (like Ryan's prep_logo) and pick its dominant colour.
async function qqPrepLogo(file){
  const raw = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  const {im} = await qqImgInfo(raw);
  const scale = Math.min(1, 360/Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width=Math.round(im.naturalWidth*scale); c.height=Math.round(im.naturalHeight*scale);
  const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
  const s = document.createElement('canvas'); s.width=s.height=120; s.getContext('2d').drawImage(c,0,0,120,120);
  const px = s.getContext('2d').getImageData(0,0,120,120).data, counts = {};
  for(let i=0;i<px.length;i+=4){
    const r=px[i],g=px[i+1],b=px[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if(mx-mn>60 && mx>70){ const k=[r,g,b].map(v=>Math.floor(v/16)*16+8).join(','); counts[k]=(counts[k]||0)+1; }
  }
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const color = top ? '#'+top[0].split(',').map(v=>(+v).toString(16).padStart(2,'0')).join('').toUpperCase() : null;
  return { data: c.toDataURL('image/jpeg',0.85), color };
}

async function qqLoadFsLogo(){

// Pick the client: fills logo/colors/contact from the client library, then address/email from QuickBooks.
async function qqPickClient(name){
  name = (name||'').trim();
  const c = (qqCustomers||[]).find(x=>x.name.toLowerCase()===name.toLowerCase());
  qq.client = name ? { id: c?c.id:null, name: c?c.name:name } : null;
  qq.logo = null; qq.color = null; qq.dark = null; qq.prefill = {};
  if(qq.client){
    try{
      const rows = await sbFetch('GET', `/rest/v1/client_profiles?client=eq.${encodeURIComponent(qq.client.name)}&select=*`);
      const p = rows && rows[0];
      if(p){ qq.logo=p.logo||null; qq.color=p.primary_color||null; qq.dark=p.dark_color||null;
             ['contact_name','contact_title','street','city_line','contact_email'].forEach(k=>{ if(p[k]) qq.prefill[k]=p[k]; }); }
    }catch(e){ console.warn(e); }
    if(c){ if(!qq.prefill.street && c.street) qq.prefill.street=c.street; if(!qq.prefill.city_line && c.city_line) qq.prefill.city_line=c.city_line;
           if(!qq.prefill.contact_email && c.email) qq.prefill.contact_email=c.email; }
  }
  if(qq.d){
    qq.d.client = qq.client ? qq.client.name : '';
    ['contact_name','contact_title','street','city_line','contact_email'].forEach(k=>{ qq.d[k] = qq.prefill[k] || ''; });
  }
  qqSaveLocal(); renderQuoteBuilder();
}

async function qqDraft(change){
  if(qq.busy) return;
  const req = change ? null : (document.getElementById('qq-request')||{}).value || qq.request;
  if(!change && !req.trim()){ alert('Describe the work first.'); return; }
  if(!change) qq.request = req;
  qq.busy = true; qq.status = change ? 'Applying your change…' : 'Drafting the quote and looking up QuickBooks prices…'; renderQuoteBuilder();
  try{
    const r = await fetch('/.netlify/functions/quote-draft', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+(currentToken||'') },
      body: JSON.stringify({ request: qq.request, draft: change ? qq.d : null, change: change||null, client: qq.client ? qq.client.name : null, clients: (typeof CLIENTS!=='undefined'?CLIENTS:[]) }),
    });
    const data = await r.json().catch(()=>({error:`Error ${r.status}`}));
    if(!r.ok) throw new Error(data.error || `Error ${r.status}`);
    const keep = qq.d || {};
    qq.d = Object.assign({ contact_name:'', contact_title:'', street:'', city_line:'', contact_email:'' }, data.draft);
    ['contact_name','contact_title','street','city_line','contact_email'].forEach(k=>{ if(keep[k]) qq.d[k]=keep[k]; else if(!qq.d[k] && qq.prefill && qq.prefill[k]) qq.d[k]=qq.prefill[k]; });
    qq.d.items = (qq.d.items||[]).map(it=>({ ...it, bullets: Array.isArray(it.bullets)?it.bullets.filter(Boolean):[] }));
    qq.d.notes = (qq.d.notes||[]).filter(Boolean); qq.d.flags = (qq.d.flags||[]).filter(Boolean);
    qq.qbItems = data.items || qq.qbItems;
    if(!qq.client && qq.d.client){ await qqPickClient(qq.d.client); }
    qq.status = '';
  }catch(err){ qq.status = '⚠️ ' + err.message; }
  qq.busy = false; qqSaveLocal(); renderQuoteBuilder();
}

    ${locked?'':`<div style="margin-top:16px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm)">

    ${qq.candidates?`<div style="margin-top:14px;background:#fef9c3;border:1px solid #fde047;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px">
      <b>Which QuickBooks customer is this?</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
      ${qq.candidates.length?qq.candidates.map(c=>`<button onclick="qqCreateEstimate('${escEst(c.id)}')" class="site-chip" style="padding:5px 10px">${escEst(c.name)}</button>`).join(''):'None close. Add the customer in QuickBooks first, or fix the client name.'}</div></div>`:''}

    <div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px;border-top:1px solid var(--border);padding-top:14px">

      ${locked
        ? `<button onclick="qqPdf(true)" class="btn-save" style="padding:8px 16px">⬇ Download final PDF</button>
           <button onclick="if(confirm('Start a new quote?')){localStorage.removeItem(QQ_KEY);openQuoteBuilder()}" class="site-chip" style="padding:8px 14px">New quote</button>`
        : `<button onclick="qqCreateEstimate()" class="btn-save" style="padding:8px 16px" ${qq.busy?'disabled':''}>Approve and create QuickBooks estimate</button>`}
    </div>`;
  }

  let overlay = document.getElementById('quote-overlay');
  if(!overlay){ overlay=document.createElement('div'); overlay.className='modal-overlay centered'; overlay.id='quote-overlay'; document.body.appendChild(overlay); }
  const prev = overlay.firstElementChild ? overlay.firstElementChild.scrollTop : 0;
  overlay.innerHTML = `<div class="modal-sheet" style="max-width:920px;max-height:92vh;overflow-y:auto"><div class="sheet-handle"></div>${body}</div>`;
  overlay.firstElementChild.scrollTop = prev;
}

function qqPickItem(i, name){
  const it = (qq.qbItems||[]).find(x=>x.name===name);
  const row = qq.d.items[i];
  if(!it){ row.qb_item_id=''; row.qb_item_name=name; qqSaveLocal(); renderQuoteBuilder(); return; }
  row.qb_item_id = it.id; row.qb_item_name = it.name;
  if(it.price!=null && (row.unit_price==null || row.price_source!=='staff' || confirm(`Use the QuickBooks price for ${it.name} ($${it.price}) instead of $${row.unit_price}?`))){
    row.unit_price = it.price; row.price_source = 'QuickBooks: '+it.name;
  }
  qqSaveLocal(); renderQuoteBuilder();
}

async function qqUploadLogo(file){
  if(!file) return;
  try{ const r = await qqPrepLogo(file); qq.logo = r.data; if(r.color) qq.color = r.color;
       else alert('The logo is only black, white or grey. Set the school colors with the color pickers.');
       qqSaveLocal(); renderQuoteBuilder(); }
  catch(e){ alert('Could not read that image.'); }
}

async function qqCreateEstimate(customerId){
  const d = qq.d;
  const bad = d.items.filter(i=>!i.qb_item_id || i.unit_price==null || i.unit_price==='');
  if(bad.length){ alert('Every line needs a QuickBooks item and a price before it can go to QuickBooks:\n- '+bad.map(i=>i.title||'(untitled line)').join('\n- ')); return; }
  if(!customerId && !confirm(`Create the QuickBooks estimate for ${d.client}, ${fmtEstMoney2(qqTotal())}?\n\nIt stays internal: nothing is sent to the client from QuickBooks.`)) return;
  qq.busy = true; qq.status = 'Creating the QuickBooks estimate…'; qq.candidates = null; renderQuoteBuilder();
  try{
    const r = await fetch('/.netlify/functions/quote-to-qb', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+(currentToken||'') },
      body: JSON.stringify({ draft: d, customerId: customerId || (qq.client && qq.client.id) || null }),
    });
    const data = await r.json().catch(()=>({error:`Error ${r.status}`}));
    if(r.status===409){ qq.candidates = data.candidates||[]; qq.status = data.error; qq.busy=false; renderQuoteBuilder(); return; }
    if(!r.ok) throw new Error(data.error||`Error ${r.status}`);
    if(data.warning) alert(data.warning);
    qq.docNumber = data.docNumber; qq.qbId = data.id; qq.status = '';
    // Add it to the Estimates tab right away (the hourly syncs fill in the rest).
    if(qq.docNumber){
      try{
        await sbFetch('POST', '/rest/v1/estimates', {
          project_name: d.title || d.client, type: 'Construction', status: 'Estimate In Progress', notes: '',
          qb_estimate_number: String(qq.docNumber), amount: Math.round(qqTotal()*100)/100, client: d.client,
          qb_status: 'Pending', est_created_date: new Date().toLocaleDateString('en-CA'), source: 'quickbooks',
          updated_at: new Date().toISOString(),
        });
        if(typeof loadEstimates==='function') loadEstimates();
      }catch(e){ console.warn('estimates row', e); }
    }
    await qqSaveClientProfile();
    qqSaveLocal();
    alert(`QuickBooks estimate ${qq.docNumber?'#'+qq.docNumber+' ':''}created (${fmtEstMoney2(data.total)}).\n\nDownload the final PDF, then email it to the client yourself.`);
  }catch(err){ qq.status = '⚠️ ' + err.message; }
  qq.busy = false; renderQuoteBuilder();
}

// Customer-facing PDF, laid out like Ryan's build_quote.py.
async function qqPdf(final){
  const d = qq.d;
  if(!qq.logo){ alert("Upload the client's logo first. The quote isn't built without it."); return; }
  await qqLoadFsLogo();
  await qqLoadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const W = 612, H = 792, M = 46, FOOT = 40;
  const hex = h=>{ h=(h||'').replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0); };
  const P = hex(qq.color||'#1B5E20'), DK = hex(qq.dark||'#111111'), INK=[17,17,17], GREY=[90,90,90], TINT=[246,246,246];
  const money = v=>(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const email = qq.preparedEmail || '';
  const fill = c=>doc.setFillColor(c[0],c[1],c[2]), ink = c=>doc.setTextColor(c[0],c[1],c[2]);
  const font = (b,s)=>{ doc.setFont('helvetica', b?'bold':'normal'); doc.setFontSize(s); };

  function chrome(){
    fill(DK); doc.rect(0,0,W,10,'F'); fill(P); doc.rect(0,10,W,4,'F');
    fill(DK); doc.rect(0,H-24,W,24,'F'); fill(P); doc.rect(0,H-27,W,3,'F');
    ink([255,255,255]); font(false,8);
    doc.text('Field Source  |  Sports Field Design-Build, Construction and Consulting', M, H-9);
    doc.text(email, W-M, H-9, {align:'right'});
  }
  let y;
  function newPage(){ doc.addPage(); chrome(); y = 40; }
  function need(h){ if(y + h > H - FOOT){ newPage(); return true; } return false; }

  chrome();
  const top = 34;
  const ci = await qqImgInfo(qq.logo);
  let lh = 84, lw = Math.min(lh*ci.w/ci.h, 150); lh = lw*ci.h/ci.w;
  doc.addImage(qq.logo, 'JPEG', M, top+42-lh/2, lw, lh);
  if(qqFsLogo){ const fw=106, fh=fw*qqFsLogo.h/qqFsLogo.w; doc.addImage(qqFsLogo.data, 'PNG', W-M-fw, top+42-fh/2, fw, fh); }
  else { ink(GREY); font(true,11); doc.text('FIELD SOURCE', W-M, top+46, {align:'right'}); }
  const tx = M + lw + 17;
  ink(INK); font(true,25); doc.text('QUOTE', tx-1, top+38);
  ink(P); font(true,10.5);
  const tl = doc.splitTextToSize(String(d.title||'').toUpperCase(), W-M-tx-120);
  doc.text(tl, tx, top+55);
  const subY = top + 55 + tl.length*13 + 1;
  ink(GREY); font(false,9.5);
  const sl = doc.splitTextToSize(String(d.subtitle||''), W-M-tx-120);
  doc.text(sl, tx, subY);
  y = Math.max(top + 96, subY + (sl.length-1)*12 + 14);
  doc.setDrawColor(P[0],P[1],P[2]); doc.setLineWidth(1.6); doc.line(M, y, W-M, y);

  // parties
  y += 18;
  const today = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const details = [ ...(qq.docNumber?[`Quote No. ${qq.docNumber}`]:[]), today, ...(d.service_period?['Service period:', d.service_period]:[]) ];
  const blocks = [
    ['PREPARED FOR', [d.contact_name, d.contact_title, d.client, d.street, d.city_line].filter(Boolean)],
    ['PREPARED BY', [qq.preparedBy, 'Field Source', 'Dublin, Ohio', email].filter(Boolean)],
    ['QUOTE DETAILS', details],
  ];
  [M, M+200, M+385].forEach((x,bi)=>{
    const [lab, lines] = blocks[bi];
    ink(P); font(true,7.5); doc.text(lab, x, y);
    lines.forEach((t,i)=>{ font(i===0,9.5); ink(i===0?INK:GREY); doc.text(String(t), x, y+14+i*12.5, {maxWidth: bi===2?W-M-x:180}); });
  });
  y += 14 + Math.max(...blocks.map(b=>b[1].length)) * 12.5 + 8;

  if(d.intro){ font(false,9.6); ink(INK); const t=doc.splitTextToSize(d.intro, W-2*M); doc.text(t, M, y+8); y += t.length*13 + 10; }
  if(d.goal){
    font(true,10); const t = doc.splitTextToSize(d.goal, W-2*M-104); const gh = t.length*13.8 + 14;
    fill(TINT); doc.rect(M, y, W-2*M, gh, 'F'); fill(P); doc.rect(M, y, 4, gh, 'F');
    ink(P); font(true,7.5); doc.text('PROGRAM GOAL', M+14, y+16);
    ink(INK); font(true,10); doc.text(t, M+92, y+16);
    y += gh + 10;
  }

  // line items
  const X0 = M, X4 = W-M, cQ = X4-190, cR = X4-85, dw = cQ-30-(X0+34);
  function thead(){
    fill(DK); doc.rect(X0, y, X4-X0, 20, 'F');
    ink([255,255,255]); font(true,8);
    doc.text('DESCRIPTION', X0+10, y+13.5); doc.text('QTY', cQ, y+13.5, {align:'center'});
    doc.text('UNIT PRICE', cR, y+13.5, {align:'right'}); doc.text('AMOUNT', X4-10, y+13.5, {align:'right'});
    y += 20;
  }
  thead();
  let total = 0;
  d.items.forEach((it,n)=>{
    font(false,8.9);
    const bl = (it.bullets||[]).filter(Boolean).map(b=>doc.splitTextToSize(b, dw-10));
    const hh = 26 + bl.reduce((t,l)=>t+l.length*12.3,0) + 6;
    if(need(hh)) thead();
    if(n%2){ fill(TINT); doc.rect(X0, y, X4-X0, hh, 'F'); }
    const qty = Number(it.qty)||0, up = Number(it.unit_price)||0, amt = qty*up; total += amt;
    ink(P); font(true,11); doc.text(String(n+1), X0+10, y+19);
    ink(INK); font(true,10.5); doc.text(String(it.title||''), X0+34, y+19, {maxWidth: dw});
    font(false,9.8); doc.text(String(qty), cQ, y+19, {align:'center'}); doc.text(money(up), cR, y+19, {align:'right'});
    font(true,10); doc.text(money(amt), X4-10, y+19, {align:'right'});
    let by = y + 33; ink(GREY); font(false,8.9);
    bl.forEach(lines=>{ doc.text('•', X0+34, by); doc.text(lines, X0+43, by); by += lines.length*12.3; });
    y += hh;
  });
  need(34);
  doc.setDrawColor(P[0],P[1],P[2]); doc.setLineWidth(1.2); doc.line(cR-60, y+6, X4, y+6);
  ink(INK); font(true,11); doc.text('TOTAL', cR, y+22, {align:'right'}); doc.text(money(total), X4-10, y+22, {align:'right'});
  y += 36;

  const notes = (d.notes||[]).filter(Boolean);
  if(notes.length){
    need(30); ink(P); font(true,7.5); doc.text('NOTES', M, y+8); y += 18;
    notes.forEach(nt=>{ font(false,8.9); const t=doc.splitTextToSize(nt, W-2*M-12); need(t.length*12.3+2); ink(GREY); doc.text('•', M, y); doc.text(t, M+9, y); y += t.length*12.3 + 2; });
    y += 6;
  }

  // acceptance
  need(90);
  ink(P); font(true,7.5); doc.text('ACCEPTANCE', M, y+10); y += 44;
  doc.setDrawColor(150,150,150); doc.setLineWidth(0.6);
  [[M, [d.contact_name&&d.contact_title?`${d.contact_name}, ${d.contact_title}`:(d.contact_name||'Authorized signature'), d.client]],
   [W/2+10, [qq.preparedBy, 'Field Source']]].forEach(([x,lines])=>{
    doc.line(x, y, x+220, y);
    ink(INK); font(true,9); doc.text(String(lines[0]||''), x, y+13);
    ink(GREY); font(false,8.5); doc.text(String(lines[1]||''), x, y+25); doc.text('Date: ____________', x+130, y+25);
  });

  doc.setProperties({ title: 'Quote - '+(d.title||''), author: 'Field Source' });
  const name = `${new Date().toLocaleDateString('en-CA')} ${d.client||''} Quote${qq.docNumber?' '+qq.docNumber:''} - ${d.title||''}`.replace(/[\\/:*?"<>|]/g,'').trim()+'.pdf';
  if(final) doc.save(name);
  else window.open(URL.createObjectURL(doc.output('blob')), '_blank');
}

// ── FUEL TRACKING ────────────────────────────────────────────
let fuelTransactions = [];
let fuelView = 'transactions'; // 'transactions','vehicles','persons','trends'
let fuelImporting = false;
let fuelLoaded = false;

// ── WEX cards & drivers: who and what each fill-up really is ──
let fleetCards = {};    // card_number -> {name, kind, assigned_to, ...}
let fleetDrivers = {};  // driver_id -> {wex_name, person, is_vehicle}
async function loadFleetMaps(){
  try{
    const [c, d] = await Promise.all([ sbFetch('GET','/rest/v1/fleet_cards?select=*'), sbFetch('GET','/rest/v1/fleet_drivers?select=*') ]);
    fleetCards = {}; (c||[]).forEach(x=>fleetCards[x.card_number]=x);
    fleetDrivers = {}; (d||[]).forEach(x=>fleetDrivers[x.driver_id]=x);
  }catch(e){ console.warn('Fleet cards/drivers not set up yet', e.message); }
}
// Names to pick from: people in WEX, anyone already assigned, plus the tracker's crew and logins
// (so people without a WEX Driver ID, like Cameron, can still be chosen). Short names that match a
// full name already in the list (Wes vs Wes Ganobcik) are left out to avoid doubles.
function fleetPeople(){
  const full = new Set();
  Object.values(fleetDrivers).forEach(d=>{ if(d.person && !isShared(d.person)) full.add(d.person); });
  Object.values(fleetCards).forEach(c=>{ if(c.assigned_to && !isShared(c.assigned_to)) full.add(c.assigned_to); });
  const extra = [ ...(typeof CREW!=='undefined'?CREW:[]), ...(typeof USER_DISPLAY_NAMES!=='undefined'?Object.values(USER_DISPLAY_NAMES):[]) ]
    .map(n=>String(n).replace(/\s*-\s*Intern$/i,'').trim()).filter(n=>n && !/^(off|shop|home)$/i.test(n));
  const lower = [...full].map(n=>n.toLowerCase());
  extra.forEach(n=>{ const l = n.toLowerCase(); if(!lower.some(f=>f===l || f.startsWith(l+' '))) { full.add(n); lower.push(l); } });
  return [...full].sort((a,b)=>a.localeCompare(b));
}
let _cardIdx = null, _cardIdxFor = null;
function fuelCardOf(r){
  if(r.cardNumber && fleetCards[r.cardNumber]) return fleetCards[r.cardNumber];
  if(_cardIdxFor !== fleetCards){
    _cardIdxFor = fleetCards; _cardIdx = { byDesc:{}, byName:{}, byEmboss:{} };
    Object.values(fleetCards).forEach(c=>{
      const add = (m,k)=>{ k = String(k||'').trim().toUpperCase(); if(!k) return; (m[k] = m[k]||[]).push(c); };
      add(_cardIdx.byDesc, c.vehicle_desc); add(_cardIdx.byName, c.name); add(_cardIdx.byEmboss, c.emboss);
    });
  }
  const one = (m,k)=>{ const l = m[String(k||'').trim().toUpperCase()]; return l && l.length===1 ? l[0] : null; };
  return one(_cardIdx.byDesc, r.vehicleId) || one(_cardIdx.byName, r.vehicleId) || one(_cardIdx.byEmboss, r.cardHolder) || one(_cardIdx.byName, r.cardHolder) || null;
}
function fuelCardKind(r){
  const c = fuelCardOf(r);
  if(c && c.kind) return c.kind==='Can' ? 'Can' : 'Truck';
  return r.category || 'Can';
}
// Who: the driver ID's person → else the card's assigned person → else WEX's name.
// "Shared (no one)" on a truck-number ID or a card means it's a pool vehicle: fuel shows as "Shared: <vehicle>".
const isShared = v=>/^shared/i.test(String(v||'').trim());
// Older fill-ups have no Driver ID, only the driver name WEX used then. Match that name to a Driver ID:
// exactly ("TR12 - 0543 Moore"), or by truck number when WEX has since renamed it ("TR12 - BMoore Moore" -> TR12).
let _drvIdx = null, _drvIdxFor = null;
function fuelDriverOf(r){
  if(r.driverId && fleetDrivers[r.driverId]) return fleetDrivers[r.driverId];
  const name = `${r.driverFirst||''} ${r.driverLast||''}`.replace(/\s+/g,' ').trim().toUpperCase();
  if(!name) return null;
  if(_drvIdxFor !== fleetDrivers){
    _drvIdxFor = fleetDrivers; _drvIdx = { byName:{}, byTruck:{} };
    Object.values(fleetDrivers).forEach(d=>{
      const n = String(d.wex_name||'').replace(/\s+/g,' ').trim().toUpperCase(); if(n) (_drvIdx.byName[n] = _drvIdx.byName[n]||[]).push(d);
      const t = (n.match(/^(TR\s*\d+)\b/)||[])[1]; if(t && d.is_vehicle) (_drvIdx.byTruck[t.replace(/\s+/g,'')] = _drvIdx.byTruck[t.replace(/\s+/g,'')]||[]).push(d);
    });
  }
  const exact = _drvIdx.byName[name]; if(exact && exact.length===1) return exact[0];
  const t = (name.match(/^(TR\s*\d+)\b/)||[])[1];
  const byT = t && _drvIdx.byTruck[t.replace(/\s+/g,'')]; if(byT && byT.length===1) return byT[0];
  return null;
}
function fuelPersonInfo(r){
  const d = fuelDriverOf(r);
  const c = fuelCardOf(r);
  const shared = ()=>({ name:`Shared: ${cleanFuelVehicle(r)}`, linked:true, shared:true });
  if(d && d.person && !isShared(d.person)) return { name:d.person, linked:true };
  if(c && c.assigned_to && !isShared(c.assigned_to)) return { name:c.assigned_to, linked:true };
  if((d && isShared(d.person)) || (c && isShared(c.assigned_to))) return shared();
  if(d && !d.is_vehicle && d.wex_name) return { name:d.wex_name, linked:true };
  if(d && d.is_vehicle) return { name:`Not linked: ${d.wex_name}`, linked:false };
  if(/^TR\s*\d+/i.test(r.driverFirst||'')) return { name:`${r.driverFirst} ${r.driverLast}`.trim(), linked:false };
  return { name:null, linked:false };
}
async function fleetUpsert(table, conflict, rows){
  if(!rows.length) return;
  if(typeof ensureFreshToken==='function') await ensureFreshToken();
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflict}`, {
    method:'POST', headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+sbToken(), 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(rows) });
  if(!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0,200)}`);
}
function wexParseCSV(text){
  const lines = text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
  const parse = line=>{ const out=[]; let cur='', q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){ if(q && line[i+1]==='"'){ cur+='"'; i++; } else q=!q; } else if(ch===',' && !q){ out.push(cur.trim()); cur=''; } else cur+=ch; } out.push(cur.trim()); return out; };
  const headers = parse(lines[0]||'');
  return { headers, rows: lines.slice(1).map(l=>{ const v = parse(l); const o = {}; headers.forEach((h,i)=>o[h]=v[i]??''); return o; }) };
}
let fuelLastStatus = '';
function fuelImportDone(msg){
  fuelLastStatus = msg;
  const st = document.getElementById('fuel-import-status'); if(st) st.textContent = msg;
  alert(msg);
}
// One button for all three WEX exports (any unexpected error is shown instead of failing silently)
async function importWexFile(file){
  try{ return await importWexFileInner(file); }
  catch(e){ console.error(e); const msg = 'Import stopped: ' + (e && e.message || e); fuelLastStatus = msg; const st = document.getElementById('fuel-import-status'); if(st) st.textContent = msg; alert(msg); }
}
async function importWexFileInner(file){
  const text = await file.text();
  if(!text.trim()){ alert("That file is empty (0 bytes). Download it from WEX again and make sure the download finishes."); return; }
  const { headers } = wexParseCSV(text.split(/\r?\n/)[0]);
  if(headers.includes('Trans ID')) return importFuelCSV(file);                       // Transactions (also has Driver Prompt ID, so check it first)
  if(headers.includes('Usage Type') && headers.includes('Card Number')) return importWexCards(text);
  if(headers.includes('Driver Prompt ID') && headers.includes('Last Name')) return importWexDrivers(text);
  alert("This doesn't look like a WEX Transactions, Cards, or Drivers export.");
}
async function importWexCards(text){
  const statusEl = document.getElementById('fuel-import-status');
  const { rows } = wexParseCSV(text);
  const known = new Set(Object.keys(fleetCards));
  const people = Object.values(fleetDrivers).filter(d=>!d.is_vehicle && d.person).map(d=>d.person);
  const guess = name=>{ // pool cards are shared; otherwise only when exactly one person matches the card's first word(s)
    if(/^(office|dump|spare)\b/i.test(name.trim())) return 'Shared (no one)';
    const n = name.replace(/\b(can|truck|vehicle)\b/ig,'').trim().toLowerCase(); if(!n) return '';
    const hits = people.filter(p=>{ const pl = p.toLowerCase(); return pl===n || pl.startsWith(n+' ') || (n.split(' ').length===2 && pl.startsWith(n.split(' ')[0]+' '+n.split(' ')[1][0])); });
    return hits.length===1 ? hits[0] : '';
  };
  const fresh = [], existing = [];
  rows.forEach(r=>{
    const num = r['Card Number']; if(!num) return;
    const name = (r['Custom Vehicle/Asset ID'] && r['Custom Vehicle/Asset ID']!=='N/A' ? r['Custom Vehicle/Asset ID'] : '') || r['Vehicle Description'] || r['Emboss Line 2'] || num;
    const base = { card_number:num, name, kind: /\bcan\b/i.test(name) ? 'Can' : 'Vehicle', vin:r['VIN']||'', plate:r['License Plate']||'', status:r['Status']||'',
      emboss:(r['Emboss Line 2']||'').trim(), vehicle_desc:(r['Vehicle Description']||'').trim(), updated_at:new Date().toISOString() };
    if(known.has(num)) existing.push(base); else fresh.push({ ...base, assigned_to: guess(name) });
  });
  try{ await fleetUpsert('fleet_cards','card_number', fresh); await fleetUpsert('fleet_cards','card_number', existing); }
  catch(e){ alert('Could not save cards: '+e.message+'\n\nHas fleet-cards-drivers.sql been run in Supabase?'); return; }
  await loadFleetMaps();
  fuelView = 'setup'; renderFuel();
  fuelImportDone(`✓ Cards imported: ${fresh.length} new, ${existing.length} updated. Assignments you already set were kept.`);
}
async function importWexDrivers(text){
  const statusEl = document.getElementById('fuel-import-status');
  const { rows } = wexParseCSV(text);
  const isVeh = r=>/^TR\s*\d+/i.test(r['First Name']||'') || /^truck\b/i.test(r['Last Name']||'') || /^\d{4}$/.test(r['Last Name']||'');
  const realPeople = rows.filter(r=>!isVeh(r)).map(r=>({ first:r['First Name'], last:r['Last Name'], full:`${r['First Name']} ${r['Last Name']}`.trim() }));
  const known = new Set(Object.keys(fleetDrivers));
  const fresh = [], existing = [];
  rows.forEach(r=>{
    const id = r['Driver Prompt ID']; if(!id) return;
    const veh = isVeh(r), wexName = `${r['First Name']} ${r['Last Name']}`.trim();
    let person = '';
    if(!veh) person = wexName;
    else if(/^dump$/i.test((r['Last Name']||'').trim())) person = 'Shared (no one)';   // dump truck: credited to whoever keys in their own ID
    else { const same = realPeople.filter(p=>p.last.toLowerCase()===(r['Last Name']||'').toLowerCase()); if(same.length===1) person = same[0].full; }
    const base = { driver_id:id, wex_name:wexName, is_vehicle:veh, status:r['Status']||'', updated_at:new Date().toISOString() };
    if(known.has(id)) existing.push(base); else fresh.push({ ...base, person });
  });
  try{ await fleetUpsert('fleet_drivers','driver_id', fresh); await fleetUpsert('fleet_drivers','driver_id', existing); }
  catch(e){ alert('Could not save drivers: '+e.message+'\n\nHas fleet-cards-drivers.sql been run in Supabase?'); return; }
  await loadFleetMaps();
  fuelView = 'setup'; renderFuel();
  fuelImportDone(`✓ Drivers imported: ${fresh.length} new, ${existing.length} updated. Anyone already linked was kept.`);
}

function classifyFuel(embossLine2, vehicleDesc){
  const e = (embossLine2||'').toUpperCase();
  const v = (vehicleDesc||'').toUpperCase();
  if(e.includes('CAN') || e.includes('SPARE')) return 'Can';
  if(v.includes('CAN') || v.includes('SPARE')) return 'Can';
  if(vehicleDesc && vehicleDesc !== '0' && vehicleDesc.trim()) return 'Truck';
  return 'Can';
}

function parseWEXDate(s){
  // MM/DD/YYYY -> YYYY-MM-DD
  if(!s) return null;
  const parts = s.split('/');
  if(parts.length===3) return `${parts[2]}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}`;
  return s;
}

async function importFuelCSV(file){
  const text = await file.text();
  const lines = text.split('\n').filter(l=>l.trim());
  if(!lines.length){ alert('Empty file'); return; }

  // Parse CSV properly (handle quoted fields)
  function parseCSVLine(line){
    const result = []; let current = ''; let inQuote = false;
    for(let i=0; i<line.length; i++){
      if(line[i]==='"'){ inQuote=!inQuote; }
      else if(line[i]===',' && !inQuote){ result.push(current.trim()); current=''; }
      else { current+=line[i]; }
    }
    result.push(current.trim());
    return result;
  }

  const headers = parseCSVLine(lines[0]);
  const col = (name) => headers.indexOf(name);

  const statusEl = document.getElementById('fuel-import-status');
  if(statusEl) statusEl.textContent = 'Processing...';

  // Get existing wex_trans_ids for dedup
  const existingIds = new Set();
  for(let from=0; from<200000; from+=1000){
    const r = await fetch(`${SUPABASE_URL}/rest/v1/fuel_transactions?select=wex_trans_id`, { headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+sbToken(), Range:`${from}-${from+999}` } });
    const page = r.ok ? await r.json() : [];
    page.forEach(x=>existingIds.add(x.wex_trans_id));
    if(page.length < 1000) break;
  }
  const seenInFile = {};

  let added=0, skipped=0, errors=0;
  const rows = [];

  for(let i=1; i<lines.length; i++){
    const vals = parseCSVLine(lines[i]);
    if(vals.length < 10) continue;
    const baseId = vals[col('Trans ID')]||'';
    // WEX can put two lines on one transaction (fuel + coupon/discount); keep both with distinct keys
    seenInFile[baseId] = (seenInFile[baseId]||0) + 1;
    const wexId = seenInFile[baseId]===1 ? baseId : `${baseId}-${(vals[col('Product')]||'line').trim()}${seenInFile[baseId]>2?'-'+seenInFile[baseId]:''}`;
    const isExisting = existingIds.has(wexId);

    const emboss = vals[col('Emboss Line 2')]||'';
    const vehicleDesc = vals[col('Vehicle Description')]||'';
    const assetId = (vals[col('Custom Vehicle/Asset ID')]||'').trim();
    const cardName = (assetId && assetId!=='N/A' ? assetId : '') || vehicleDesc || emboss;
    const known = fleetCards[vals[col('Card Number')]||''];
    const category = known ? (known.kind==='Can'?'Can':'Truck') : (cardName ? (/\bcan\b/i.test(cardName)?'Can':'Truck') : classifyFuel(emboss, vehicleDesc));
    let driverId = '';
    [[col('Prompt 1 Type'),col('Prompt 1 Value')],[col('Prompt 2 Type'),col('Prompt 2 Value')]].forEach(([t,v])=>{ if(t>=0 && /driver/i.test(vals[t]||'') && !driverId) driverId = (vals[v]||'').trim(); });

    const driverLast = vals[col('Driver Last Name')]||'';
    const driverFirst = vals[col('Driver First Name')]||'';

    const row = {
      transaction_date: parseWEXDate(vals[col('Transaction Date')]),
      driver_last_name: driverLast,
      driver_first_name: driverFirst,
      card_holder: emboss,
      vehicle_id: vehicleDesc,
      fuel_category: category,
      product: vals[col('Product')]||'',
      gallons: parseFloat(vals[col('Units')])||0,
      unit_cost: parseFloat(vals[col('Unit Cost')])||0,
      net_cost: parseFloat(vals[col('Net Cost')])||0,
      odometer: parseInt(vals[col('Current Odometer')])||0,
      distance_driven: parseInt(vals[col('Distance Driven')])||0,
      fuel_economy: parseFloat(vals[col('Fuel Economy')])||0,
      cost_per_distance: parseFloat(vals[col('Cost Per Distance')])||0,
      merchant_name: vals[col('Merchant Name')]||'',
      wex_trans_id: wexId,
      card_number: vals[col('Card Number')]||'',
      card_name: cardName,
      driver_id: driverId,
    };
    if(!row.transaction_date || !wexId) continue;
    row._existing = isExisting;
    rows.push(row);
  }

  // Insert in batches of 50
  const errMsgs = [];
  const clean = r=>{ const o = { ...r }; delete o._existing; return o; };
  for(let i=0; i<rows.length; i+=50){
    const batch = rows.slice(i, i+50);
    try {
      await fleetUpsert('fuel_transactions', 'wex_trans_id', batch.map(clean));   // new rows added, existing ones get card/driver filled in
      batch.forEach(r=>r._existing ? skipped++ : added++);
    } catch(e){
      // Retry one at a time so a single problem row doesn't block the rest
      for(const row of batch){
        try{ await fleetUpsert('fuel_transactions', 'wex_trans_id', [clean(row)]); row._existing ? skipped++ : added++; }
        catch(e2){ errors++; if(errMsgs.length<3) errMsgs.push(`${row.transaction_date} #${row.wex_trans_id}: ${String(e2.message||e2).slice(0,140)}`); }
      }
    }
    if(statusEl) statusEl.textContent = `Processing... ${added} added so far`;
  }
  if(errMsgs.length) console.error('Fuel import errors:', errMsgs);

  await loadFuelTransactions();
  const total = fuelTransactions.length;
  fuelImportDone(`✓ Transactions imported: ${added} new, ${skipped} already here (card and driver details refreshed), ${errors} error${errors===1?'':'s'}. ${total} total fill-ups.`);
  if(errors) alert(`${errors} transaction${errors===1?'':'s'} couldn't be imported:\n\n${errMsgs.join('\n')}${errors>errMsgs.length?'\n…':''}`);
  renderFuelDashboard();
}

function fmtCur(n){ return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtGal(n){ return Number(n||0).toFixed(2)+'gal'; }
function fmtNum(n,d=2){ return Number(n||0).toFixed(d); }
function fmtDate(s){ if(!s) return ''; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}); }

const WEX_NAME_MAP = {
  'DAN H': 'Dan Haller', 'DAN H CAN': 'Dan Haller',
  'DAN T': 'Dan Trubisky', 'DAN T CAN': 'Dan Trubisky',
  'BRANDON': 'Brandon Moore', 'BRANDON CAN': 'Brandon Moore',
  'GREG': 'Greg Crenshaw', 'GREG CAN': 'Greg Crenshaw',
  'MATT': 'Matt Neff', 'MATT CAN': 'Matt Neff',

  'WES': 'Wes Ganobcik', 'WES CAN': 'Wes Ganobcik',
  'MIKE CAN': 'Mike Haller',
  'OFFICE VEHICLE': 'Office Vehicle',
};
const WEX_VEHICLE_MAP = {
  'TR3 - 2023 LT': '2023 Silverado LT (Wes)',
  'TR5 - RST': '2024 Silverado RST (Stith)',
  'TR6 - Greg': '2025 Silverado LT (Greg)',
  'TR9 - Jr.': '2024 Ford F450 (Jr)',
  'TR10 - Dump': '2017 Ford F550 Dump',
  'TR12 - BMoore': '2026 Silverado 3500HD (Moore)',
  'TR15 - Senior': '2026 Silverado 3500HD (Senior)',
  'TR16 - Stith': '2026 Silverado 3500HD (Stith)',
};
function cleanFuelDriver(r){
  const who = fuelPersonInfo(r); if(who.name) return who.name;
  const card = (r.cardHolder||'').toUpperCase().trim();
  if(WEX_NAME_MAP[card]) return WEX_NAME_MAP[card];
  if(r.driverFirst && r.driverLast) return `${r.driverFirst} ${r.driverLast}`;
  return r.cardHolder||'Unknown';
}
function cleanFuelVehicle(r){
  const c = fuelCardOf(r); if(c) return c.name;
  if(r.cardName) return r.cardName;
  const v = (r.vehicleId||'').trim();
  for(const [k,label] of Object.entries(WEX_VEHICLE_MAP)){
    if(v.startsWith(k)) return label;
  }
  return v || r.cardHolder || 'Unknown';
}

function exportFuelCSV(){
  const headers = ['Date','Driver Last','Driver First','Card Holder','Vehicle','Category','Product','Gallons','Unit Cost','Net Cost','Odometer','Distance','Fuel Economy','Cost/Distance','Merchant'];
  const rows = fuelTransactions.map(r=>[r.date,r.driverLast,r.driverFirst,r.cardHolder,r.vehicleId,r.category,r.product,r.gallons,r.unitCost,r.netCost,r.odometer,r.distance,r.economy,r.costPerDist,r.merchant]);
  const csv = [headers,...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'field-source-fuel-'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
}

function setView(v){
  view=v;
  if(v!=='equipment') offset=0;
  document.querySelectorAll('.vtab').forEach(t=>t.classList.remove('active'));
  // idx maps to vtab position within the ACTIVE bar
  const trackerIdx={week:0,next:1,month:2,list:3,mileage:4,equipment:5,reports:6,timeoff:7,hours:8,workorders:9};
  const bizopsIdx={pipeline:0,po:1,costs:2,clients:3,labor:4,costing:5};
  const allIdx={...trackerIdx,...bizopsIdx,'consulting-home':0};
  // Find the right bar and highlight correct tab
  const barId = ['week','next','month','list','equipment','reports','timeoff','hours','workorders','mileage'].includes(v)?'tracker-bar':['pipeline','po','costs','clients','labor','costing','estimates','invoices','inv-approval','materials','receivables'].includes(v)?'bizops-bar':['fleet-loans','fuel'].includes(v)?'fleet-bar':'consulting-bar';
  const bar = document.getElementById(barId);
  const barTabs = bar ? Array.from(bar.querySelectorAll('.vtab')) : [];
  // Business Ops tabs are highlighted by id (button order no longer matches index)
  const BIZOPS_TAB_IDS={po:'po-tab',costs:'costs-tab',pipeline:'pipeline-tab',costing:'costing-tab',labor:'labor-tab',clients:'clients-tab',estimates:'estimates-tab',invoices:'invoices-tab','inv-approval':'inv-approval-tab',materials:'materials-tab',receivables:'receivables-tab'};
  const byId = BIZOPS_TAB_IDS[v] && document.getElementById(BIZOPS_TAB_IDS[v]);
  if(byId) byId.classList.add('active');
  else { const localIdx = allIdx[v]; if(barTabs[localIdx]) barTabs[localIdx].classList.add('active'); }
  const hideNav = v==='reports'||v==='workorders'||v==='timeoff'||v==='mileage'||v==='pipeline'||v==='po'||v==='hours'||v==='consulting-home'||v==='pm'||v==='consulting-deadlines'||v==='costs'||v==='clients'||v==='labor'||v==='costing'||v==='fleet-loans'||v==='fuel'||v==='estimates'||v==='invoices'||v==='inv-approval'||v==='materials'||v==='receivables';
  const legendBar = document.getElementById('legend-bar');
  const navRow = document.querySelector('.nav-row');
  if(legendBar) legendBar.style.display=(v==='equipment'||hideNav)?'none':'flex';
  if(navRow && currentPortal==='tracker') navRow.style.display=hideNav?'none':'flex';
  requestAnimationFrame(()=>render());

function renderWeekByPerson(days){
  const todayStr = isoDate(today());
  const allCrew = (crewFilter && crewFilter!=='All') ? [crewFilter] : CREW;

  // Build header
  let html = '<div class="week-scroll" id="person-view-scroll"><table style="border-collapse:collapse;min-width:700px;width:100%">';
  html += '<thead><tr>';
  html += '<th style="padding:8px 10px;font-size:11px;color:var(--text-3);font-weight:600;border-bottom:2px solid var(--border);border-right:1px solid var(--border);background:var(--surface);position:sticky;left:0;z-index:2;min-width:90px;text-align:left">Person</th>';
  days.forEach((d,i)=>{
    const ds = isoDate(d);
    const isToday = ds===todayStr;
    html += `<th style="padding:8px 6px;font-size:11px;font-weight:600;border-bottom:2px solid var(--border);border-right:1px solid var(--border);background:${isToday?'var(--green-light)':'var(--surface)'};color:${isToday?'var(--green-dark)':'var(--text-2)'};text-align:center;min-width:110px">${DOW[i]}<br><span style="font-size:13px;font-weight:700;color:${isToday?'var(--green-dark)':'var(--text)'}">${d.getDate()}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  // One row per crew member
  allCrew.forEach(person=>{
    html += '<tr>';
    // Person label with their color
    const personColor = CREW_COLORS[person] || (person.toLowerCase().includes('intern') ? INTERN_COLOR : 'var(--surface)');
    html += `<td style="padding:6px 8px;font-size:12px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:${personColor};position:sticky;left:0;z-index:1;vertical-align:top">${person}</td>`;
    
    days.forEach(d=>{
      const ds = isoDate(d);
      const isToday = ds===todayStr;
      const personJobs = jobsForDate(ds).filter(j=>{
        const crew = j.crew||[];
        if(!crew.some(c=>c===person||c===('Sub:'+person))) return false;
        // If job has per-person days, check if this person works this date
        if(j.crewDays) return jobDatesForPerson(j,person).includes(ds);
        return true;
      });
      html += `<td style="padding:4px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top;background:${isToday?'rgba(42,106,34,0.04)':''}">`;
      if(!personJobs.length){
        // Check time off
        if(isPersonOff(person, ds)){
          html += `<div style="font-size:10px;color:#b45309;background:#fef3c7;border-radius:4px;padding:3px 5px;text-align:center">Off</div>`;
        } else {
          html += `<div style="color:var(--text-3);font-size:11px;text-align:center;padding:6px 0">—</div>`;
        }
      } else {
        personJobs.forEach(j=>{
          const isOff = (j.services&&j.services.includes('Off'))||(j.service==='Off');
          const bg = isOff ? '#fecaca' : (getCrewColor(j.crew||[], j.service||'') || 'var(--card)');
          const services = (j.services&&j.services.length?j.services:j.service?[j.service]:[]).join(', ');
          html += `<div class="person-chip" style="background:${bg};border-color:${bg}" onclick="openModal('${j.id}')">
            <div class="person-chip-client">${j.client.length>18?j.client.slice(0,17)+'…':j.client}</div>
            <div class="person-chip-detail">${services}${j.field?' · '+j.field:''}</div>
          </div>`;
        });
      }
      html += '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('main-content').innerHTML = crewFilterBar() + statsBar() + html;
}

function renderWeek(){
  const ws=weekStart(today(),(view==='next'?1:0)+offset);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d});
  document.getElementById('period-label').textContent=
    days[0].toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+
    days[6].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  if(weekViewMode==='person'){
    renderWeekByPerson(days);
    return;
  }
  const todayStr=isoDate(today());
  const canDrag=isScheduler; // schedulers and admins can drag
  const offToday={}; days.forEach(d=>{ offToday[isoDate(d)]=getOffPeopleOnDate(isoDate(d)); });
  let html='<div class="week-scroll"><div class="week-grid">';
  days.forEach((d,i)=>{
    const ds=isoDate(d);
    const dayJobs=jobsForDate(ds);
    const offPpl = offToday[ds]||[];
    const offBadge = offPpl.length ? `<div style="font-size:10px;color:#b45309;margin-top:2px">${offPpl.join(', ')} off</div>` : '';
    html+=`<div class="day-col" id="daycol-${ds}"
      ondragover="handleDragOver(event,'${ds}')"
      ondragleave="handleDragLeave(event,'${ds}')"
      ondrop="handleDrop(event,'${ds}')">
      <div class="day-header${ds===todayStr?' today':''}">${DOW[i]}<br><strong>${d.getDate()}</strong>${offBadge}</div>`;
    if(!dayJobs.length) html+=`<div class="empty-col">—</div>`;
    dayJobs.forEach(j=>{
      const st=statusMeta(getStatus(j));
      const dur=parseInt(j.duration)||1;
      const crewOnDate = crewForDate(j, ds);
      // If job has crewDays set and nobody is working this date, skip showing the chip
      if(j.crewDays && crewOnDate.length === 0) return;
      const crew=crewOnDate.map(c=>c.startsWith('Sub:')?'Sub: '+(c.slice(4)||'?'):c).join(', ');
      const trailers=(j.equip||[]).filter(e=>EQUIPMENT.Trailers.includes(e));
      const specialty=(j.equip||[]).filter(e=>EQUIPMENT.Specialty.includes(e));
      const chipEquip=[...trailers,...specialty];
      function shortName(n){
        return n
          .replace('Ford F550 ','').replace('Dump Truck','Dump')
          .replace(' Landscape','').replace(' Enclosed','')
          .replace('2025 ','').replace('2024 ','').replace('2023 ','').replace('2026 ','')
          .replace('2010','').replace('2021','').replace('2004','')
          .replace('Ingersoll Rand ','').replace('Wacker Neuson ','').replace('Smithco ','')
          .trim()
      }
      const crewColor=getCrewColor(crewOnDate, j.service||'');
      const crewStyle=crewColor?`style="background:${crewColor};border-color:${crewColor}"`:'';
      const isOff = (j.services&&j.services.includes('Off'))||(j.service==='Off');
      html+=`<div class="job-chip ${st.cls}${isOff?' job-off':''}" ${crewColor?`style="background:${crewColor};border-left:3px solid rgba(0,0,0,0.15)"`:''} 
        ${canDrag?`draggable="true"
          ondragstart="handleDragStart(event,'${j.id}')"
          ondragend="handleDragEnd(event)"
          title="Drag to reschedule"`:''}
        onclick="openModal('${j.id}')">
        <div class="chip-client">${j.client.length>16?j.client.slice(0,15).trim()+'…':j.client}${dur>1?`<span class="duration-badge">${dur}d</span>`:''}</div>
        <div class="chip-detail">${j.task?j.task+' · ':''} ${(j.services&&j.services.length?j.services:j.service?[j.service]:[]).join(', ')}${j.field?' · '+j.field:''}<br>${crew||'Unassigned'}</div>
        ${chipEquip.length?`<div class="chip-trailers">${chipEquip.map(t=>shortName(t)).join(', ')}</div>`:''}
        ${dur>1?'<div class="multi-day-bar"></div>':''}
      </div>`;
    });
    html+=`<button class="add-day-btn" onclick="openModal(null,'${ds}')">+</button>`;
    html+='</div>';
  });
  html+='</div></div>';
  document.getElementById('main-content').innerHTML=crewFilterBar()+statsBar()+html;
}

function renderMonth(){
  const base=new Date(today().getFullYear(),today().getMonth()+offset,1);
  document.getElementById('period-label').textContent=MONTHS[base.getMonth()]+' '+base.getFullYear();
  const todayStr=isoDate(today());
  let html='<div class="month-wrap"><div class="month-grid">';
  DOW.forEach(d=>{html+=`<div class="dow-header">${d[0]}</div>`});
  for(let i=0;i<base.getDay();i++) html+='<div class="month-cell other"></div>';
  const daysInMonth=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(base.getFullYear(),base.getMonth(),d);
    const ds=isoDate(dt);
    const dayJobs=jobsForDate(ds);
    html+=`<div class="month-cell${dt.getDay()===0||dt.getDay()===6?' other':''}">
      <div class="m-num${ds===todayStr?' today-num':''}">${d}</div>`;
    dayJobs.slice(0,2).forEach(j=>{
      const st=statusMeta(getStatus(j));
      const dur=parseInt(j.duration)||1;
      html+=`<div class="month-chip ${st.cls}" onclick="openModal('${j.id}')">${j.client.slice(0,10)}${dur>1?' '+dur+'d':''}</div>`;
    });
    if(dayJobs.length>2) html+=`<div style="font-size:10px;color:var(--text-3)">+${dayJobs.length-2}</div>`;
    html+='</div>';
  }
  html+='</div></div>';
  document.getElementById('main-content').innerHTML=crewFilterBar()+statsBar()+html;
}

function renderEquipment(){
  const ws=weekStart(today(),equipOffset);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d});
  const todayStr=isoDate(today());
  document.getElementById('period-label').textContent=
    days[0].toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+
    days[6].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  // Only show equipment that has at least one job this week OR is a trailer (always show trailers)
  function equipUsedThisWeek(name){
    return days.some(d=>jobsUsingEquipOnDate(name,isoDate(d)).length>0);
  }

  let html='<div class="equip-view-scroll"><div style="min-width:700px">';

  // Header row
  html+=`<div class="equip-row-header">
    <div class="equip-name-cell header">Equipment</div>
    ${days.map(d=>{
      const ds=isoDate(d);
      return `<div class="equip-day-cell header${ds===todayStr?' today-col':''}">${DOW_SHORT[d.getDay()]}<br>${d.getMonth()+1}/${d.getDate()}</div>`;
    }).join('')}
  </div>`;

  // Render each category
  EQUIP_CATS.forEach(cat=>{
    const items=EQUIPMENT[cat];
    // Only show Trailers, Specialty, and Carts in the equipment calendar
    if(cat!=='Trailers'&&cat!=='Specialty'&&cat!=='Carts') return;
    const visibleItems=items;
    if(!visibleItems.length) return;

    html+=`<div class="equip-section-title">${cat}</div>`;
    visibleItems.forEach(equip=>{
      html+=`<div class="equip-row">
        <div class="equip-name-cell" title="${equip}">${equip.length>22?equip.slice(0,22)+'…':equip}</div>`;
      days.forEach(d=>{
        const ds=isoDate(d);
        const usedBy=jobsUsingEquipOnDate(equip,ds);
        const isToday=ds===todayStr;
        html+=`<div class="equip-day-cell${isToday?' today-col':''}">`;
        if(usedBy.length){
          usedBy.forEach(j=>{
            const st=statusMeta(getStatus(j));
            const color=STATUS_COLORS[getStatus(j)]||'#f1f5f9';
            html+=`<span class="equip-job-tag" style="background:${color}" onclick="openModal('${j.id}')" title="${j.client} — ${j.service}">${j.client.slice(0,12)}</span>`;
          });
        } else {
          html+=`<span class="equip-free">—</span>`;

        html+='</div>';
      });
      html+='</div>';
    });

  html+=`<div style="font-size:11px;color:var(--text-3);margin-top:12px;padding-left:2px">Trailers, Specialty, and Carts always visible. Attachments and Hand Tools are tracked for conflicts in scheduling but not shown here.</div>`;

  document.getElementById('main-content').innerHTML=html;

function renderList(){
  document.getElementById('period-label').textContent='All jobs';
  const fj=filteredJobs();
  const sorted=[...fj].sort((a,b)=>a.startDate.localeCompare(b.startDate));
  const byStatus={upcoming:[],inprog:[],touchup:[],complete:[]};
  sorted.forEach(j=>{const s=getStatus(j);byStatus[s].push(j)});
  function section(label,items){
    if(!items.length) return '';
    let h=`<div class="list-section"><div class="list-label">${label}</div>`;
    items.forEach(j=>{
      const st=statusMeta(getStatus(j));
      const dur=parseInt(j.duration)||1;
      const crew=(j.crew||[]).join(', ')||'Unassigned';
      const eCount=(j.equip||[]).length;
      const endDate=isoDate(addDays(parseISO(j.startDate),dur-1));
      const dateStr=dur>1?`${fmtShort(j.startDate)} – ${fmtShort(endDate)}`:fmtShort(j.startDate);
      h+=`<div class="job-row" onclick="openModal('${j.id}')">
        <div class="job-row-body">
          <div class="job-row-client">${j.client}${dur>1?` <span style="font-size:11px;font-weight:400;color:var(--text-3)">(${dur} days)</span>`:''}</div>
          <div class="job-row-detail">${j.service}${j.field?' · '+j.field:''} · ${crew} · ${dateStr}${eCount?' · '+eCount+' equip':''}</div>
          ${j.notes?`<div style="font-size:11px;color:var(--text-3);margin-top:2px">${j.notes}</div>`:''}
        </div>
        <div class="status-badge ${st.cls}">${st.label}</div>
      </div>`;
    });
    h+='</div>';
    return h;
  }
  let html=crewFilterBar()+statsBar();
  html+=section('In progress',byStatus.inprog)+section('Touch up needed',byStatus.touchup)+section('Upcoming',byStatus.upcoming)+section('Complete',byStatus.complete.slice(-15).reverse());
  if(!fj.length) html+=`<div class="empty-state"><p>No jobs yet.<br>Tap + Add job to get started.</p></div>`;
  document.getElementById('main-content').innerHTML=html;
}

function getModalDates(){
  const start=document.getElementById('f-start')?document.getElementById('f-start').value:'';
  const dur=document.getElementById('f-duration')?parseInt(document.getElementById('f-duration').value)||1:1;
  return {start,dur};
}

function refreshEquipConflicts(){
  const {start,dur}=getModalDates();
  const g=document.getElementById('equip-grid');
  const w=document.getElementById('conflict-warnings');
  if(!g||!w||!start) return;
  g.innerHTML=buildEquipGrid();
  // Check trailers and specialty for conflicts
  let warnings='';
  [...EQUIPMENT.Trailers,...EQUIPMENT.Specialty,...EQUIPMENT.Attachments,...EQUIPMENT['Hand Tools']].forEach(t=>{
    if(!pickedEquip.includes(t)) return;
    const conflict=trailerConflictJob(t,start,dur,editId);
    if(conflict){
      warnings+=`<div class="conflict-warning">⚠ <strong>${t}</strong> is already assigned to ${conflict.client} (${fmtShort(conflict.startDate)}${parseInt(conflict.duration)>1?' – '+fmtShort(isoDate(addDays(parseISO(conflict.startDate),parseInt(conflict.duration)-1))):''}).</div>`;
    }
  });
  w.innerHTML=warnings;
}

function buildServiceGrid(pre=null){
  if(pre !== null) pickedServices = pre.length ? [...pre] : [];
  const hasOther = pickedServices.some(s=>!SERVICES.includes(s));
  const otherVal = hasOther ? pickedServices.find(s=>!SERVICES.includes(s)) : '';
  const otherPicked = pickedServices.includes('Other') || hasOther;
  return SERVICES.map(s=>`<div class="sel-opt${pickedServices.includes(s)?' picked':''}" data-svc="${s}" onclick="toggleService('${s}')">${s}</div>`).join('')
    + `<div class="sel-opt${otherPicked?' picked':''}" onclick="toggleServiceOther()">Other</div>`
    + `<div id="f-service-other-wrap" style="display:${otherPicked?'block':'none'};grid-column:1/-1;margin-top:4px"><input type="text" id="f-service-other" placeholder="Describe other service..." value="${otherVal}" style="width:100%;padding:8px 12px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg);box-sizing:border-box"></div>`;
}
function toggleService(s){
  pickedServices = pickedServices.includes(s) ? pickedServices.filter(x=>x!==s) : [...pickedServices,s];
  const g = document.getElementById('f-service-grid');
  if(g){
    g.querySelectorAll('.sel-opt[data-svc]').forEach(el=>{
      el.classList.toggle('picked', pickedServices.includes(el.dataset.svc));
    });
  }
}
function toggleServiceOther(){
  const hasOther = pickedServices.includes('Other') || pickedServices.some(s=>!SERVICES.includes(s));
  if(hasOther){
    pickedServices = pickedServices.filter(s=>s==='Other'||SERVICES.includes(s)).filter(s=>s!=='Other');
  } else {
    pickedServices = [...pickedServices.filter(s=>SERVICES.includes(s)), 'Other'];
  }
  const g = document.getElementById('f-service-grid');
  if(g) g.innerHTML = buildServiceGrid();
  // focus the text input
  setTimeout(()=>{ const inp=document.getElementById('f-service-other'); if(inp&&!hasOther) inp.focus(); },50);
}

function buildCrewDaysList(){
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if(!pickedCrew.length) return '';
  return pickedCrew.map(person=>{
    const days = pickedCrewDays[person]||[];
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
      <div style="font-size:13px;font-weight:600;color:var(--text);min-width:120px">${person}</div>
      <div style="display:flex;gap:4px">
        ${DAYS.map((d,i)=>`<button type="button" onclick="toggleCrewDay('${person.replace(/'/g,"\\'")}',${i})" style="padding:4px 8px;border-radius:5px;border:1.5px solid ${days.includes(i)?'var(--green)':'var(--border-2)'};background:${days.includes(i)?'var(--green)':'var(--surface)'};color:${days.includes(i)?'#fff':'var(--text-2)'};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">${d}</button>`).join('')}
      </div>
      ${!days.length?'<span style="font-size:11px;color:#dc2626">— select days</span>':''}
    </div>`;
  }).join('');
}
function toggleCrewDay(person, dow){
  if(!pickedCrewDays[person]) pickedCrewDays[person]=[];
  const days = pickedCrewDays[person];
  const idx = days.indexOf(dow);
  if(idx>=0) days.splice(idx,1); else days.push(dow);
  // Clear job-level day buttons (mutual exclusivity)
  for(let i=0;i<7;i++){
    const btn = document.getElementById('day-btn-'+i);
    if(btn) btn.classList.remove('active');
  }
  const el = document.getElementById('crew-days-list');
  if(el) el.innerHTML = buildCrewDaysList();
}
function buildCrewGrid(){
  const {start} = getModalDates();
  const subPicked = pickedCrew.some(c=>c.startsWith('Sub:'));
  const subName = subPicked ? (pickedCrew.find(c=>c.startsWith('Sub:'))||'Sub:').slice(4) : '';
  return CREW.map(c=>{
    const off = start && isPersonOff(c, start);
    return `<div class="sel-opt${pickedCrew.includes(c)?' picked':''}${off?' crew-off':''}" onclick="toggleCrew('${c}',${off})">${c}${off?'<span style=\"font-size:9px;margin-left:4px;opacity:0.7\">OFF</span>':''}</div>`;
  }).join('')
  + `<div class="sel-opt${subPicked?' picked':''}" onclick="toggleSubcontractor()">Subcontractor</div>`
  + `<div id="f-sub-wrap" style="display:${subPicked?'block':'none'};grid-column:1/-1;margin-top:4px"><input type="text" id="f-sub-name" placeholder="Company or person name..." value="${subName}" oninput="updateSubName(this.value)" style="width:100%;padding:8px 12px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:14px;font-family:'DM Sans',sans-serif;background:var(--bg);box-sizing:border-box"></div>`;
}
function buildEquipTabs(){
  return EQUIP_CATS.map(cat=>`<button class="etab${activeEquipTab===cat?' active':''}" onclick="setEquipTab('${cat}')">${cat}</button>`).join('');
}
function buildEquipGrid(){
  const {start,dur}=getModalDates();
  return EQUIPMENT[activeEquipTab].map(e=>{
    const safe=e.replace(/'/g,"\\'");
    const isPicked=pickedEquip.includes(e);
    // Check conflicts across all equipment categories
    let isConflict=false;
    if(start&&!isPicked){
      isConflict=!!trailerConflictJob(e,start,dur,editId);
    }
    if(start&&isPicked){
      isConflict=!!trailerConflictJob(e,start,dur,editId);
    }
    return `<div class="sel-opt${isPicked?' picked':''}${isConflict?' conflict':''}" onclick="toggleEquip('${safe}')" style="font-size:11px;padding:7px 6px">${e}</div>`;
  }).join('');
}
function buildEquipSelected(){
  if(!pickedEquip.length) return '<div style="font-size:11px;color:var(--text-3);margin-top:6px">No equipment selected</div>';
  return `<div class="equip-selected-list">${pickedEquip.map(e=>{
    const safe=e.replace(/'/g,"\\'");
    return `<div class="equip-tag">${e}<span class="equip-tag-x" onclick="toggleEquip('${safe}')">×</span></div>`;
  }).join('')}</div>`;
}

function setEquipTab(cat){
  activeEquipTab=cat;
  const t=document.getElementById('equip-tabs'),g=document.getElementById('equip-grid');
  if(t) t.innerHTML=buildEquipTabs();
  if(g) g.innerHTML=buildEquipGrid();
}
function toggleEquip(name){
  pickedEquip=pickedEquip.includes(name)?pickedEquip.filter(e=>e!==name):[...pickedEquip,name];
  const g=document.getElementById('equip-grid'),s=document.getElementById('equip-selected');
  if(g) g.innerHTML=buildEquipGrid();
  if(s) s.innerHTML=buildEquipSelected();
  refreshEquipConflicts();
}
function toggleCrew(name, isOff=false){
  if(isOff && !pickedCrew.includes(name)){
    if(!confirm(`${name} is scheduled off on this date. Add them anyway?`)) return;
  }
  pickedCrew=pickedCrew.includes(name)?pickedCrew.filter(c=>c!==name):[...pickedCrew,name];
  // Remove crewDays entry if deselected
  if(!pickedCrew.includes(name)) delete pickedCrewDays[name];
  // Default Mon-Fri for newly added person
  if(pickedCrew.includes(name) && !pickedCrewDays[name]) pickedCrewDays[name]=[];
  const g=document.getElementById('crew-grid');
  if(g) g.innerHTML=buildCrewGrid();
  const dl=document.getElementById('crew-days-list');
  if(dl) dl.innerHTML=buildCrewDaysList();
}
function toggleSubcontractor(){
  const subPicked = pickedCrew.some(c=>c.startsWith('Sub:'));
  if(subPicked){
    pickedCrew = pickedCrew.filter(c=>!c.startsWith('Sub:'));
  } else {
    pickedCrew = [...pickedCrew, 'Sub:'];
  }
  const g=document.getElementById('crew-grid');
  if(g) g.innerHTML=buildCrewGrid();
  if(!subPicked){
    setTimeout(()=>{ const inp=document.getElementById('f-sub-name'); if(inp) inp.focus(); },50);
  }
}
function updateSubName(val){
  pickedCrew = pickedCrew.filter(c=>!c.startsWith('Sub:'));
  pickedCrew = [...pickedCrew, 'Sub:'+val];
}

function buildJobDayPicker(job){
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return DAYS.map((d,i)=>{
    const active = job&&job.selectedDays&&job.selectedDays.includes(i);
    return `<button type="button" id="day-btn-${i}" onclick="toggleDayBtn(${i})" class="day-of-week-btn${active?' active':''}">${d}</button>`;

}
function toggleDayBtn(i){
  const btn = document.getElementById('day-btn-'+i);
  if(btn) btn.classList.toggle('active');
  // If job-level days are being used, clear per-person days (mutual exclusivity)

    pickedCrewDays = {};
    const dl = document.getElementById('crew-days-list');
    if(dl) dl.innerHTML = buildCrewDaysList();
  }
}
function getSelectedDays(){
  return null; // job-level day picker removed — per-person days used instead
}

// ── MATERIALS ─────────────────────────────────────────────────────────────────
let materialsList = [];
let materialPrices = [];
let materialsLoaded = false;
let materialSearch = '';
let materialCatFilter = 'All';

const MATERIAL_CATS = ['All','Chemicals','Seed','Topdressing','Sod','Irrigation','Fertilizer','Equipment Parts','Fuel','Other'];

async function loadMaterials(){
  if(materialsLoaded) return;
  try {
    const [mats, prices] = await Promise.all([
      sbFetch('GET', '/rest/v1/materials?select=*&order=name.asc'),
      sbFetch('GET', '/rest/v1/material_prices?select=*&order=effective_date.desc'),
    ]);
    materialsList = (mats||[]).map(r=>({
      id: r.id, name: r.name, unit: r.unit, category: r.category||'', notes: r.notes||'', createdBy: r.created_by||''
    }));
    materialPrices = (prices||[]).map(r=>({
      id: r.id, materialId: r.material_id, price: Number(r.price_per_unit), effectiveDate: r.effective_date, setBy: r.set_by||'', notes: r.notes||''
    }));
    materialsLoaded = true;
  } catch(e){ materialsList=[]; materialPrices=[]; materialsLoaded=true; }
}

function getCurrentPrice(materialId, asOfDate=null){
  const date = asOfDate || new Date().toISOString().split('T')[0];
  const prices = materialPrices
    .filter(p=>p.materialId===materialId && p.effectiveDate<=date)
    .sort((a,b)=>b.effectiveDate.localeCompare(a.effectiveDate));
  return prices[0]||null;
}

function getPriceHistory(materialId){
  return materialPrices
    .filter(p=>p.materialId===materialId)
    .sort((a,b)=>b.effectiveDate.localeCompare(a.effectiveDate));
}

  const mat = id ? materialsList.find(m=>m.id===id) : null;

        </select>
      </div>
    </div>
    ${!mat?`<div class="form-group">
      <label class="form-label">Starting Price (per unit) *</label>
      <input type="number" id="mat-price" step="0.01" placeholder="0.00" style="width:100%;padding:10px 12px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--bg);box-sizing:border-box">

    </div>

  overlay.querySelector('#mat-save-btn').onclick = async function(){
    const name = document.getElementById('mat-name').value.trim();
    const unit = document.getElementById('mat-unit').value.trim();
    const category = document.getElementById('mat-category').value;
    const notes = document.getElementById('mat-notes').value.trim();
    if(!name||!unit){ alert('Name and unit are required.'); return; }
    this.textContent='Saving...'; this.disabled=true;
    try {
      if(mat){
        await sbFetch('PATCH', `/rest/v1/materials?id=eq.${id}`, { name, unit, category, notes });
        const m = materialsList.find(x=>x.id===id);
        if(m){ m.name=name; m.unit=unit; m.category=category; m.notes=notes; }
      } else {
        const price = parseFloat(document.getElementById('mat-price')?.value)||0;

        // Get the new material id
        const newMat = await sbFetch('GET', `/rest/v1/materials?name=eq.${encodeURIComponent(name)}&order=created_at.desc&limit=1`);

  document.body.appendChild(overlay);

async function deleteMaterial(id, name){
  if(!confirm(`Delete "${name}"? This will also delete all price history for it.`)) return;
  try {
    await sbFetch('DELETE', `/rest/v1/materials?id=eq.${id}`);
    materialsList = materialsList.filter(m=>m.id!==id);
    materialPrices = materialPrices.filter(p=>p.materialId!==id);
    renderMaterials();
  } catch(e){ alert('Failed: '+e.message); }
}
