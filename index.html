function updateEndDate(){
  const s=document.getElementById('f-start').value,dur=parseInt(document.getElementById('f-duration').value)||1;
  if(s) document.getElementById('f-end').value=isoDate(addDays(parseISO(s),dur-1));
}
function updateEndFromDuration(){
  const s=document.getElementById('f-start').value,dur=parseInt(document.getElementById('f-duration').value)||1;
  if(s) document.getElementById('f-end').value=isoDate(addDays(parseISO(s),dur-1));
}
function updateDuration(){
  const s=document.getElementById('f-start').value,e=document.getElementById('f-end').value;
  if(s&&e){const diff=Math.round((parseISO(e)-parseISO(s))/(1000*60*60*24))+1;if(diff>=1) document.getElementById('f-duration').value=diff;}
}
function maybeClose(e){if(e.target.classList.contains('modal-overlay')) closeModal()}
function closeModal(){
  document.getElementById('modal-root').innerHTML='';
  editId=null;pickedCrew=[];pickedEquip=[];touchUpOn=false;activeEquipTab=EQUIP_CATS[0];
}
async function saveJob(){
  const client=getClientValue();
  const field=document.getElementById('f-field').value.trim();
  const service=getServiceValue();
  const startDate=document.getElementById('f-start').value;
  const duration=parseInt(document.getElementById('f-duration').value)||1;
  const notes=document.getElementById('f-notes').value.trim();
  if(!startDate){alert('Please pick a start date.');return}
  const includeWeekends=document.getElementById('f-weekends')?document.getElementById('f-weekends').checked:false;
  const services = [...pickedServices].map(s=>{
    if(s==='Other'){
      const otherText = document.getElementById('f-service-other') ? document.getElementById('f-service-other').value.trim() : '';
      return otherText || 'Other';
    }
    return s;
  });
  const task = document.getElementById('f-task') ? document.getElementById('f-task').value.trim() : '';
  const rentalEquip = document.getElementById('f-rental-equip') ? document.getElementById('f-rental-equip').value.trim() : '';
  const createdBy = editId ? (jobs.find(j=>j.id===editId)||{}).createdBy||'' : getDisplayName(currentUser&&currentUser.email);
  const data={client,field,service:services[0]||'',services,startDate,duration,crew:[...pickedCrew],equip:[...pickedEquip],touchUp:touchUpOn,notes,task,rentalEquip,includeWeekends,createdBy};
  const btn=document.querySelector('.btn-save');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  try{
    if(editId){
      await dbSaveJob(data, editId);
      const existing=jobs.find(j=>j.id===editId);
      Object.assign(existing,{...data,id:editId,createdBy:existing.createdBy||data.createdBy,rentalEquip:data.rentalEquip||existing.rentalEquip||''});
    } else {
      const newId=await dbSaveJob(data);
      if(newId) jobs.push({...data,id:newId});
    }
    save();closeModal();render();
  } catch(e){
    alert('Error saving job. Check your connection.');
    console.error(e);
    if(btn){btn.disabled=false;btn.textContent='Save job';}
  }
}
async function deleteJob(id){
  if(!confirm('Remove this job?')) return;
  try{
    await dbDeleteJob(id);
    jobs=jobs.filter(j=>j.id!==id);
    save();closeModal();render();
  } catch(e){
    alert('Error removing job.');
    console.error(e);
  }
}

async function getGoogleToken(){
  const now=Math.floor(Date.now()/1000);
  const header=btoa(JSON.stringify({alg:'RS256',typ:'JWT'}));
  const claim=btoa(JSON.stringify({
    iss:SHEETS_CONFIG.clientEmail,
    scope:'https://www.googleapis.com/auth/spreadsheets',
    aud:'https://oauth2.googleapis.com/token',
    exp:now+3600,iat:now
  }));
  const sigInput=`${header}.${claim}`;
  // Import the private key for signing
  const pemKey=SHEETS_CONFIG.privateKey.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g,'');
  const binaryKey=Uint8Array.from(atob(pemKey),c=>c.charCodeAt(0));
  const cryptoKey=await crypto.subtle.importKey(
    'pkcs8',binaryKey.buffer,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']
  );
  const signature=await crypto.subtle.sign(
    'RSASSA-PKCS1-v1_5',cryptoKey,
    new TextEncoder().encode(sigInput)
  );
  const sig=btoa(String.fromCharCode(...new Uint8Array(signature)));
  const jwt=`${sigInput}.${sig}`;
  const resp=await fetch('https://oauth2.googleapis.com/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`
  });
  const data=await resp.json();
  return data.access_token;
}

async function appendToSheet(data){
  try{
    const token=await getGoogleToken();
    const row=[
      data.reportDate,
      data.client,
      data.field||'',
      data.filedBy,
      data.timeIn||'',
      data.timeOut||'',
      data.workDone||'',
      data.productsUsed||'',
      (data.equipUsed||[]).join(', '),
      data.hasIssue?'Yes':'No',
      data.issueNotes||''
    ];
    await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_CONFIG.spreadsheetId}/values/${SHEETS_CONFIG.sheetName}!A1:K1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,
      {
        method:'POST',
        headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
        body:JSON.stringify({values:[row]})
      }
    );
  } catch(e){
    console.warn('Google Sheets sync failed (report still saved to Supabase):',e);
  }
}

function exportReport(id){
  const r = reports.find(x=>x.id===id);
  if(!r) return;
  const equipList = (r.equipUsed||[]).join(', ')||'—';
  const parts = [];
  parts.push('*Daily Field Report*');
  parts.push('*' + r.client + (r.field?' · '+r.field:'') + '*');
  parts.push(r.reportDate + '  |  Filed by: ' + r.filedBy);
  if(r.timeIn&&r.timeOut) parts.push('On site: ' + r.timeIn + ' - ' + r.timeOut);
  parts.push('');
  if(r.workDone) parts.push('*Work Done:*\n' + r.workDone);
  if(equipList !== '—') parts.push('*Equipment:*\n' + equipList);
  if(r.hasIssue && r.issueNotes) parts.push('*Issue Flagged:*\n' + r.issueNotes);
  const lines = parts.join('\n');

  navigator.clipboard.writeText(lines).then(()=>{
    // Show a brief confirmation
    const btn = document.querySelector('.btn-save');
    if(btn){ const orig=btn.textContent; btn.textContent='✓ Copied!'; setTimeout(()=>btn.textContent=orig, 2000); }
  }).catch(()=>{
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = lines;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.querySelector('.btn-save');
    if(btn){ const orig=btn.textContent; btn.textContent='✓ Copied!'; setTimeout(()=>btn.textContent=orig, 2000); }
  });
}

async function deleteReport(id){
  if(!confirm('Delete this report? This cannot be undone.')) return;
  try{
    // Delete any linked work order first
    await sbFetch('DELETE', `/rest/v1/work_orders?report_id=eq.${id}`);
    // Then delete the report
    await sbFetch('DELETE', `/rest/v1/field_reports?id=eq.${id}`);
    reports=reports.filter(r=>r.id!==id);
    workOrders=workOrders.filter(w=>w.reportId!==id);
    updateWoBadge();
    closeModal();
    renderReports();
  } catch(e){ alert('Error deleting report.'); console.error(e); }
}

function buildTimeOptions(selectedVal=''){
  let opts='<option value="">— select —</option>';
  for(let h=5;h<=22;h++){
    for(let m=0;m<60;m+=30){
      const ampm=h<12?'AM':'PM';
      const hour=h>12?h-12:h===0?12:h;
      const min=m===0?'00':'30';
      const label=`${hour}:${min} ${ampm}`;
      opts+=`<option value="${label}"${selectedVal===label?' selected':''}>${label}</option>`;
    }
  }
  return opts;
}

    const commute = myYrLogs.filter(l=>l.tripType==='commute').reduce((s,l)=>s+l.miles,0);
    const personal = myYrLogs.filter(l=>l.tripType==='personal').reduce((s,l)=>s+l.miles,0);
    html += `<div class="stats-bar" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="stat-num">${commute.toFixed(1)}</div><div class="stat-label">Commute mi</div></div>
      <div class="stat-card"><div class="stat-num">${personal.toFixed(1)}</div><div class="stat-label">Personal mi</div></div>
      <div class="stat-card"><div class="stat-num">${(commute+personal).toFixed(1)}</div><div class="stat-label">Total mi</div></div>
    </div>`;
    if(!myYrLogs.length){
      html += `<div style="color:var(--text-3);font-size:13px;padding:16px 0">No entries for ${yr}. Tap "+ Log miles" to add one.</div>`;
    } else {
      myYrLogs.forEach(l=>{ html += mileageEntryCard(l, false); });
    }
  }

  document.getElementById('main-content').innerHTML = html;
}

    : `<span style="font-size:11px;background:#ede9fe;color:#5b21b6;border-radius:99px;padding:2px 8px;font-weight:600">Personal</span>`;

    <div class="report-card-header">

function calcMileageMiles(){
  const s = parseFloat(document.getElementById('ml-odo-start').value)||0;
  const e = parseFloat(document.getElementById('ml-odo-end').value)||0;
  const el = document.getElementById('ml-miles-display');
  if(e > s){ el.textContent = (e-s).toFixed(1)+' mi'; el.style.color='var(--green-dark)'; }
  else if(s||e){ el.textContent = 'Invalid'; el.style.color='#dc2626'; }
  else { el.textContent = '—'; el.style.color='var(--green-dark)'; }
}

function setMileageTripType(t){
  mileageTripType = t;
  document.getElementById('ml-type-commute').classList.toggle('picked', t==='commute');
  document.getElementById('ml-type-personal').classList.toggle('picked', t==='personal');
}

function closeMileageModal(){
  const el = document.getElementById('mileage-overlay');
  if(el) el.remove();
  mileageModalOpen = false;
}

async function saveMileageLog(){
  const date = document.getElementById('ml-date').value;
  const vIdx = document.getElementById('ml-vehicle').selectedIndex;
  const vehicle = MILEAGE_VEHICLES[vIdx];
  const odoStart = parseFloat(document.getElementById('ml-odo-start').value);
  const odoEnd = parseFloat(document.getElementById('ml-odo-end').value);
  const purpose = document.getElementById('ml-purpose').value.trim();
  const errEl = document.getElementById('ml-error');
  errEl.textContent = '';

  if(!date){ errEl.textContent='Date is required.'; return; }
  if(isNaN(odoStart)||isNaN(odoEnd)){ errEl.textContent='Both odometer readings are required.'; return; }
  if(odoEnd <= odoStart){ errEl.textContent='Odometer end must be greater than odometer start.'; return; }

  const btn = document.querySelector('#mileage-overlay .btn-save');
  btn.disabled=true; btn.textContent='Saving...';
  try {
    await dbSaveMileageLog({ date, vehicleId: vehicle.id, vehicleLabel: vehicle.label, odoStart, odoEnd, tripType: mileageTripType, purpose });
    await loadMileage();
    closeMileageModal();
    renderMileage();
  } catch(e){
    errEl.textContent = 'Error saving. Please try again.';
    btn.disabled=false; btn.textContent='Save';
  }
}

async function deleteMileageEntry(id){
  if(!confirm('Remove this mileage entry?')) return;
  await dbDeleteMileageLog(id);
  await loadMileage();
  renderMileage();
}

let editingTimeOffId = null;

function updateTimeOffBadge(){
  const pending = timeOffEntries.filter(e=>e.status==='Pending').length;
  const badge = document.getElementById('timeoff-badge');
  if(badge){ badge.style.display = (pending && isAdmin) ? '' : 'none'; badge.textContent = pending; }
}

function renderTimeOff(){
  const today = isoDate(new Date());
  const TO_ADMIN_EMAILS = ['jake@fieldsourceohio.com','ryan@fieldsourceohio.com','matt@fieldsourceohio.com'];
  const canApprove = TO_ADMIN_EMAILS.includes((currentUser&&currentUser.email||'').toLowerCase());
  const myName = getDisplayName(currentUser&&currentUser.email);

  // What this user can see
  const visible = canApprove ? timeOffEntries : timeOffEntries.filter(e=>e.person===myName||e.requestedBy===myName);
  const pending = visible.filter(e=>e.status==='Pending').sort((a,b)=>a.startDate.localeCompare(b.startDate));
  const approved = visible.filter(e=>e.status==='Approved'&&e.endDate>=today).sort((a,b)=>a.startDate.localeCompare(b.startDate));
  const past = visible.filter(e=>(e.status==='Approved'&&e.endDate<today)||e.status==='Denied').sort((a,b)=>b.startDate.localeCompare(a.startDate));

  let html = '';

  // Request button (everyone)
  html += `<div style="margin-bottom:16px;display:flex;gap:8px;align-items:center">
    <button class="btn-save" style="font-size:13px;padding:8px 18px" onclick="openTimeOffForm()">+ Request Time Off</button>
  </div>`;

  // Request form (hidden by default)
  const crewOpts = canApprove ? TIME_OFF_CREW.map(c=>`<option value="${c}">${c}</option>`).join('') : `<option value="${myName}">${myName}</option>`;
  html += `<div id="timeoff-form" style="display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px">
    <div style="font-weight:600;margin-bottom:12px" id="timeoff-form-title">Request Time Off</div>
    <div class="form-group">
      <label class="form-label">Person</label>
      <select id="to-person" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg)">
        ${crewOpts}
      </select>
    </div>
    <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <label class="form-label">Start date</label>
        <input type="date" id="to-start" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);box-sizing:border-box">
      </div>
      <div>
        <label class="form-label">End date</label>
        <input type="date" id="to-end" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);box-sizing:border-box">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Note (optional)</label>
      <input type="text" id="to-note" placeholder="Vacation, personal, etc." style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);box-sizing:border-box">
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn-save" onclick="saveTimeOff()">Submit Request</button>
      <button class="btn-cancel" onclick="closeTimeOffForm()">Cancel</button>
      <button class="btn-delete" id="to-delete-btn" style="display:none" onclick="deleteTimeOffEntry()">Remove</button>
    </div>
    <div id="to-error" style="color:#dc2626;font-size:12px;margin-top:8px"></div>
  </div>`;

  function statusBadge(status){
    if(status==='Approved') return `<span style="font-size:11px;background:#dcfce7;color:#14532d;border-radius:99px;padding:2px 8px;font-weight:600">Approved</span>`;
    if(status==='Denied') return `<span style="font-size:11px;background:#fee2e2;color:#991b1b;border-radius:99px;padding:2px 8px;font-weight:600">Denied</span>`;
    return `<span style="font-size:11px;background:#fef3c7;color:#92400e;border-radius:99px;padding:2px 8px;font-weight:600">Pending</span>`;
  }

  function entryHtml(e, showActions){
    const isCurrent = today >= e.startDate && today <= e.endDate;
    const dateRange = e.startDate === e.endDate ? fmtShort(e.startDate) : `${fmtShort(e.startDate)} – ${fmtShort(e.endDate)}`;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap">
      <div>
        <span style="font-weight:600">${e.person}</span>
        ${isCurrent&&e.status==='Approved'?`<span style="font-size:11px;background:#fef3c7;color:#92400e;border-radius:99px;padding:2px 8px;margin-left:6px">Out now</span>`:''}
        <div style="font-size:12px;color:var(--text-3);margin-top:2px">${dateRange}${e.note?` · ${e.note}`:''}${e.requestedBy&&e.requestedBy!==e.person?` · Requested by ${e.requestedBy}`:''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
        ${statusBadge(e.status)}
        ${showActions&&e.status==='Pending'?`
          <button onclick="approveTimeOff('${e.id}')" style="background:var(--green);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600">Approve</button>
          <button onclick="denyTimeOff('${e.id}')" style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600">Deny</button>
        `:''}
        ${canApprove?`<button onclick="openTimeOffForm('${e.id}')" style="background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit">Edit</button>`:''}
      </div>
    </div>`;
  }

  // ── ADMIN SUMMARY TABLE ──────────────────────────────────────
  if(canApprove){
    const allApproved = timeOffEntries.filter(e=>e.status==='Approved');
    const byPerson = {};
    allApproved.forEach(e=>{
      if(!byPerson[e.person]) byPerson[e.person] = 0;
      // Count calendar days inclusive
      const start = new Date(e.startDate);
      const end = new Date(e.endDate);
      const days = Math.round((end-start)/86400000)+1;
      byPerson[e.person] += days;
    });
    const sorted = Object.entries(byPerson).sort((a,b)=>b[1]-a[1]);
    if(sorted.length){
      html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px">
        <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);margin-bottom:10px">Time Off Summary — All Time</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px">
          ${sorted.map(([person,days])=>`
            <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:13px;color:var(--text)">${person}</span>
              <span style="font-size:16px;font-weight:700;color:var(--green-dark);font-family:'DM Mono',monospace">${days}d</span>
            </div>`).join('')}
        </div>
      </div>`;
    }
  }

  // Pending requests
  if(pending.length){
    html += `<div style="font-weight:600;margin-bottom:8px;font-size:13px;color:#92400e">PENDING REQUESTS (${pending.length})</div>`;
    html += pending.map(e=>entryHtml(e, canApprove)).join('');
  }

  // Approved upcoming
  if(approved.length){
    html += `<div style="font-weight:600;margin:${pending.length?'16px':0} 0 8px;font-size:13px;color:var(--text-2)">APPROVED — UPCOMING</div>`;
    html += approved.map(e=>entryHtml(e, false)).join('');
  }

  if(!pending.length && !approved.length){
    html += `<div style="color:var(--text-3);font-size:13px;padding:20px 0">No upcoming time off.</div>`;
  }

  // Past/Denied
  if(past.length){
    html += `<div style="margin-top:16px"><button onclick="document.getElementById('past-timeoff').style.display=document.getElementById('past-timeoff').style.display==='none'?'block':'none';this.textContent=this.textContent.includes('Show')?'Hide past':'Show past (${past.length})';" style="background:none;border:none;color:var(--text-3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:underline">Show past (${past.length})</button></div>`;
    html += `<div id="past-timeoff" style="display:none">${past.map(e=>entryHtml(e,false)).join('')}</div>`;
  }

  document.getElementById('main-content').innerHTML = html;
}

  const e = timeOffEntries.find(x=>x.id===id);

  e.status = 'Approved';
  await dbSaveTimeOff(e, id);
  updateTimeOffBadge();
  renderTimeOff();
}

async function denyTimeOff(id){
  const e = timeOffEntries.find(x=>x.id===id);
  if(!e) return;
  e.status = 'Denied';
  await dbSaveTimeOff(e, id);
  updateTimeOffBadge();
  renderTimeOff();

function openTimeOffForm(id=null){
  editingTimeOffId = id;
  const form = document.getElementById('timeoff-form');
  const title = document.getElementById('timeoff-form-title');
  const delBtn = document.getElementById('to-delete-btn');
  document.getElementById('to-error').textContent = '';

    const e = timeOffEntries.find(x=>x.id===id);

    title.textContent = 'Edit Request';
    document.getElementById('to-person').value = e.person;

    document.getElementById('to-end').value = e.endDate;

  } else {
    title.textContent = 'Request Time Off';
    document.getElementById('to-start').value = '';
    document.getElementById('to-end').value = '';

    delBtn.style.display = 'none';
  }
  form.style.display = 'block';

function closeTimeOffForm(){
  document.getElementById('timeoff-form').style.display = 'none';
  editingTimeOffId = null;
}

async function saveTimeOff(){
  const person = document.getElementById('to-person').value;
  const startDate = document.getElementById('to-start').value;
  const endDate = document.getElementById('to-end').value;
  const note = document.getElementById('to-note').value.trim();
  const errEl = document.getElementById('to-error');
  errEl.textContent = '';
  if(!startDate || !endDate){ errEl.textContent = 'Please set both start and end dates.'; return; }
  if(endDate < startDate){ errEl.textContent = 'End date must be on or after start date.'; return; }
  try {
    const existing = editingTimeOffId ? timeOffEntries.find(x=>x.id===editingTimeOffId) : null;
    const status = existing ? existing.status : 'Pending';
    const requestedBy = existing ? existing.requestedBy : getDisplayName(currentUser&&currentUser.email);
    await dbSaveTimeOff({person, startDate, endDate, note, status, requestedBy}, editingTimeOffId);
    await loadTimeOff();
    updateTimeOffBadge();
    closeTimeOffForm();
    renderTimeOff();
  } catch(e) {
    errEl.textContent = 'Error saving. Please try again.';
  }
}

async function deleteTimeOffEntry(){
  if(!editingTimeOffId) return;
  if(!confirm('Remove this time off entry?')) return;
  await dbDeleteTimeOff(editingTimeOffId);
  await loadTimeOff();
  editingTimeOffId = null;
  renderTimeOff();
}

async function submitNewWorkOrder(reportId){
  const client = document.getElementById('nwo-client').value;
  const field = document.getElementById('nwo-field').value.trim();
  const issue = document.getElementById('nwo-issue').value.trim();
  const errEl = document.getElementById('nwo-error');
  if(!issue){ errEl.textContent='Please describe the issue.'; return; }
  const btn = document.querySelector('#new-wo-overlay .btn-save');
  btn.disabled=true; btn.textContent='Submitting...';
  try {
    const data = { client, field, issueNotes: issue, status:'open', reportId: reportId||null, scheduledDate:'', scheduledCrew:[] };
    const newId = await dbSaveWorkOrder(data);
    if(newId){ data.id=newId; workOrders.unshift({...data, id:String(newId), createdAt:new Date().toISOString()}); }
    updateWoBadge();
    document.getElementById('new-wo-overlay').remove();
    // If on work orders view, refresh it
    if(view==='workorders') renderWorkOrders();
    // Show a brief confirmation
    const confirm2 = document.createElement('div');
    confirm2.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1f18;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:9999;animation:fadeIn .2s';
    confirm2.textContent = 'Work order submitted';
    document.body.appendChild(confirm2);
    setTimeout(()=>confirm2.remove(), 2500);
  } catch(e){
    errEl.textContent = 'Error submitting. Please try again.';
    btn.disabled=false; btn.textContent='Submit Work Order';
  }
}

function renderWorkOrders(){
  const allClients = ['All', ...new Set(workOrders.map(w=>w.client).filter(Boolean))].sort((a,b)=>a==='All'?-1:a.localeCompare(b));
  const byStatus = woStatusFilter==='all' ? workOrders : workOrders.filter(w=>w.status===woStatusFilter);
  const filtered = woSiteFilter==='All' ? byStatus : byStatus.filter(w=>w.client===woSiteFilter);

  const openCount=workOrders.filter(w=>w.status==='open').length;
  const schedCount=workOrders.filter(w=>w.status==='assigned').length;
  const resolvedCount=workOrders.filter(w=>w.status==='resolved').length;

  let html=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
    <div class="stat-card" style="cursor:pointer;border-color:${woStatusFilter==='open'?'#ef4444':'var(--border)'}" onclick="setWoStatus('open')"><div class="stat-num" style="color:#dc2626">${openCount}</div><div class="stat-label">Open</div></div>

async function scheduleWo(id){
  const w=workOrders.find(x=>x.id===id);
  if(!w) return;
  const scheduledDate=document.getElementById('wo-date').value;
  if(!scheduledDate){alert('Pick a date to schedule.');return;}
  const scheduledCrew=[...woPicked];
  const btn=document.querySelector('.btn-save');
  if(btn){btn.disabled=true;btn.textContent='Assigning...';}
  try{
    const updated={...w,status:'assigned',scheduledDate,scheduledCrew};
    await dbSaveWorkOrder(updated,id);
    Object.assign(w,{status:'assigned',scheduledDate,scheduledCrew});
    // Auto-add to jobs calendar
    const newJob={
      client:w.client,field:w.field,service:'Work Order',
      startDate:scheduledDate,duration:1,crew:scheduledCrew,equip:[],
      touchUp:false,notes:'Work order: '+w.issueNotes.slice(0,80),includeWeekends:false
    };
    const newId=await dbSaveJob(newJob);
    if(newId) jobs.push({...newJob,id:newId});
    save();
    updateWoBadge();
    closeModal();
    renderWorkOrders();
  } catch(e){
    alert('Error scheduling work order.');console.error(e);
    if(btn){btn.disabled=false;btn.textContent='Schedule';}
  }
}
async function resolveWo(id){
  if(!confirm('Mark this work order as resolved?')) return;
  const w=workOrders.find(x=>x.id===id);
  if(!w) return;
  try{
    await dbSaveWorkOrder({...w,status:'resolved'},id);
    w.status='resolved';
    updateWoBadge();
    closeModal();
    renderWorkOrders();
  } catch(e){ alert('Error resolving work order.'); console.error(e); }
}

const _origSbFetch = sbFetch;
async function sbFetch(method, path, body=null){
  const token = currentToken || SUPABASE_KEY;
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
      'Prefer': method==='POST'?'return=representation':'',
    }
  };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPABASE_URL + path, opts);
  if(!res.ok){
    const t=await res.text();
    console.error('Supabase error:', method, path, t);
    if(t.includes('JWT expired')){ doLogout(); return null; }
    throw new Error(t);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── DRAG AND DROP ────────────────────────────────────────────
let dragJobId = null;

function handleDragStart(e, jobId){
  dragJobId = jobId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', jobId);
  setTimeout(()=>{ if(e.target) e.target.classList.add('dragging'); }, 0);
}

function handleDragEnd(e){
  if(e.target) e.target.classList.remove('dragging');
  document.querySelectorAll('.day-col').forEach(c=>c.classList.remove('drag-over'));
  dragJobId = null;
}

function handleDragOver(e, ds){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.day-col').forEach(c=>c.classList.remove('drag-over'));
  const col = document.getElementById('daycol-'+ds);
  if(col) col.classList.add('drag-over');
}

function handleDragLeave(e, ds){
  // Only remove if leaving the column entirely
  if(!e.currentTarget.contains(e.relatedTarget)){
    const col = document.getElementById('daycol-'+ds);
    if(col) col.classList.remove('drag-over');
  }
}

async function handleDrop(e, newStartDate){
  e.preventDefault();
  document.querySelectorAll('.day-col').forEach(c=>c.classList.remove('drag-over'));
  if(!dragJobId) return;
  const job = jobs.find(j=>j.id===dragJobId);
  if(!job) return;
  if(job.startDate === newStartDate) return; // no change

  // Check for equipment conflicts on the new dates
  const dur = parseInt(job.duration)||1;
  const conflicts = [];
  (job.equip||[]).forEach(eq=>{
    const conflictJob = trailerConflictJob(eq, newStartDate, dur, job.id);
    if(conflictJob) conflicts.push({ eq, conflictJob });
  });

  if(conflicts.length){
    const names = conflicts.map(c=>`${c.eq} (conflicts with ${c.conflictJob.client})`).join('\n');
    const ok = confirm(`Equipment conflict on new date:\n\n${names}\n\nMove the job anyway?`);
    if(!ok){ dragJobId=null; return; }
  }

  // Apply the move
  const oldStart = job.startDate;
  job.startDate = newStartDate;
  try{
    await dbSaveJob(job, job.id);
    render();
  } catch(err){
    job.startDate = oldStart; // revert on failure
    alert('Error moving job. Please try again.');
    render();
  }
  dragJobId = null;
}

const MULTI_COLOR  = '#d1fae5'; // team green for 2+ people
const OFF_COLOR    = '#fecaca'; // soft red for off days

function getCrewColor(crew, service){
  if(!crew||!crew.length) return null;
  // Off duty — light gray-blue
  if(service==='Off') return OFF_COLOR;
  // Filter out Sub: entries
  const realCrew = crew.filter(c=>!c.startsWith('Sub:'));
  if(!realCrew.length) return null;
  // 2+ people = team green
  if(realCrew.length > 1) return MULTI_COLOR;
  // Single person
  const person = realCrew[0];
  if(CREW_COLORS[person]) return CREW_COLORS[person];
  if(person.toLowerCase().includes('intern')) return INTERN_COLOR;
  return null;
}

    sessionStorage.setItem('fs_user', JSON.stringify(currentUser));
    resetAccessToken = null;
    history.replaceState(null, '', window.location.pathname);
    setTimeout(()=>{ document.getElementById('reset-screen').style.display='none'; showApp(); }, 1200);
  } catch(e){
    errEl.textContent='Connection error. Please try again.';
    btn.disabled=false; btn.textContent='Set new password';
  }
}

function checkForRecoveryToken(){
  const hash = window.location.hash;
  if(!hash) return false;
  const params = new URLSearchParams(hash.replace('#',''));
  const type = params.get('type');
  const token = params.get('access_token');
  if(type === 'recovery' && token){
    resetAccessToken = token;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('reset-screen').style.display='flex';
    return true;
  }
  return false;
}

// Init
if(!checkForRecoveryToken()) checkSession();

// Register service worker for PWA
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
