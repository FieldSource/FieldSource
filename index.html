function pmItemDatesChanged(src){
  const s = document.getElementById('pmi-start'), d = document.getElementById('pmi-dur'), e = document.getElementById('pmi-due'), note = document.getElementById('pmi-dates-note');
  const unit = (document.getElementById('pmi-unit')||{}).value || 'days';
  if(pmIsMilestone(document.getElementById('pmi-type').value)){ note.textContent=''; return; }
  const days = pmDaysFor(unit, d.value);
  if((src==='start'||src==='dur') && s.value && days) e.value = pmAddWorkdays(s.value, days);
  else if(unit==='days' && (src==='due'||src==='start') && s.value && e.value && e.value>=s.value) d.value = pmWorkdaysBetween(s.value, e.value);
  const span = s.value && e.value ? pmWorkdaysBetween(s.value, e.value) : 0;
  if(unit==='hours' && Number(d.value)>0) note.textContent = `${d.value} hours of work = ${pmDaysFor('hours', d.value)} work day(s) on the calendar (${PM_DAY_HOURS} hrs/day).` + (span ? ` Scheduled across ${span} work day(s).` : '');
  else note.textContent = span ? `${span} work day(s), weekends and closures skipped.` : 'Leave dates blank if you don\'t know them yet.';
}
async function pmSaveItem(id, base){
  const g = k=>document.getElementById(k).value;
  const title = g('pmi-title').trim();
  if(!title){ document.getElementById('pmi-err').textContent='Give it a title.'; return; }
  const type = g('pmi-type'), ms = pmIsMilestone(type);
  const row = { ...base, title, type, description:g('pmi-desc'), owner:g('pmi-owner'), priority:g('pmi-priority'), status:g('pmi-status'),
    start_date: ms ? null : (g('pmi-start')||null), due_date: g('pmi-due')||null,
    length_unit: ms ? 'days' : g('pmi-unit'),
    duration_days: ms ? null : pmDaysFor(g('pmi-unit'), g('pmi-dur')),
    est_hours: (!ms && g('pmi-unit')==='hours') ? (g('pmi-dur')===''?null:Number(g('pmi-dur'))) : (g('pmi-hours')===''?null:Number(g('pmi-hours'))),

    depends_on: g('pmi-dep')||null, auto_schedule: document.getElementById('pmi-auto').checked || !g('pmi-dep'),
    dep_type: g('pmi-deptype'), dep_lag: Math.max(0, parseInt(g('pmi-deplag'))||0), dep_wait: document.getElementById('pmi-depwait').checked,
    party: (document.querySelector('input[name="pmi-party"]:checked')||{}).value || 'fs' };
  row.party_name = row.party==='fs' ? '' : g('pmi-partyname').trim();
  if(document.getElementById('pmi-fee')) row.fee = g('pmi-fee')===''?null:Number(g('pmi-fee'));
  if(row.start_date && row.due_date && row.due_date < row.start_date){ document.getElementById('pmi-err').textContent='Due date is before the start date.'; return; }
  const old = id ? pmItem(id) : null;
  if(row.status==='done' && (!old || old.status!=='done')) row.done_at = pmToday();
  if((row.status==='in_progress' || row.status==='done') && !(old && old.started_at)) row.started_at = pmToday();
  if(row.status==='todo') row.started_at = null;
  if(row.status!=='done') row.done_at = null;
  const prevOwner = old ? (old.owner||'') : '';
  try{
    if(id){ Object.assign(old, row); await pmPatchItem(old); }
    else {
      row.sort = pmKids(row.project_id, row.parent_id).length;
      const res = await sbFetch('POST','/rest/v1/pm_items', pmClean({ ...row, id: crypto.randomUUID() }));
      pm.items.push(res[0]);
      if(row.parent_id) delete pm.collapsed[row.parent_id];
    }
    const savedId = id || pm.items[pm.items.length-1].id;
    if(row.owner && row.owner!==prevOwner) pmNotify(row.owner, id ? old : pm.items[pm.items.length-1], 'assigned');
    await pmTrigSave(savedId);
    document.getElementById('pm-overlay').remove();
    const n = await pmReschedule(row.project_id);
    pmRender();
    if(n) pmToast(`${n} dependent item${n===1?'':'s'} rescheduled`);
  }catch(e){ document.getElementById('pmi-err').textContent = 'Could not save: '+e.message; }
}

// Bring projects over from the old Consulting view (stages become phases).
// Every row gets the same full set of fields (the database rejects a batch whose rows differ).
// A project that was created but whose phases/tasks failed to copy is filled in on the next try.
function pmFullRow(r){
  const base = { id:null, project_id:null, parent_id:null, type:'task', title:'', description:'', owner:'', priority:'Medium', status:'todo',
    start_date:null, due_date:null, duration_days:null, length_unit:'days', est_hours:null, budget:null, depends_on:null, auto_schedule:true, done_at:null, sort:0,
    dep_type:'finish', dep_lag:0, dep_wait:false, started_at:null, party:'fs', party_name:'' };
  const o = { ...base, ...r };
  ['start_date','due_date','done_at'].forEach(k=>{ if(!o[k] || !/^\d{4}-\d{2}-\d{2}/.test(o[k])) o[k] = null; else o[k] = String(o[k]).slice(0,10); });
  if(!['High','Medium','Low'].includes(o.priority)) o.priority = 'Medium';
  return o;
}

async function pmImportLegacy(){
  const legacy = pmLegacyPending();
  if(!legacy.length) return;
  if(!confirm(`Copy ${legacy.length} project(s) from the Classic view into Projects? The Classic ones stay where they are.`)) return;
  let done = 0;
  try{
    for(const [n,c] of legacy.entries()){
      let p = pm.projects.find(x=>x.legacy_id===c.id);
      if(!p){
        const res = await sbFetch('POST','/rest/v1/pm_projects', { name: c.projectName||c.client||'Imported project', client:c.client||'', kind:'client',
          color:pmNextColor(), status:'Active', notes:c.notes||'', legacy_id:c.id, created_by:(currentUser&&currentUser.email)||'' });
        p = res[0]; pm.projects.push(p);
      }
      const rows = [];
      const stages = [...CONSULTING_STAGES, ...new Set((c.tasks||[]).map(t=>t.stage).filter(st=>st && !CONSULTING_STAGES.includes(st)))];
      stages.forEach((stage,si)=>{
        const phId = crypto.randomUUID();
        rows.push(pmFullRow({ id:phId, project_id:p.id, type:'phase', title:stage, due_date:(c.stageDueDates||{})[stage]||null, sort:si }));
        (c.tasks||[]).filter(t=>t.stage===stage).forEach((t,ti)=>rows.push(pmFullRow({ id:crypto.randomUUID(), project_id:p.id, parent_id:phId, type:'task',
          title:t.title||'Task', description:t.notes||'', priority:t.priority, status:t.done?'done':'todo', due_date:t.dueDate||null, done_at:t.done?pmToday():null, sort:ti })));
      });
      // tasks with no stage go into the first phase
      (c.tasks||[]).filter(t=>!t.stage).forEach((t,ti)=>rows.push(pmFullRow({ id:crypto.randomUUID(), project_id:p.id, parent_id:rows[0].id, type:'task',
        title:t.title||'Task', description:t.notes||'', priority:t.priority, status:t.done?'done':'todo', due_date:t.dueDate||null, done_at:t.done?pmToday():null, sort:100+ti })));
      const ins = await sbFetch('POST','/rest/v1/pm_items', rows);
      pm.items.push(...(ins||[]));
      done++;
    }
    pm.sel = (pm.projects.find(x=>x.legacy_id===legacy[0].id)||{}).id || pm.sel;
    pmRender(); pmToast(`Imported ${done} project${done===1?'':'s'}`);
  }catch(e){ pmRender(); alert(`Import stopped after ${done} of ${legacy.length}: ${e.message}`); }
}

function pmCalendarHtml(){
  const [y,m] = pm.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1), startDow = first.getDay();
  const gridStart = pmShift(pmYmd(first), -startDow);
  const days = Array.from({length:42}, (_,i)=>pmShift(gridStart, i));
  const closures = new Map(pm.closures.map(c=>[c.date, c.label]));
  const projs = new Map(pmVisibleProjects(pm.calProject).map(p=>[p.id,p]));
  const entries = {};
  pm.items.filter(i=>projs.has(i.project_id) && i.type!=='phase').forEach(it=>{
    if(pm.calHideDone && it.status==='done') return;
    const key = pmIsMilestone(it.type) || it.type==='deliverable';
    if(pm.calKeyOnly && !key) return;
    if(pm.items.some(c=>c.parent_id===it.id)) return; // parents are summarized by their children
    let s = it.start_date || it.due_date, e = it.due_date || it.start_date;
    if(!s) return;
    if(pmIsMilestone(it.type) || it.type==='deliverable'){ s = e = (it.due_date||it.start_date); }
    for(let d=s, n=0; d<=e && n<370; d=pmShift(d,1), n++){
      const wd = pmD(d).getDay(); if(s!==e && (wd===0||wd===6||closures.has(d))) continue;
      (entries[d] = entries[d]||[]).push({ it, p: projs.get(it.project_id), first: d===s, last: d===e, span: s!==e });
    }
  });
  const today = pmToday();
  const monthName = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const cell = d=>{
    const inMonth = d.slice(0,7)===pm.calMonth, wd = pmD(d).getDay(), wknd = wd===0||wd===6, cl = closures.get(d);
    const list = (entries[d]||[]).sort((a,b)=>(b.it.type!=='task')-(a.it.type!=='task'));
    return `<div style="min-height:96px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;background:${cl?'#f3f4f6':wknd?'var(--bg)':'transparent'};${inMonth?'':'opacity:.45'}">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px">
        <span style="${d===today?'background:#2563eb;color:#fff;border-radius:99px;padding:0 6px;font-weight:700':'color:var(--text-3)'}">${pmD(d).getDate()}</span>
        ${cl?`<span style="color:var(--text-3);font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:70%">${pmEsc(cl)}</span>`:''}
      </div>
      ${list.slice(0,5).map(({it,p,first,span})=>`<div onclick="pmEditItem('${it.id}')" title="${pmEsc(p.name)} · ${pmEsc(it.title)}${pmIsExternal(it)?' · '+pmEsc(pmPartyText(it)):''}${it.owner?' · '+pmEsc(it.owner):''}"
        style="margin-top:3px;font-size:11px;line-height:1.3;padding:2px 5px;border-radius:4px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
        background:${pmIsMilestone(it.type)||it.type==='deliverable'?pmEsc(p.color):pmTint(p.color,.15)};color:${pmIsMilestone(it.type)||it.type==='deliverable'?'#fff':'var(--text)'};border-left:3px solid ${pmEsc(p.color)};${it.status==='done'?'opacity:.5;text-decoration:line-through':''}">
        ${PM_TYPES[it.type].icon==='•'?'':PM_TYPES[it.type].icon+' '}${span&&!first?'↳ ':''}${pmIsExternal(it)?PM_PARTIES[pmParty(it)].icon+' ':''}${pmEsc(it.title)}</div>`).join('')}
      ${list.length>5?`<div style="font-size:10px;color:var(--text-3);margin-top:2px">+${list.length-5} more</div>`:''}
    </div>`;
  };
  const legend = [...projs.values()].map(p=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-right:12px"><span class="pm-dot" style="margin:0;background:${pmEsc(p.color)}"></span>${pmEsc(p.name)}</span>`).join('');
  const go = n=>{ const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
  return `<div class="pm-card">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="pm-btn" onclick="pm.calMonth='${go(-1)}';pmRender()">‹</button>
      <div style="font-size:16px;font-weight:700;min-width:150px;text-align:center">${monthName}</div>
      <button class="pm-btn" onclick="pm.calMonth='${go(1)}';pmRender()">›</button>
      <button class="pm-btn" onclick="pm.calMonth=pmToday().slice(0,7);pmRender()">Today</button>
      <button class="pm-btn primary" onclick="pmCalDeadlines()">⏰ Deadlines</button>
      <span style="margin-left:auto"></span>
      ${pmProjectFilterSel(pm.calProject, "pm.calProject=this.value;pmRender()")}
      <label style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" ${pm.calKeyOnly?'checked':''} onchange="pm.calKeyOnly=this.checked;pmRender()"> Milestones &amp; deliverables only</label>
      <label style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" ${pm.calHideDone?'checked':''} onchange="pm.calHideDone=this.checked;pmRender()"> Hide done</label>
    </div>
    <div style="margin-bottom:8px">${legend}</div>
    <div style="overflow-x:auto"><div style="min-width:720px;border-top:1px solid var(--border);border-left:1px solid var(--border)">
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr))">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div style="font-size:11px;font-weight:700;color:var(--text-3);padding:4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)">${d}</div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr))">${days.map(cell).join('')}</div>
    </div></div>
    <div style="font-size:11px;color:var(--text-3);margin-top:8px">Solid chips are milestones (◆ client, ◇ internal) and deliverables (■); tinted chips are tasks across their work days. Grey days are holidays or office closures. Click anything to edit it.</div>
  </div>`;
}

// ── Timeline (Gantt) ──
const PM_ZOOM = { day:{px:30,label:'Days'}, week:{px:14,label:'Weeks'}, month:{px:5,label:'Months'} };
function pmGanttHtml(){
  const px = PM_ZOOM[pm.ganttZoom].px;
  const projs = pmVisibleProjects(pm.ganttProject);
  const rows = [];
  projs.forEach(p=>{
    rows.push({ kind:'project', p });
    if(pm.collapsed['proj-'+p.id]) return;
    const walk = (pid, depth)=>pmKids(p.id, pid).forEach(it=>{
      if(pm.ganttHideDone && it.status==='done' && it.type!=='phase') return;
      rows.push({ kind:'item', p, it, depth, hasKids: pm.items.some(c=>c.parent_id===it.id) });
      if(!pm.collapsed[it.id]) walk(it.id, depth+1);
    });
    walk(null, 0);
  });
  const dates = pm.items.filter(i=>projs.some(p=>p.id===i.project_id)).flatMap(i=>[i.start_date,i.due_date]).filter(Boolean).sort();
  const today = pmToday();
  let start = pmShift([dates[0]||today, pmShift(today,-30)].sort()[0], -7);
  start = pmShift(start, -pmD(start).getDay()); // start on a Sunday
  let end = pmShift([dates[dates.length-1]||today, pmShift(today, 240)].sort().reverse()[0], 30);
  const nDays = Math.min(1500, Math.round((pmD(end)-pmD(start))/864e5)+1);
  const W = nDays*px, X = d=>Math.round((pmD(d)-pmD(start))/864e5)*px;
  const closures = new Map(pm.closures.map(c=>[c.date,c.label]));
  const RH = 30, LW = 300, HH = 44;

  // header: months on top, days/weeks below
  let months = '', ticks = '', shade = '';
  for(let i=0;i<nDays;i++){
    const d = pmShift(start,i), dt = pmD(d), wd = dt.getDay();
    if(dt.getDate()===1 || i===0) months += `<div style="position:absolute;left:${i*px}px;top:0;height:22px;border-left:1px solid var(--border-2);padding-left:4px;font-size:11px;font-weight:700;color:var(--text-2);white-space:nowrap">${dt.toLocaleDateString('en-US',{month:'short',year:'numeric'})}</div>`;
    if(pm.ganttZoom==='day') ticks += `<div style="position:absolute;left:${i*px}px;top:22px;width:${px}px;text-align:center;font-size:10px;color:${wd===0||wd===6?'var(--text-3)':'var(--text-2)'}">${dt.getDate()}</div>`;
    else if(pm.ganttZoom==='week' && wd===1) ticks += `<div style="position:absolute;left:${i*px}px;top:22px;font-size:10px;color:var(--text-3);border-left:1px solid var(--border);padding-left:2px">${dt.getDate()}</div>`;
    if(pm.ganttZoom!=='month' && (wd===0||wd===6||closures.has(d))) shade += `<div title="${pmEsc(closures.get(d)||'')}" style="position:absolute;left:${i*px}px;top:0;bottom:0;width:${px}px;background:${closures.has(d)?'rgba(107,114,128,.16)':'rgba(107,114,128,.06)'}"></div>`;
  }
  const todayX = X(today) + px/2;

  const label = r=>{
    if(r.kind==='project') return `<div style="height:${RH}px;display:flex;align-items:center;gap:6px;padding:0 8px;font-weight:700;font-size:13px;background:${pmTint(r.p.color,.12)};border-bottom:1px solid var(--border);cursor:pointer" onclick="pm.collapsed['proj-${r.p.id}']=!pm.collapsed['proj-${r.p.id}'];pmSaveCollapsed();pmRender()">
      <span style="color:var(--text-3);width:12px">${pm.collapsed['proj-'+r.p.id]?'▸':'▾'}</span><span class="pm-dot" style="margin:0;background:${pmEsc(r.p.color)}"></span><span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${pmEsc(r.p.name)}</span></div>`;
    const it = r.it;
    return `<div style="height:${RH}px;display:flex;align-items:center;gap:4px;padding:0 6px 0 ${10+r.depth*16}px;font-size:12px;border-bottom:1px solid var(--border);${it.type==='phase'?'font-weight:600':''}${it.status==='done'?';opacity:.55':''}">
      <span style="width:12px;color:var(--text-3);cursor:pointer;flex-shrink:0" onclick="${r.hasKids?`pm.collapsed['${it.id}']=!pm.collapsed['${it.id}'];pmSaveCollapsed();pmRender()`:''}">${r.hasKids?(pm.collapsed[it.id]?'▸':'▾'):''}</span>
      <span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer" onclick="pmEditItem('${it.id}')" title="${pmEsc(it.title)}${pmIsExternal(it)?' · '+pmEsc(pmPartyText(it)):''}">${it.type==='phase'?'':PM_TYPES[it.type].icon+' '}${pmIsExternal(it)?PM_PARTIES[pmParty(it)].icon+' ':''}${pmEsc(it.title)}</span></div>`;
  };
  const bar = r=>{
    if(r.kind==='project'){
      const its = pm.items.filter(i=>i.project_id===r.p.id); const ds = its.flatMap(i=>[i.start_date,i.due_date]).filter(Boolean).sort();
      if(!ds.length) return '';
      return `<div style="position:absolute;left:${X(ds[0])}px;width:${X(ds[ds.length-1])-X(ds[0])+px}px;top:${RH/2-3}px;height:6px;border-radius:3px;background:${pmEsc(r.p.color)};opacity:.5"></div>`;
    }
    const it = r.it, color = r.p.color, done = it.status==='done';
    const tip = `${it.title} · ${PM_TYPES[it.type].label}${pmIsExternal(it)?' · '+pmPartyText(it):''}${it.owner?' · '+it.owner:''}`;
    if(pmIsMilestone(it.type) || (it.type==='deliverable' && !it.start_date)){
      const d = it.due_date||it.start_date; if(!d) return '';
      const x = X(d)+px/2-7, ext = it.type==='milestone_ext', del = it.type==='deliverable';
      return `<div onclick="pmEditItem('${it.id}')" title="${pmEsc(tip)} · ${pmFmt(d,true)}" style="position:absolute;left:${x}px;top:${RH/2-7}px;width:14px;height:14px;cursor:pointer;
          ${del?'':'transform:rotate(45deg);'}background:${ext||del?pmEsc(color):'var(--card)'};border:2px solid ${pmEsc(color)};box-sizing:border-box;${done?'opacity:.45':''}"></div>
        <div style="position:absolute;left:${x+20}px;top:${RH/2-8}px;font-size:11px;white-space:nowrap;color:var(--text-2);pointer-events:none">${pmEsc(it.title)} · ${pmFmt(d)}</div>`;
    }
    const rg = r.hasKids||it.type==='phase' ? pmRange(it) : { start: it.start_date||it.due_date, end: it.due_date||it.start_date };
    if(!rg.start) return '';
    const x = X(rg.start), w = Math.max(px, X(rg.end)-X(rg.start)+px);
    if(r.hasKids || it.type==='phase')
      return `<div title="${pmEsc(tip)} · ${pmFmt(rg.start)} – ${pmFmt(rg.end)}" style="position:absolute;left:${x}px;width:${w}px;top:${RH/2-4}px;height:8px;background:${pmEsc(color)};border-radius:2px;opacity:${it.type==='phase'?.85:.6}"></div>
        <div style="position:absolute;left:${x}px;top:${RH/2+4}px;width:0;height:0;border-left:5px solid ${pmEsc(color)};border-bottom:5px solid transparent"></div>
        <div style="position:absolute;left:${x+w-5}px;top:${RH/2+4}px;width:0;height:0;border-right:5px solid ${pmEsc(color)};border-bottom:5px solid transparent"></div>`;
    const inside = w > 90;
    const pct = done ? 100 : it.status==='in_progress' ? 50 : 0;
    return `<div onclick="pmEditItem('${it.id}')" title="${pmEsc(tip)} · ${pmFmt(rg.start)} – ${pmFmt(rg.end)}" style="position:absolute;left:${x}px;width:${w}px;top:5px;height:${RH-10}px;border-radius:5px;cursor:pointer;
        background:${pmIsExternal(it)?`repeating-linear-gradient(45deg, ${pmTint(color,.18)} 0 6px, ${pmTint(color,.45)} 6px 12px)`:pmTint(color, done?.25:.55)};border:1px ${pmIsExternal(it)?'dashed':'solid'} ${pmEsc(color)};overflow:hidden;${pmOverdue(it)?'box-shadow:0 0 0 2px #dc2626;':''}">
        <div style="position:absolute;inset:0;width:${pct}%;background:${pmTint(color,.5)}"></div>
        ${inside?`<div style="position:relative;font-size:11px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111">${pmEsc(it.title)} · ${pmFmt(rg.end)}</div>`:''}
      </div>
      ${inside?'':`<div style="position:absolute;left:${x+w+5}px;top:${RH/2-8}px;font-size:11px;white-space:nowrap;color:var(--text-2);pointer-events:none">${pmEsc(it.title)} · ${pmFmt(rg.end)}</div>`}`;
  };
  // dependency connectors: short elbow from predecessor end to successor start
  const rowIndex = new Map(rows.map((r,i)=>[r.kind==='item'?r.it.id:'p'+r.p.id, i]));
  let links = '';
  rows.forEach((r,i)=>{
    if(r.kind!=='item' || !r.it.depends_on || !rowIndex.has(r.it.depends_on)) return;
    const pred = pmItem(r.it.depends_on), pi = rowIndex.get(r.it.depends_on);
    const fromStart = r.it.dep_type==='start';
    const pe = fromStart ? (pred.start_date||pred.due_date) : (pred.due_date||pred.start_date), ss = r.it.start_date||r.it.due_date; if(!pe||!ss) return;
    const x1 = X(pe)+(fromStart?0:px), x2 = X(ss)+ (pmIsMilestone(r.it.type)?px/2-7:0), y1 = pi*RH+RH/2, y2 = i*RH+RH/2;
    const xm = Math.max(x1+4, Math.min(x2-4, x1+8));
    links += `<path d="M${x1} ${y1} H${xm} V${y2} H${x2}" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#pm-arrow)"/>`;
  });
  const H = rows.length*RH;
  return `<div class="pm-card">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <div style="font-size:16px;font-weight:700">Timeline</div>
      ${pmProjectFilterSel(pm.ganttProject, "pm.ganttProject=this.value;pmRender()")}
      <div style="display:flex;border:1px solid var(--border-2);border-radius:6px;overflow:hidden">${Object.entries(PM_ZOOM).map(([k,z])=>`<button onclick="pm.ganttZoom='${k}';pmRender();pmGanttToday()" style="font-size:12px;padding:5px 10px;border:none;cursor:pointer;font-family:inherit;background:${pm.ganttZoom===k?'var(--green)':'var(--surface)'};color:${pm.ganttZoom===k?'#fff':'var(--text)'}">${z.label}</button>`).join('')}</div>
      <button class="pm-btn" onclick="pmGanttToday()">Today</button>
      <label style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" ${pm.ganttHideDone?'checked':''} onchange="pm.ganttHideDone=this.checked;pmRender()"> Hide done</label>
      <span style="margin-left:auto;font-size:11px;color:var(--text-3)">◆ client milestone · ◇ internal · ■ deliverable · striped = client or sub · blue line = today · grey = weekend/closure</span>
    </div>
    ${rows.length?`<div id="pm-gantt-scroll" style="overflow:auto;max-height:72vh;border:1px solid var(--border);border-radius:var(--radius-sm)">
      <div style="display:flex;width:${LW+W}px">
        <div style="position:sticky;left:0;z-index:3;width:${LW}px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border-2)">
          <div style="height:${HH}px;position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--border-2)"></div>
          ${rows.map(label).join('')}
        </div>
        <div style="position:relative;width:${W}px">
          <div style="position:sticky;top:0;z-index:2;height:${HH}px;background:var(--card);border-bottom:1px solid var(--border-2)">${months}${ticks}</div>
          <div style="position:relative;height:${H}px">
            ${shade}
            ${rows.map((r,i)=>`<div style="position:absolute;left:0;right:0;top:${i*RH}px;height:${RH}px;border-bottom:1px solid var(--border);${r.kind==='project'?`background:${pmTint(r.p.color,.06)}`:''}">${bar(r)}</div>`).join('')}
            <svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible"><defs><marker id="pm-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/></marker></defs>${links}</svg>
            <div style="position:absolute;left:${todayX}px;top:0;bottom:0;width:2px;background:#2563eb;z-index:1"></div>
            <div style="position:absolute;left:${todayX-5}px;top:-5px;width:12px;height:12px;border-radius:50%;background:#2563eb;z-index:1"></div>
          </div>
        </div>
      </div>
    </div>`:`<div style="font-size:13px;color:var(--text-3)">No projects to show.</div>`}
  </div>`;
}
let pmGanttScrolled = false;
function pmGanttAfter(left, top){
  const s = document.getElementById('pm-gantt-scroll'); if(!s) return;
  if(left!==null && pmGanttScrolled){ s.scrollLeft = left; s.scrollTop = top; }
  else { pmGanttToday(); pmGanttScrolled = true; }
}
function pmGanttToday(){
  const s = document.getElementById('pm-gantt-scroll'); if(!s) return;
  const line = s.querySelector('div[style*="background:#2563eb;z-index:1"]');
  if(line) s.scrollLeft = Math.max(0, parseFloat(line.style.left) - 120);
}

// ── Template editor ──
// Edit a template's phases, tasks and subtasks directly. Works on a copy; nothing saves until Save.
let pmTpl = null; // { id|null, name, items:[nodes], keys:Map }
function pmTplIndex(){
  pmTpl.keys = new Map(); let k = 0;
  const walk = (nodes, parent)=>nodes.forEach(n=>{ n._k = 'n'+(k++); pmTpl.keys.set(n._k, { node:n, list:nodes, parent }); walk(n.children = n.children||[], n); });
  walk(pmTpl.items, null);
}
function pmTplOpen(id){
  const t = id ? pm.templates.find(x=>x.id===id) : null;
  pmTpl = { id: t ? t.id : null, name: t ? t.name : 'New template', items: t ? JSON.parse(JSON.stringify(t.items||[])) : [{ title:'New phase', type:'phase', children:[] }], dirty:false };
  pmTplRender(true);
}
function pmTplCopy(id){
  const t = pm.templates.find(x=>x.id===id);
  pmTpl = { id:null, name: t.name+' (copy)', items: JSON.parse(JSON.stringify(t.items||[])), dirty:true };
  pmTplRender(true);
}
function pmTplRender(fresh){
  pmTplIndex();
  const count = n=>(n.children||[]).reduce((s,c)=>s+1+count(c),0);
  const total = pmTpl.items.reduce((s,p)=>s+1+count(p),0);
  const hrs = (nodes)=>nodes.reduce((s,n)=>s+(Number(n.est_hours)||0)+hrs(n.children||[]),0);
  const row = (n, depth)=>{
    const isPhase = depth===0, ms = pmIsMilestone(n.type), hasKids = (n.children||[]).length>0;
    const types = isPhase ? [['phase','▤ Phase']] : [['task','• Task'],['deliverable','■ Deliverable'],['milestone_ext','◆ Client milestone'],['milestone_int','◇ Internal milestone']];
    return `<div style="display:flex;align-items:center;gap:6px;padding:5px 6px 5px ${6+depth*24}px;border-bottom:1px solid var(--border);${isPhase?'background:var(--surface)':''}">
      <input value="${pmEsc(n.title)}" oninput="pmTplSet('${n._k}','title',this.value)" class="pm-in" style="flex:1;min-width:140px;padding:4px 6px;${isPhase?'font-weight:600':''}" placeholder="${isPhase?'Phase name':'Task name'}">
      ${isPhase?'':`<select onchange="pmTplSet('${n._k}','type',this.value);pmTplRender()" class="pm-in" style="width:150px;padding:4px;font-size:12px">${types.map(([v,l])=>`<option value="${v}"${n.type===v?' selected':''}>${l}</option>`).join('')}</select>
        <select onchange="pmTplSet('${n._k}','party',this.value)" class="pm-in" style="width:96px;padding:4px;font-size:12px" title="Who does it">${[['fs','Field Source'],['client','👤 Client'],['sub','🔧 Sub']].map(([v,l])=>`<option value="${v}"${(n.party||'fs')===v?' selected':''}>${l}</option>`).join('')}</select>
        <select onchange="pmTplSet('${n._k}','owner',this.value)" class="pm-in" style="width:92px;padding:4px;font-size:12px" title="Default owner (or follow-up person for client/sub items)"><option value="">Owner…</option>${PM_OWNERS.map(o=>`<option${n.owner===o.name?' selected':''}>${o.name}</option>`).join('')}</select>`}
      ${isPhase||ms||hasKids?'<span style="width:136px"></span>':`<span style="display:flex;gap:3px;width:136px">
        <input type="number" min="0" step="0.5" value="${(n.unit==='hours'?n.est_hours:n.duration)??''}" oninput="pmTplSetLen('${n._k}',this.value)" class="pm-in" style="width:56px;padding:4px;font-size:12px" placeholder="length" title="Length">
        <select onchange="pmTplSetUnit('${n._k}',this.value)" class="pm-in" style="width:76px;padding:4px;font-size:12px"><option value="days"${n.unit!=='hours'?' selected':''}>days</option><option value="hours"${n.unit==='hours'?' selected':''}>hours</option></select></span>`}
      <span style="display:flex;gap:1px;flex-shrink:0">
        ${ms?'<span style="width:26px"></span>':`<button class="pm-ic" title="Add ${isPhase?'a task':'a subtask'} under this" onclick="pmTplAdd('${n._k}')">＋</button>`}
        <button class="pm-ic" title="Move up" onclick="pmTplMove('${n._k}',-1)">↑</button>
        <button class="pm-ic" title="Move down" onclick="pmTplMove('${n._k}',1)">↓</button>
        ${depth>1?`<button class="pm-ic" title="Move out one level" onclick="pmTplOutdent('${n._k}')">⇤</button>`:''}
        <button class="pm-ic" title="Delete" onclick="pmTplDel('${n._k}')">🗑</button>
      </span>
    </div>` + (n.children||[]).map(c=>row(c, depth+1)).join('');
  };
  const html = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="flex:1"><div class="pm-lbl">Template name</div><input id="pmt-name" class="pm-in" value="${pmEsc(pmTpl.name)}" oninput="pmTpl.name=this.value;pmTpl.dirty=true" style="font-weight:600;font-size:15px"></div>
      <button class="pm-btn" style="margin-top:16px" onclick="pmTplClose()">✕</button>
    </div>
    <div style="font-size:12px;color:var(--text-3);margin:8px 0">${pmTpl.items.length} phases · ${total-pmTpl.items.length} tasks. <b>＋</b> adds a task under a phase or a subtask under a task. <b>Length</b> is optional: pick <b>days</b> for multi-day work or <b>hours</b> for short items (${PM_DAY_HOURS} hours = 1 work day on the calendar).</div>

    <button class="pm-btn" style="margin-top:8px" onclick="pmTplAddPhase()">+ Add phase</button>
    <div style="font-size:11px;color:var(--text-3);margin-top:8px">Changes apply to new projects made from this template. Projects already created from it don't change.</div>
    <div id="pmt-err" style="color:#b91c1c;font-size:12px;margin-top:6px"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="pm-btn" onclick="pmTplClose()">Cancel</button>
      <button class="pm-btn primary" onclick="pmTplSave()">Save template</button>
    </div>`;
  let o = document.getElementById('pm-overlay');
  if(fresh || !o || !document.getElementById('pmt-name')){ o = pmModal(html, 860); o.onclick = e=>{ if(e.target===o) pmTplClose(); }; }
  else { const sheet = o.firstElementChild, st = sheet.querySelector('div[style*="max-height:58vh"]'), top = st?st.scrollTop:0; sheet.innerHTML = '<div class="sheet-handle"></div>'+html; const st2 = sheet.querySelector('div[style*="max-height:58vh"]'); if(st2) st2.scrollTop = top; }
}
function pmTplSet(k, field, val){ const e = pmTpl.keys.get(k); if(!e) return; e.node[field] = val; pmTpl.dirty = true; if(field==='type' && pmIsMilestone(val)){ delete e.node.duration; e.node.children = []; } }
function pmTplSetLen(k, val){
  const e = pmTpl.keys.get(k); if(!e) return; const v = val===''?null:+val;
  if(e.node.unit==='hours') e.node.est_hours = v; else { e.node.duration = v; }
  pmTpl.dirty = true;
}
function pmTplSetUnit(k, unit){
  const e = pmTpl.keys.get(k); if(!e) return; const n = e.node;
  const cur = n.unit==='hours' ? n.est_hours : n.duration;
  if(unit==='hours'){ n.unit='hours'; n.est_hours = cur ?? null; delete n.duration; }
  else { delete n.unit; n.duration = cur ?? null; delete n.est_hours; }
  pmTpl.dirty = true; pmTplRender();
}
function pmTplAdd(k){ const e = pmTpl.keys.get(k); e.node.children = e.node.children||[]; e.node.children.push({ title:'', type:'task', children:[] }); pmTpl.dirty = true; pmTplRender(); pmTplFocusLast(e.node.children[e.node.children.length-1]); }
function pmTplAddPhase(){ pmTpl.items.push({ title:'', type:'phase', children:[] }); pmTpl.dirty = true; pmTplRender(); pmTplFocusLast(pmTpl.items[pmTpl.items.length-1]); }
function pmTplFocusLast(node){ setTimeout(()=>{ const inp = document.querySelector(`#pm-overlay input[oninput*="'${node._k}','title'"]`); if(inp){ inp.focus(); inp.scrollIntoView({block:'nearest'}); } }, 0); }
function pmTplMove(k, dir){ const e = pmTpl.keys.get(k), i = e.list.indexOf(e.node), j = i+dir; if(j<0 || j>=e.list.length) return; [e.list[i], e.list[j]] = [e.list[j], e.list[i]]; pmTpl.dirty = true; pmTplRender(); }
function pmTplOutdent(k){
  const e = pmTpl.keys.get(k); if(!e.parent) return;
  const pe = pmTpl.keys.get(e.parent._k);
  e.list.splice(e.list.indexOf(e.node), 1);
  pe.list.splice(pe.list.indexOf(e.parent)+1, 0, e.node);
  pmTpl.dirty = true; pmTplRender();
}
function pmTplDel(k){
  const e = pmTpl.keys.get(k);
  const n = (e.node.children||[]).length;
  if((n || e.node.title) && !confirm(`Delete "${e.node.title||'this item'}"${n?` and the ${n} item${n===1?'':'s'} under it`:''}?`)) return;
  e.list.splice(e.list.indexOf(e.node), 1); pmTpl.dirty = true; pmTplRender();
}
function pmTplClose(){ if(pmTpl && pmTpl.dirty && !confirm('Close without saving your changes?')) return; document.getElementById('pm-overlay')?.remove(); pmTpl = null; }
function pmTplStrip(nodes, depth){
  return nodes.filter(n=>(n.title||'').trim()).map(n=>{
    const o = { title:n.title.trim(), type: depth===0 ? 'phase' : (n.type||'task') };
    if(depth>0 && n.owner) o.owner = n.owner;
    if(depth>0 && (n.party==='client'||n.party==='sub')){ o.party = n.party; if(n.party==='sub' && n.party_name) o.party_name = n.party_name; }
    if(n.unit==='hours' && !pmIsMilestone(o.type)){ o.unit = 'hours'; if(n.est_hours!=null && n.est_hours!=='') o.est_hours = n.est_hours; }
    else { if(n.duration && !pmIsMilestone(o.type)) o.duration = n.duration; if(n.est_hours!=null && n.est_hours!=='') o.est_hours = n.est_hours; }
    if(n.description) o.description = n.description;
    const kids = pmTplStrip(n.children||[], depth+1); if(kids.length) o.children = kids;
    return o;
  });
}
async function pmTplSave(){
  const name = (pmTpl.name||'').trim();
  if(!name){ document.getElementById('pmt-err').textContent = 'Give the template a name.'; return; }
  const items = pmTplStrip(pmTpl.items, 0);
  if(!items.length){ document.getElementById('pmt-err').textContent = 'Add at least one phase.'; return; }
  try{
    if(pmTpl.id){ await sbFetch('PATCH', `/rest/v1/pm_templates?id=eq.${pmTpl.id}`, { name, items }); Object.assign(pm.templates.find(t=>t.id===pmTpl.id), { name, items }); }
    else { const r = await sbFetch('POST','/rest/v1/pm_templates', { name, items, created_by:(currentUser&&currentUser.email)||'' }); pm.templates.push(r[0]); }
    pm.templates.sort((a,b)=>a.name.localeCompare(b.name));
    pmTpl.dirty = false; pmTplClose(); pmRender(); pmToast('Template saved');
  }catch(e){ document.getElementById('pmt-err').textContent = 'Could not save: '+e.message; }
}

// Consecutive days with the same label show as one range (e.g. Dec 24 – Jan 1, Winter break).
function pmClosureGroups(){
  const groups = [];
  [...pm.closures].sort((a,b)=>a.date.localeCompare(b.date)).forEach(c=>{
    const g = groups[groups.length-1];
    if(g && g.label===c.label && pmShift(g.end,1)===c.date){ g.end = c.date; g.days.push(c); }
    else groups.push({ start:c.date, end:c.date, label:c.label, days:[c] });
  });
  return groups;
}
async function pmAddClosure(){
  const first = document.getElementById('pmc-date').value;
  const last = document.getElementById('pmc-end').value || first;
  const label = document.getElementById('pmc-label').value.trim() || 'Office closed';
  if(!first) return;
  if(last < first){ alert('The last day is before the first day.'); return; }
  const have = new Map(pm.closures.map(c=>[c.date,c]));
  const rows = [], relabel = [];
  for(let d=first, n=0; d<=last && n<120; d=pmShift(d,1), n++){
    const ex = have.get(d);
    if(!ex) rows.push({ date:d, label });
    else if(ex.label!==label && first!==last) relabel.push(ex); // days already listed join the new range's name
  }
  if(!rows.length && !relabel.length){ alert('Those days are already on the list.'); return; }
  try{
    if(relabel.length){ await sbFetch('PATCH', `/rest/v1/pm_closures?id=in.(${relabel.map(c=>c.id).join(',')})`, { label }); relabel.forEach(c=>c.label=label); }
    const r = rows.length ? await sbFetch('POST','/rest/v1/pm_closures', rows) : [];
    pm.closures.push(...(r||[])); pm.closures.sort((a,b)=>a.date.localeCompare(b.date));
    const moved = (await Promise.all(pm.projects.map(p=>pmReschedule(p.id)))).reduce((a,b)=>a+b,0);
    pmRender(); if(moved) pmToast(`${moved} scheduled item${moved===1?'':'s'} shifted around the closure`);
  }catch(e){ alert(e.message); }
}
async function pmDeleteClosureGroup(ids){
  const list = ids.split(',').filter(Boolean);
  if(list.length>1 && !confirm(`Remove all ${list.length} days of this closure?`)) return;
  try{
    await sbFetch('DELETE', `/rest/v1/pm_closures?id=in.(${list.join(',')})`);
    pm.closures = pm.closures.filter(c=>!list.includes(c.id));
    const moved = (await Promise.all(pm.projects.map(p=>pmReschedule(p.id)))).reduce((a,b)=>a+b,0);
    pmRender(); if(moved) pmToast(`${moved} scheduled item${moved===1?'':'s'} moved earlier`);
  }catch(e){ alert(e.message); }
}
async function pmDeleteClosure(id){
  try{ await sbFetch('DELETE', `/rest/v1/pm_closures?id=eq.${id}`); pm.closures = pm.closures.filter(c=>c.id!==id); pmRender(); }catch(e){ alert(e.message); }
}

async function pmUploadFiles(projectId){
  const input = document.getElementById('pmf-file'), files = [...(input.files||[])];
  if(!files.length) return;
  const itemId = document.getElementById('pmf-item').value || null;
  const btn = document.getElementById('pmf-btn'), st = document.getElementById('pmf-status');
  btn.disabled = true;
  try{
    if(typeof ensureFreshToken==='function') await ensureFreshToken();
    for(const [i,file] of files.entries()){
      st.textContent = `Uploading ${i+1} of ${files.length}: ${file.name}…`;
      const path = `${projectId}/${Date.now()}-${file.name.replace(/[^\w.\- ]+/g,'_')}`;
      const up = await fetch(`${SUPABASE_URL}/storage/v1/object/${PM_BUCKET}/${encodeURI(path)}`, {
        method:'POST', headers:{ Authorization:`Bearer ${sbToken()}`, apikey:SUPABASE_KEY, 'Content-Type': file.type||'application/octet-stream', 'x-upsert':'true' },
        body: await file.arrayBuffer(),
      });
      if(!up.ok) throw new Error(`${file.name}: ${up.status} ${(await up.text()).slice(0,150)}`);
      const r = await sbFetch('POST','/rest/v1/pm_files', { project_id:projectId, item_id:itemId, file_name:file.name, file_path:path, size_bytes:file.size, uploaded_by:(currentUser&&currentUser.email)||'' });
      pm.files.unshift(r[0]);
    }
    pmOpenFiles(projectId); pmRender();
  }catch(e){ st.textContent = 'Upload failed: '+e.message; st.style.color='#b91c1c'; btn.disabled=false; }
}
async function pmViewFile(id){
  const f = pm.files.find(x=>x.id===id); if(!f) return;
  try{
    if(typeof ensureFreshToken==='function') await ensureFreshToken();
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${PM_BUCKET}/${encodeURI(f.file_path)}`, {
      method:'POST', headers:{ Authorization:`Bearer ${sbToken()}`, apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ expiresIn: 600 }) });
    const d = await r.json(); if(!d.signedURL) throw new Error(d.message||'no link');
    const url = `${SUPABASE_URL}/storage/v1${d.signedURL}`;
    const viewable = /\.(pdf|png|jpe?g|gif|webp|svg|txt)$/i.test(f.file_name);
    if(!viewable){ window.open(url, '_blank'); return; }
    const o = document.createElement('div'); o.className='modal-overlay centered'; o.id='pm-file-view';
    o.onclick = e=>{ if(e.target===o) o.remove(); };
    o.innerHTML = `<div class="modal-sheet" style="max-width:1100px;width:100%;max-height:94vh;display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><div class="sheet-title" style="margin:0">${pmEsc(f.file_name)}</div>
      <div style="display:flex;gap:6px"><a class="pm-btn" href="${url}" target="_blank" rel="noopener" style="text-decoration:none">Open in new tab ↗</a><button class="pm-btn" onclick="document.getElementById('pm-file-view').remove()">✕</button></div></div>
      ${/\.(png|jpe?g|gif|webp|svg)$/i.test(f.file_name)?`<img src="${url}" style="max-width:100%;max-height:80vh;object-fit:contain;margin:auto">`:`<iframe src="${url}" style="width:100%;height:80vh;border:1px solid var(--border);border-radius:6px"></iframe>`}</div>`;
    document.body.appendChild(o);
  }catch(e){ alert('Could not open the file: '+e.message); }
}
async function pmDeleteFile(id){
  const f = pm.files.find(x=>x.id===id); if(!f || !confirm(`Delete ${f.file_name}?`)) return;
  try{
    await fetch(`${SUPABASE_URL}/storage/v1/object/${PM_BUCKET}/${encodeURI(f.file_path)}`, { method:'DELETE', headers:{ Authorization:`Bearer ${sbToken()}`, apikey:SUPABASE_KEY } });

    pm.files = pm.files.filter(x=>x.id!==id);
    pmOpenFiles(f.project_id); pmRender();
  }catch(e){ alert('Could not delete: '+e.message); }
}

function consultingTotalHours(proj, stage=null){
  const log = proj.hoursLog||[];
  return log.filter(e=>!stage||e.stage===stage).reduce((s,e)=>s+(Number(e.hours)||0),0);
}

function renderConsulting(){
  consultingView = 'board';

  const canLogHours = CONSULTING_LOG_EMAILS.includes(userEmail);

  // Priority sort: High first, then Medium, then Low
  // Sort by most recent update
  const sorted = [...consultingProjects].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));

  // Stats
  const active = consultingProjects.filter(p=>p.stage!=='Post-Presentation').length;
  const totalHrs = consultingProjects.reduce((s,p)=>s+consultingTotalHours(p),0);

  let html = `<div class="stats-bar" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
    <div class="stat-card"><div class="stat-num">${consultingProjects.length}</div><div class="stat-label">Projects</div></div>
    <div class="stat-card"><div class="stat-num">${active}</div><div class="stat-label">Active</div></div>
    <div class="stat-card"><div class="stat-num">${totalHrs.toFixed(1)}</div><div class="stat-label">Total Hours</div></div>

  html += `<div style="display:flex;justify-content:flex-end;margin-bottom:12px">

function openConsultingTaskModal(projId, taskId=null){
  const proj = consultingProjects.find(p=>p.id===projId);
  if(!proj) return;
  const task = taskId ? (proj.tasks||[]).find(t=>t.id===taskId) : null;
  const stageOpts = CONSULTING_STAGES.map(s=>`<option value="${s}"${task&&task.stage===s?' selected':s===proj.stage&&!task?' selected':''}>${s}</option>`).join('');
  const prioOpts = ['High','Medium','Low'].map(p=>`<option value="${p}"${task&&task.priority===p?' selected':p==='Medium'&&!task?' selected':''}>${p}</option>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'ctask-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">${task?'Edit Task':'Add Task'}</div>
    <div class="form-group">
      <label class="form-label">Task Title *</label>
      <input type="text" id="ct-title" placeholder="e.g. Complete site survey, Deliver report draft" value="${task?task.title:''}">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label class="form-label">Stage</label>
        <select id="ct-stage">${stageOpts}</select>
      </div>
      <div class="form-group">
        <label class="form-label">Priority</label>
        <select id="ct-priority">${prioOpts}</select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Due Date</label>
      <input type="date" id="ct-due" value="${task&&task.dueDate?task.dueDate:''}">
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <input type="text" id="ct-notes" placeholder="Additional details..." value="${task&&task.notes?task.notes:''}">
    </div>
    <div id="ct-error" style="color:#dc2626;font-size:12px;margin-bottom:8px"></div>
    <div class="sheet-actions">
      ${task?`<button class="btn-delete" onclick="deleteConsultingTask('${projId}','${taskId}')">Delete</button>`:''}
      <button class="btn-cancel" onclick="document.getElementById('ctask-overlay').remove()">Cancel</button>
      <button class="btn-save" onclick="saveConsultingTask('${projId}','${taskId||''}')">Save Task</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

async function saveConsultingTask(projId, taskId){
  const proj = consultingProjects.find(p=>p.id===projId);
  if(!proj) return;
  const title = document.getElementById('ct-title').value.trim();
  const stage = document.getElementById('ct-stage').value;
  const priority = document.getElementById('ct-priority').value;
  const dueDate = document.getElementById('ct-due').value;
  const notes = document.getElementById('ct-notes').value.trim();
  if(!title){ document.getElementById('ct-error').textContent='Title is required.'; return; }
  const btn = document.querySelector('#ctask-overlay .btn-save');
  btn.disabled=true; btn.textContent='Saving...';
  if(taskId){
    const t = (proj.tasks||[]).find(x=>x.id===taskId);
    if(t) Object.assign(t,{title,stage,priority,dueDate,notes});
  } else {
    proj.tasks = [...(proj.tasks||[]), {id: Date.now().toString(), title, stage, priority, dueDate, notes, done:false, createdAt:new Date().toISOString()}];
  }
  await dbSaveConsulting(proj, projId);
  document.getElementById('ctask-overlay').remove();
  renderConsultingDetail();
}

async function deleteConsultingTask(projId, taskId){
  const proj = consultingProjects.find(p=>p.id===projId);
  if(!proj) return;
  proj.tasks = (proj.tasks||[]).filter(t=>t.id!==taskId);
  await dbSaveConsulting(proj, projId);
  document.getElementById('ctask-overlay').remove();
  renderConsultingDetail();
}

async function toggleConsultingTask(projId, taskId, done){
  const proj = consultingProjects.find(p=>p.id===projId);
  if(!proj) return;
  const t = (proj.tasks||[]).find(x=>x.id===taskId);
  if(t){ t.done=done; t.completedAt=done?new Date().toISOString():null; }
  await dbSaveConsulting(proj, projId);
  renderConsultingDetail();
}


async function logConsultingHours(id){
  const proj = consultingProjects.find(p=>p.id===id);
  if(!proj) return;
  const stage = document.getElementById('ch-stage').value;
  const hours = parseFloat(document.getElementById('ch-hours').value);
  const date = document.getElementById('ch-date').value;
  const note = document.getElementById('ch-note').value.trim();
  if(!hours||hours<=0){ alert('Please enter valid hours.'); return; }
  const loggedBy = getDisplayName(currentUser&&currentUser.email);
  proj.hoursLog = [...(proj.hoursLog||[]), {ts:new Date().toISOString(), date, stage, hours, note, loggedBy}];
  await dbSaveConsulting(proj, id);
  renderConsultingDetail();
}

async function advanceConsultingStage(id){
  const proj = consultingProjects.find(p=>p.id===id);
  if(!proj) return;
  const idx = CONSULTING_STAGES.indexOf(proj.stage);
  if(idx < CONSULTING_STAGES.length-1){
    proj.stage = CONSULTING_STAGES[idx+1];
    proj.updatedAt = new Date().toISOString();
    await dbSaveConsulting(proj, id);
    renderConsultingDetail();
  }
}

async function goBackConsultingStage(id){
  const proj = consultingProjects.find(p=>p.id===id);
  if(!proj) return;
  const idx = CONSULTING_STAGES.indexOf(proj.stage);
  if(idx > 0){
    proj.stage = CONSULTING_STAGES[idx-1];
    proj.updatedAt = new Date().toISOString();
    await dbSaveConsulting(proj, id);
    renderConsultingDetail();
  }
}

async function deleteConsultingProject(id){
  if(!confirm('Delete this project? This cannot be undone.')) return;
  await dbDeleteConsulting(id);
  consultingProjects = consultingProjects.filter(p=>p.id!==id);
  renderConsulting();
}

async function saveConsultingProject(id){
  const client = document.getElementById('cp-client').value.trim();
  const projectName = document.getElementById('cp-name').value.trim();
  const stage = document.getElementById('cp-stage').value;
  const priority = '';
  const notes = document.getElementById('cp-notes').value.trim();
  const errEl = document.getElementById('cp-error');
  if(!client){ errEl.textContent='Client name is required.'; return; }
  // Collect due dates
  const stageDueDates = {};
  CONSULTING_STAGES.forEach(s=>{
    const val = document.getElementById('cp-due-'+s.replace(/\s+/g,'-'));
    if(val&&val.value) stageDueDates[s]=val.value;
  });
  const btn = document.querySelector('#consulting-overlay .btn-save');
  btn.disabled=true; btn.textContent='Saving...';
  try{
    if(id){
      const proj = consultingProjects.find(p=>p.id===id);
      Object.assign(proj,{client,projectName,stage,priority,notes,stageDueDates,updatedAt:new Date().toISOString()});
      await dbSaveConsulting(proj,id);
    } else {
      const newP = {client,projectName,stage,priority,notes,stageDueDates,hoursLog:[],tasks:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
      const newId = await dbSaveConsulting(newP);
      if(newId){ newP.id=newId; consultingProjects.unshift(newP); }
    }
    document.getElementById('consulting-overlay').remove();
    if(consultingView==='detail') renderConsultingDetail();
    else renderConsulting();
  } catch(e){
    errEl.textContent='Error saving. Please try again.';
    btn.disabled=false; btn.textContent='Save';
  }
}

function calcLoan(l){
  // If we have an actual balance from a statement, use it instead of calculated
  if(l.actualBalance !== null && l.actualBalance !== undefined){
    const r = l.rate / 12;
    const n = l.term;
    // Use actual payment from statement if stored, otherwise calculate
    const payment = l.actualPayment || (r === 0 ? l.principal / n : l.principal * (r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1));
    const balance = l.actualBalance;
    const interest = balance * r;
    const principalPortion = Math.max(0, payment - interest);
    const payoff = new Date(l.startDate + 'T12:00:00');
    payoff.setMonth(payoff.getMonth() + n);
    const today = new Date(); today.setHours(0,0,0,0);
    const start = new Date(l.startDate + 'T12:00:00');
    let monthsElapsed = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
    if(today.getDate() < start.getDate()) monthsElapsed--;
    const p = Math.min(Math.max(0, monthsElapsed), n);
    const monthsRemaining = Math.max(0, n - p);
    return { payment, balance, interest, principalPortion, monthsRemaining, payoff };
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(l.startDate + 'T12:00:00');
  const r = l.rate / 12;
  const n = l.term;

  // Monthly payment (handle 0% separately)
  const payment = r === 0
    ? l.principal / n
    : l.principal * (r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);

  // Payments made so far — count full months since start day
  // e.g. start Dec 31, today Jul 2: first payment Jan 31, so 6 payments made not 7
  let monthsElapsed = (today.getFullYear() - start.getFullYear()) * 12
    + (today.getMonth() - start.getMonth());
  if(today.getDate() < start.getDate()) monthsElapsed--;
  const p = Math.min(Math.max(0, monthsElapsed), n);

  // Current balance
  let balance;
  if(r === 0){
    balance = Math.max(0, l.principal - payment * p);
  } else {
    balance = p >= n ? 0 : l.principal * (Math.pow(1+r, n) - Math.pow(1+r, p)) / (Math.pow(1+r, n) - 1);
  }

  const interest = balance * r;
  const principalPortion = payment - interest;
  const monthsRemaining = Math.max(0, n - p);

  const payoff = new Date(start);
  payoff.setMonth(payoff.getMonth() + n);

  return { payment, balance, interest, principalPortion, monthsRemaining, payoff };
}

async function saveFleetLoan(id){
  const name      = document.getElementById('fl-name').value.trim();
  const lender    = document.getElementById('fl-lender').value.trim();
  const principal = parseFloat(document.getElementById('fl-principal').value);
  const rate      = parseFloat(document.getElementById('fl-rate').value)||0;
  const term      = parseInt(document.getElementById('fl-term').value);
  const startDate = document.getElementById('fl-start').value;
  const notes     = document.getElementById('fl-notes').value.trim();
  const errEl     = document.getElementById('fl-error');
  if(!name||!lender||!principal||!term||!startDate){ errEl.textContent='Please fill in all required fields.'; return; }
  const btn = document.querySelector('#fleet-overlay .btn-save');
  btn.disabled=true; btn.textContent='Saving...';
  try {
    const row = {name, lender, principal, rate, term, start_date:startDate, notes, updated_at:new Date().toISOString()};
    if(id){
      await sbFetch('PATCH', `/rest/v1/fleet_loans?id=eq.${id}`, row);
      const l = fleetLoans.find(x=>x.id===id);
      if(l) Object.assign(l,{name,lender,principal,rate,term,startDate,notes});
    } else {
      const res = await sbFetch('POST', '/rest/v1/fleet_loans', row);
      if(res&&res[0]) fleetLoans.push({...row, id:res[0].id, startDate});
    }
    document.getElementById('fleet-overlay').remove();
    renderFleet();
  } catch(e){ errEl.textContent='Error saving. Try again.'; btn.disabled=false; btn.textContent='Save'; }
}

async function deleteFleetLoan(id){
  if(!confirm('Delete this loan? This cannot be undone.')) return;
  await sbFetch('DELETE', `/rest/v1/fleet_loans?id=eq.${id}`);
  fleetLoans = fleetLoans.filter(l=>l.id!==id);
  document.getElementById('fleet-overlay').remove();
  renderFleet();
}

}

function renderEstimates(){
  const userEmail = (currentUser&&currentUser.email||'').toLowerCase();
  const canEdit = ['jake@fieldsourceohio.com','ryan@fieldsourceohio.com','matt@fieldsourceohio.com','haller@fieldsourceohio.com'].includes(userEmail);

  if(!estimates.length){
    document.getElementById('main-content').innerHTML = `<div style="text-align:center;padding:48px;color:var(--text-3)">Loading estimates...</div>`;

  const STATUS_PRIORITY = {'Needs Shot':0,'Needs Site Visit':1,'Estimate In Progress':2,'Not Started':3,'Estimate Sent':4,'Approved':5,'Scheduled':6,'In Progress':7,'On Hold':8,'Completed':9};

  let filtered = [...estimates];
  if(estimateStatusFilter!=='All') filtered = filtered.filter(e=>e.status===estimateStatusFilter);
  if(estimateTypeFilter!=='All') filtered = filtered.filter(e=>e.type===estimateTypeFilter);
  if(estimateClientFilter==='__none__') filtered = filtered.filter(e=>!(e.client||'').trim());
  else if(estimateClientFilter) filtered = filtered.filter(e=>(e.client||'').trim()===estimateClientFilter);
  if(estimateCreatedFrom) filtered = filtered.filter(e=>e.createdDate && e.createdDate>=estimateCreatedFrom);
  if(estimateCreatedTo) filtered = filtered.filter(e=>e.createdDate && e.createdDate<=estimateCreatedTo);

  // Column sort. Blank values always sink to the bottom, whichever direction.
  const sortVal = e=>{
    switch(estimateSortBy){
      case 'name': return (e.projectName||'').toLowerCase()||null;
      case 'type': return e.type||null;
      case 'amount': return e.amount??null;
      case 'created': return e.createdDate||null;
      case 'due': return e.estDueDate||null;
      case 'status': return STATUS_PRIORITY[e.status]??99;
      case 'days': { const d=parseFloat(e.days); return isNaN(d)?null:d; }
      case 'proposal': return e.proposalNeeded?1:0;
      case 'tips': return e.tips?1:0;
    }
    return null;
  };
  const dir = estimateSortDir==='desc'?-1:1;
  filtered.sort((a,b)=>{
    const av=sortVal(a), bv=sortVal(b);
    if(av===null && bv!==null) return 1;
    if(bv===null && av!==null) return -1;
    if(av!==null && bv!==null && av!==bv){
      const c = (typeof av==='number'&&typeof bv==='number') ? av-bv : String(av).localeCompare(String(bv));
      if(c) return c*dir;

    return (a.projectName||'').localeCompare(b.projectName||'');

    ${(estimateCreatedFrom||estimateCreatedTo)?`<button onclick="estimateCreatedFrom='';estimateCreatedTo='';renderEstimates()" class="site-chip" style="padding:4px 10px">Clear</button>`:''}
    <span style="font-size:12px;color:var(--text-3);margin-left:auto">${filtered.length} of ${estimates.length} · <b style="color:var(--text)">${fmtEstMoney(filtered.reduce((t,e)=>t+(e.amount||0),0))}</b></span>
  </div>`;

  if(!filtered.length){
    html += `<div style="text-align:center;padding:48px;color:var(--text-3)">No estimates match the current filters.</div>`;
  } else {

    html += `<div style="display:grid;grid-template-columns:2fr 100px 110px 100px 100px 110px 70px 70px 50px;gap:0;padding:10px 14px;background:var(--accent);border-bottom:1px solid var(--border)">

      <div onclick="sortEstimatesBy('type')" title="Sort by Type" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);cursor:pointer;user-select:none;${estimateSortBy==='type'?'color:var(--text)':''}">Type${estimateSortBy==='type'?(estimateSortDir==='asc'?' ▲':' ▼'):''}</div>
      <div onclick="sortEstimatesBy('amount')" title="Sort by Amount" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);cursor:pointer;user-select:none;${estimateSortBy==='amount'?'color:var(--text)':''}">Amount${estimateSortBy==='amount'?(estimateSortDir==='asc'?' ▲':' ▼'):''}</div>
      <div onclick="sortEstimatesBy('created')" title="Sort by Created" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);cursor:pointer;user-select:none;${estimateSortBy==='created'?'color:var(--text)':''}">Created${estimateSortBy==='created'?(estimateSortDir==='asc'?' ▲':' ▼'):''}</div>
      <div onclick="sortEstimatesBy('due')" title="Sort by Due Date" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);cursor:pointer;user-select:none;${estimateSortBy==='due'?'color:var(--text)':''}">Due Date${estimateSortBy==='due'?(estimateSortDir==='asc'?' ▲':' ▼'):''}</div>
      <div onclick="sortEstimatesBy('status')" title="Sort by Status" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);cursor:pointer;user-select:none;${estimateSortBy==='status'?'color:var(--text)':''}">Status${estimateSortBy==='status'?(estimateSortDir==='asc'?' ▲':' ▼'):''}</div>
      <div onclick="sortEstimatesBy('days')" title="Sort by Days" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);cursor:pointer;user-select:none;${estimateSortBy==='days'?'color:var(--text)':''}">Days${estimateSortBy==='days'?(estimateSortDir==='asc'?' ▲':' ▼'):''}</div>
      <div onclick="sortEstimatesBy('proposal')" title="Sort by Proposal" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);cursor:pointer;user-select:none;${estimateSortBy==='proposal'?'color:var(--text)':''}">Proposal${estimateSortBy==='proposal'?(estimateSortDir==='asc'?' ▲':' ▼'):''}</div>

    filtered.forEach(e=>{
      const sc = ESTIMATE_STATUS_COLORS[e.status]||{bg:'#f1f5f9',text:'#475569'};

        <div>

          ${(e.qbNumber||e.client)?`<div style="font-size:11px;color:var(--text-3);margin-top:2px">${e.qbNumber?`Est #${e.qbNumber}`:''}${e.qbNumber&&e.client?' · ':''}${e.client}${e.qbStatus?` · QB ${e.qbStatus}`:''}</div>`:''}

// Click a header: same column flips direction; a new column starts in its natural order
// (A–Z for text, soonest due first, newest/largest first for created and amount).
function sortEstimatesBy(key){
  if(estimateSortBy===key) estimateSortDir = estimateSortDir==='asc'?'desc':'asc';
  else { estimateSortBy = key; estimateSortDir = ['amount','created','proposal','tips'].includes(key)?'desc':'asc'; }
  renderEstimates();
}

function escEst(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtEstMoney2(n){
  return (n<0?'-$':'$')+Math.abs(Number(n||0)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

// QuickBooks line items, from the qb_estimates / qb_estimate_lines tables kept fresh by qb-sync.
async function loadQbLines(docNumber){
  const slot = document.getElementById('qb-lines-slot');
  if(!slot) return;
  const th = 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);padding:6px 8px;text-align:left;white-space:nowrap;background:var(--accent)';
  const td = 'font-size:12px;color:var(--text);padding:6px 8px;border-top:1px solid var(--border);vertical-align:top';
  try{
    const est = await sbFetch('GET', `/rest/v1/qb_estimates?estimate_number=eq.${encodeURIComponent(docNumber)}&select=id,total,qb_status,synced_at&limit=1`);
    if(!est || !est.length){
      slot.textContent = 'This estimate number isn\'t in the QuickBooks sync yet. It should appear after the next sync.';
      return;
    }
    const qlines = await sbFetch('GET', `/rest/v1/qb_estimate_lines?estimate_id=eq.${est[0].id}&select=line_number,description,quantity,unit_price,amount,item_type&order=line_number`);
    if(!qlines || !qlines.length){ slot.textContent = 'QuickBooks has no line items on this estimate.'; return; }
    const total = qlines.reduce((t,l)=>t+(Number(l.amount)||0),0);
    slot.removeAttribute('style');
    slot.innerHTML = `<div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr><th style="${th}">Description</th><th style="${th};text-align:right">Qty</th><th style="${th};text-align:right">Rate</th><th style="${th};text-align:right">Amount</th></tr></thead>
        <tbody>
          ${qlines.map(l=>`<tr>
            <td style="${td}">${escEst(l.description)}</td>
            <td style="${td};text-align:right">${l.item_type==='DescriptionOnly'?'':(Number(l.quantity)||0).toLocaleString('en-US')}</td>
            <td style="${td};text-align:right;white-space:nowrap">${l.item_type==='DescriptionOnly'?'':fmtEstMoney2(l.unit_price)}</td>
            <td style="${td};text-align:right;white-space:nowrap">${l.item_type==='DescriptionOnly'?'':fmtEstMoney2(l.amount)}</td>
          </tr>`).join('')}
          <tr><td style="${td};font-weight:700">Total</td><td style="${td}"></td><td style="${td}"></td><td style="${td};text-align:right;font-weight:700;white-space:nowrap">${fmtEstMoney2(total)}</td></tr>
        </tbody>
      </table></div>
      <div style="font-size:11px;color:var(--text-3);margin-top:6px">From QuickBooks · synced ${new Date(est[0].synced_at).toLocaleString()}</div>`;
  } catch(err){
    console.error(err);
    slot.textContent = 'Couldn\'t load line items from QuickBooks.';
  }
}

// Opens the real QuickBooks estimate PDF in a new tab.
async function previewQbEstimatePdf(docNumber){
  const btn = document.getElementById('qb-pdf-btn');
  const win = window.open('', '_blank');
  if(win) win.document.write('<p style="font-family:system-ui;padding:20px">Loading estimate from QuickBooks…</p>');
  if(btn){ btn.disabled = true; btn.textContent = 'Loading PDF…'; }
  try{
    const r = await fetch(`/.netlify/functions/qb-estimate-pdf?doc=${encodeURIComponent(docNumber)}`, {
      headers: { 'Authorization': 'Bearer '+(currentToken||'') },
    });
    if(!r.ok){
      const err = await r.json().catch(()=>({}));
      throw new Error(err.error || `Error ${r.status}`);
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    if(win) win.location.href = url; else window.open(url, '_blank');
  } catch(err){
    if(win) win.close();
    alert('Could not load the estimate PDF: ' + err.message);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = '📄 Preview estimate PDF'; }
  }
}

// ===================== QUICKBOOKS INVOICES: billed-to-date + receivables =====================
let qbInvoices = [], invLinks = [], qbInvLoaded = false, qbInvLoading = null, qbInvLoadError = '';
async function loadQbInvoices(force){
  if(qbInvLoaded && !force) return;
  if(qbInvLoading) return qbInvLoading;
  qbInvLoading = (async ()=>{
    try{
      if(typeof ensureFreshToken==='function') await ensureFreshToken();
      const all = [];
      for(let from=0; from<200000; from+=1000){
        const page = await sbFetch('GET', `/rest/v1/qb_invoices?select=*&order=qb_invoice_id.asc&limit=1000&offset=${from}`);
        all.push(...(page||[])); if(!page || page.length < 1000) break;
      }
      qbInvLoadError = '';
      qbInvoices = all.filter(i=>Number(i.total)!==0 || Number(i.balance)!==0); // leave out voided ($0) invoices
      invLinks = (await sbFetch('GET','/rest/v1/invoice_estimate_links?select=*'))||[];
      qbInvLoaded = true;
    }catch(e){ console.warn('QuickBooks invoices not available yet:', e.message); qbInvLoadError = e.message; qbInvoices = []; invLinks = []; qbInvLoaded = true; }
    finally{ qbInvLoading = null; }
  })();
  return qbInvLoading;
}
const arMoney = n=>(Number(n)<0?'-$':'$')+Math.abs(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const arMoney0 = n=>'$'+Math.round(Number(n)||0).toLocaleString('en-US');
const arEsc = v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const arFmt = d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
function arToday(){ return new Date().toLocaleDateString('en-CA'); }
function invDaysPast(inv){ if(!inv.due_date || Number(inv.balance)<=0.005) return 0; return Math.max(0, Math.floor((new Date(arToday()+'T12:00:00') - new Date(inv.due_date+'T12:00:00'))/864e5)); }
function invStatus(inv){
  if(inv.balance==null) return { label:'Not synced yet', bg:'#f1f5f9', fg:'#64748b' };
  if(Number(inv.balance)<=0.005) return { label:'Paid', bg:'#dcfce7', fg:'#166534' };
  const d = invDaysPast(inv);
  if(d>0) return { label:`Overdue ${d}d`, bg: d>60?'#fecaca':'#fee2e2', fg:'#991b1b' };
  if(Number(inv.balance) < Number(inv.total)-0.005) return { label:'Partly paid', bg:'#fef3c7', fg:'#92400e' };
  return { label:'Open', bg:'#dbeafe', fg:'#1d4ed8' };
}
function invChip(inv){ const s = invStatus(inv); return `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:${s.bg};color:${s.fg};white-space:nowrap">${s.label}</span>`; }
// An estimate's invoices: linked in QuickBooks, linked by hand in the tracker, or matched by the Billing Tracker
// (by invoice number). Billing Tracker matches that haven't synced from QuickBooks yet still count as billed.
function invoicesForEstimate(num){
  if(!num) return [];
  num = String(num);
  const manual = new Set(invLinks.filter(l=>l.estimate_number===num).map(l=>l.qb_invoice_id));
  const notThis = new Set(invLinks.filter(l=>l.estimate_number==='not:'+num).map(l=>l.qb_invoice_id));
  const out = qbInvoices.filter(i=>!notThis.has(i.qb_invoice_id) && ((i.linked_estimate_numbers||[]).includes(num) || manual.has(i.qb_invoice_id) || (i.auto_estimate_numbers||[]).includes(num)))
    .map(i=>(i.linked_estimate_numbers||[]).includes(num)||manual.has(i.qb_invoice_id) ? i : { ...i, _via:'auto', _how:i.auto_match });
  const have = new Set(out.map(i=>String(i.doc_number)));
  const est = (typeof estimates!=='undefined' ? estimates : []).find(x=>String(x.qbNumber)===num);
  (est && est.priorInvoices || []).forEach(p=>{
    const n = String(p.number||'').trim(); if(!n || have.has(n)) return;
    const qn = qbInvoices.find(i=>String(i.doc_number)===n); if(qn && notThis.has(qn.qb_invoice_id)) return;
    const q = qbInvoices.find(i=>String(i.doc_number)===n);
    out.push(q ? { ...q, _via:'billing tracker' } : { qb_invoice_id:'bt-'+n, doc_number:n, txn_date:p.date||null, due_date:null, total:Number(p.amount)||0, balance:null, _via:'billing tracker', _unsynced:true });
    have.add(n);
  });
  return out;
}
function estimateBilling(e){
  const inv = invoicesForEstimate(e.qbNumber);
  const billed = inv.reduce((t,i)=>t+Number(i.total||0),0);
  const known = inv.filter(i=>i.balance!=null);
  const open = known.reduce((t,i)=>t+Number(i.balance||0),0);
  const collected = known.reduce((t,i)=>t+Number(i.total||0)-Number(i.balance||0),0);
  const unsynced = inv.filter(i=>i.balance==null).reduce((t,i)=>t+Number(i.total||0),0);
  const contract = Number(e.amount)||0;
  return { inv, billed, collected, open, unsynced, contract, remaining: contract-billed, pct: contract ? billed/contract*100 : 0 };
}

// Line by line: estimate line vs. invoice lines (matched by QuickBooks item, then description)
async function renderEstimateLineBilling(e, invs){
  const box = document.getElementById('est-billing-lines'); if(!box) return;
  try{
    const est = await sbFetch('GET', `/rest/v1/qb_estimates?estimate_number=eq.${encodeURIComponent(e.qbNumber)}&select=id&limit=1`);
    const elines = est && est.length ? (await sbFetch('GET', `/rest/v1/qb_estimate_lines?estimate_id=eq.${est[0].id}&item_type=eq.SalesItemLineDetail&select=line_number,item_name,description,amount&order=line_number`))||[] : [];
    const ilines = (await sbFetch('GET', `/rest/v1/qb_invoice_lines?qb_invoice_id=in.(${invs.map(i=>i.qb_invoice_id).join(',')})&select=item_name,description,amount`))||[];
    if(!elines.length){ box.textContent = ''; return; }
    const norm = s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
    const billed = elines.map(()=>0); let unmatched = 0;
    ilines.forEach(il=>{
      let idx = elines.findIndex(el=>el.item_name && norm(el.item_name)===norm(il.item_name) && norm(el.description)===norm(il.description));
      if(idx<0){ const byItem = elines.map((el,k)=>el.item_name && norm(el.item_name)===norm(il.item_name)?k:-1).filter(k=>k>=0); if(byItem.length===1) idx = byItem[0]; }
      if(idx<0) idx = elines.findIndex(el=>norm(el.description) && norm(el.description)===norm(il.description));
      if(idx>=0) billed[idx] += Number(il.amount)||0; else unmatched += Number(il.amount)||0;
    });
    const th = 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-2);padding:6px 8px;text-align:left;background:var(--accent)';
    const td = 'font-size:12px;color:var(--text);padding:6px 8px;border-top:1px solid var(--border)';
    box.innerHTML = `<div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm)"><table style="width:100%;border-collapse:collapse">
      <thead><tr><th style="${th}">Estimate line</th><th style="${th};text-align:right">Contract</th><th style="${th};text-align:right">Billed</th><th style="${th};text-align:right">Left</th><th style="${th};width:90px"></th></tr></thead>
      <tbody>${elines.map((el,k)=>{ const c = Number(el.amount)||0, bl = billed[k], pct = c ? Math.min(100, bl/c*100) : 0, over = bl > c + 0.5;
        return `<tr><td style="${td}">${arEsc(el.description||el.item_name)}</td><td style="${td};text-align:right">${arMoney(c)}</td>

          <td style="${td}"><div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${over?'#dc2626':'var(--green)'}"></div></div></td></tr>`; }).join('')}
      ${unmatched?`<tr><td style="${td};color:var(--text-3)" colspan="2">Invoice lines that don't match an estimate line (extras, change orders, reimbursables)</td><td style="${td};text-align:right">${arMoney(unmatched)}</td><td style="${td}" colspan="2"></td></tr>`:''}
      </tbody></table></div>`;
  }catch(err){ box.textContent = ''; console.warn(err); }
}
// Link invoices QuickBooks didn't connect to this estimate
function openLinkInvoices(estNum, client){
  const taken = new Set(invoicesForEstimate(estNum).map(i=>i.qb_invoice_id));
  const c = String(client||'').toLowerCase();
  const cand = qbInvoices.filter(i=>!taken.has(i.qb_invoice_id) && (!c || String(i.customer_name||'').toLowerCase()===c))
    .sort((a,b)=>(b.txn_date||'').localeCompare(a.txn_date||'')).slice(0,200);
  const linkedElsewhere = i=>{ const n = [...(i.linked_estimate_numbers||[]), ...invLinks.filter(l=>l.qb_invoice_id===i.qb_invoice_id && !l.estimate_number.startsWith('not:')).map(l=>l.estimate_number), ...(i.auto_estimate_numbers||[])]; return n.length ? 'on #'+[...new Set(n)].join(', #') : ''; };
  document.getElementById('link-inv-overlay')?.remove();
  const o = document.createElement('div'); o.className='modal-overlay centered'; o.id='link-inv-overlay';
  o.onclick = ev=>{ if(ev.target===o) o.remove(); };
  o.innerHTML = `<div class="modal-sheet" style="max-width:640px;max-height:88vh;overflow-y:auto"><div class="sheet-handle"></div>
    <div class="sheet-title" style="margin-bottom:2px">Link invoices to estimate #${arEsc(estNum)}</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:10px">${arEsc(client||'All customers')} · invoices QuickBooks didn't already connect to this estimate</div>
    ${cand.length ? cand.map(i=>`<label style="display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer">
      <input type="checkbox" class="link-inv-cb" value="${i.qb_invoice_id}">
      <span style="flex:1"><b>#${arEsc(i.doc_number)}</b> · ${arFmt(i.txn_date)} ${linkedElsewhere(i)?`<span style="font-size:11px;color:#b45309">(${linkedElsewhere(i)})</span>`:''}</span>
      <span>${arMoney(i.total)}</span>${invChip(i)}</label>`).join('') : '<div style="font-size:13px;color:var(--text-3);padding:10px 0">No other invoices for this customer.</div>'}

      <button class="btn-save" onclick="saveInvoiceLinks('${arEsc(estNum)}')">Link selected</button></div></div>`;
  document.body.appendChild(o);
}
async function saveInvoiceLinks(estNum){
  const ids = [...document.querySelectorAll('.link-inv-cb:checked')].map(c=>c.value); if(!ids.length) return;
  try{
    const rows = ids.map(id=>({ qb_invoice_id:id, estimate_number:String(estNum), linked_by:(currentUser&&currentUser.email)||'' }));
    await sbFetch('POST','/rest/v1/invoice_estimate_links', rows); invLinks.push(...rows);
    document.getElementById('link-inv-overlay').remove();
    const e = estimates.find(x=>x.qbNumber===String(estNum)); if(e) renderEstimateBilling(e);
    if(view==='estimates') renderEstimates();
  }catch(err){ alert('Could not link: '+err.message); }
}
async function notThisEstimate(invId, estNum){
  if(!confirm('This invoice is not part of this estimate? It will stop counting toward its billing.')) return;
  try{ const row = { qb_invoice_id:invId, estimate_number:'not:'+estNum, linked_by:(currentUser&&currentUser.email)||'' };
    await sbFetch('POST','/rest/v1/invoice_estimate_links', row); invLinks.push(row);
    const e = estimates.find(x=>x.qbNumber===String(estNum)); if(e) renderEstimateBilling(e); if(view==='estimates') renderEstimates(); }
  catch(err){ alert(err.message); }
}
async function unlinkInvoice(invId, estNum){
  if(!confirm('Unlink this invoice from the estimate?')) return;
  try{ await sbFetch('DELETE', `/rest/v1/invoice_estimate_links?qb_invoice_id=eq.${invId}&estimate_number=eq.${encodeURIComponent(estNum)}`);
    invLinks = invLinks.filter(l=>!(l.qb_invoice_id===invId && l.estimate_number===String(estNum)));
    const e = estimates.find(x=>x.qbNumber===String(estNum)); if(e) renderEstimateBilling(e); if(view==='estimates') renderEstimates(); }
  catch(err){ alert(err.message); }
}

const INVOICE_BILLERS = ['jake@fieldsourceohio.com','ryan@fieldsourceohio.com','gibson@fieldsourceohio.com'];

async function invAction(body){

function billOverlay(id, html, width){

let billState = null;
async function openInvoiceBuilder(estNum){
  if(!canBillInvoices()){ alert('Only Jake, Ryan and Ali can create invoices.'); return; }
  billOverlay('bill-overlay', `<div style="padding:30px;text-align:center;color:var(--text-3)">Loading estimate #${arEsc(estNum)} from QuickBooks…</div>`);
  try{
    await loadQbInvoices();
    const prep = await invAction({ action:'prepare', estimate_number:estNum });
    const e = estimates.find(x=>String(x.qbNumber)===String(estNum)) || { qbNumber:estNum, amount:prep.estimate.total };
    const invs = invoicesForEstimate(estNum).filter(i=>!i._unsynced);
    const ilines = invs.length ? (await sbFetch('GET', `/rest/v1/qb_invoice_lines?qb_invoice_id=in.(${invs.map(i=>i.qb_invoice_id).join(',')})&select=item_name,description,amount,quantity`))||[] : [];
    const norm = s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
    const billed = prep.lines.map(()=>({ amt:0, qty:0 }));
    ilines.forEach(il=>{
      let k = prep.lines.findIndex(l=>norm(l.item_name)===norm(il.item_name) && norm(l.description)===norm(il.description));
      if(k<0){ const m = prep.lines.map((l,j)=>norm(l.item_name)===norm(il.item_name)?j:-1).filter(j=>j>=0); if(m.length===1) k = m[0]; }
      if(k<0) k = prep.lines.findIndex(l=>norm(l.description) && norm(l.description)===norm(il.description));
      if(k>=0){ billed[k].amt += Number(il.amount)||0; billed[k].qty += Number(il.quantity)||0; }
    });
    const unsyncedBilled = invoicesForEstimate(estNum).filter(i=>i._unsynced).reduce((t,i)=>t+Number(i.total||0),0);
    const today = arToday();
    billState = { estNum, prep, e, billed, mode:'pct', unsyncedBilled,
      rows: prep.lines.map((l,k)=>({ ...l, billedAmt:billed[k].amt, billedQty:billed[k].qty, input:'', description:l.description })),
      doc: prep.next_doc_number||'', date: today, due:'', po:'', memo:'' };
    renderInvoiceBuilder();
  }catch(err){ billOverlay('bill-overlay', `<div class="sheet-title">Couldn't load the estimate</div><div style="color:#b91c1c;font-size:13px;margin:8px 0 14px">${arEsc(err.message)}</div><div style="text-align:right"><button class="btn-cancel" onclick="document.getElementById('bill-overlay').remove()">Close</button></div>`, 520); }
}
function billRowAmount(r){
  const v = parseFloat(r.input); if(isNaN(v)) return 0;
  if(billState.mode==='pct') return Math.round((r.amount * v/100 - r.billedAmt)*100)/100;   // % complete to date → bill the difference
  if(billState.mode==='qty') return Math.round(v * r.rate * 100)/100;                       // quantity done this invoice
  return Math.round(v*100)/100;                                                               // dollar amount
}

      <div><div style="${billLbl}">PO #</div><input style="${billInput}" value="${arEsc(st.po)}" oninput="billState.po=this.value"></div>

      ${[['pct','% complete to date'],['qty','Quantity done'],['amt','Dollar amount']].map(([m,l])=>`<button onclick="billState.mode='${m}';billState.rows.forEach(r=>r.input='');renderInvoiceBuilder()" class="site-chip${st.mode===m?' active':''}" style="padding:4px 10px;font-size:12px">${l}</button>`).join('')}
      <button onclick="billFillRemaining()" class="site-chip" style="padding:4px 10px;font-size:12px;margin-left:auto" title="Bill everything that's left on every line">Bill all remaining</button>

        return `<tr><td style="${td}"><textarea rows="2" style="${billInput};font-size:12px;resize:vertical" oninput="billState.rows[${k}].description=this.value">${arEsc(r.description)}</textarea><div style="font-size:10px;color:var(--text-3);margin-top:2px">${arEsc(r.item_name)}${r.qty?` · ${r.qty} @ ${arMoney(r.rate)}`:''}</div></td>
          <td style="${td};text-align:right">${arMoney(r.amount)}</td>

          <td style="${td};text-align:right" id="bill-amt-${k}"><b style="${over||neg?'color:#dc2626':''}">${arMoney(amt)}</b>${over?'<div style="font-size:10px;color:#dc2626">over the contract line</div>':neg?'<div style="font-size:10px;color:#dc2626">less than already billed</div>':amt?`<div style="font-size:10px;color:var(--text-3)">${r.amount?Math.round(after/r.amount*100):0}% after</div>`:''}</td></tr>`; }).join('')}
