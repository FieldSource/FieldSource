const PM_DAY_HOURS = 8; // an hours-based task takes ceil(hours / 8) work days on the calendar
// Each task's length is either in days or in hours. Hours-based tasks still get calendar days for scheduling.
function pmLenUnit(it){ return it.length_unit==='hours' ? 'hours' : 'days'; }
function pmLenValue(it){ return pmLenUnit(it)==='hours' ? (it.est_hours ?? null) : (it.duration_days ?? null); }
function pmDaysFor(unit, value){ const v = Number(value)||0; if(!v) return null; return unit==='hours' ? Math.max(1, Math.ceil(v / PM_DAY_HOURS)) : Math.max(1, Math.round(v)); }
function pmLenLabel(it){ const v = pmLenValue(it); if(!v) return ''; return pmLenUnit(it)==='hours' ? `${+Number(v).toFixed(1)}h` : `${v}d`; }

// Pick a color for a new project that no active project is using.
// First the 12 presets; after those, new distinct colors spaced around the color wheel
// (golden-angle steps) and checked against what's in use, so colors never repeat among active projects.
function pmHexToHue(hex){
  const h=(hex||'#000').replace('#',''); const r=parseInt(h.substr(0,2),16)/255,g=parseInt(h.substr(2,2),16)/255,b=parseInt(h.substr(4,2),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; if(!d) return 0;
  let hu = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; return (hu*60+360)%360;
}
function pmHslHex(h,s,l){
  s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))).toString(16).padStart(2,'0');
  return ('#'+f(0)+f(8)+f(4)).toUpperCase();
}
function pmNextColor(){
  const used = pm.projects.filter(p=>p.status!=='Complete').map(p=>(p.color||'').toUpperCase());
  const free = PM_COLORS.find(c=>!used.includes(c.toUpperCase()));
  if(free) return free;
  const usedHues = used.map(pmHexToHue);
  let best = null, bestGap = -1;
  for(let i=0;i<48;i++){
    const hue = (i*137.508)%360, sat = [70,60,75][i%3];
    let light = [42,34,46][i%3]; if(hue>40 && hue<190) light -= 10; // yellows/greens/cyans are bright; darken so white text stays readable
    const gap = Math.min(...usedHues.map(u=>Math.min(Math.abs(u-hue), 360-Math.abs(u-hue))));
    const c = pmHslHex(hue, sat, light);
    if(used.includes(c)) continue;
    if(gap > bestGap){ bestGap = gap; best = c; }
  }
  return best || PM_COLORS[0];
}

const pmEsc = v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// ── dates & work days ──
const pmD = s=>new Date(s+'T12:00:00');
const pmYmd = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pmToday = ()=>pmYmd(new Date());
function pmClosureSet(){ return new Set(pm.closures.map(c=>c.date)); }
function pmIsWorkday(s, set){ const w = pmD(s).getDay(); return w!==0 && w!==6 && !(set||pmClosureSet()).has(s); }
function pmShift(s, days){ const d = pmD(s); d.setDate(d.getDate()+days); return pmYmd(d); }
function pmNextWorkday(s){ const set = pmClosureSet(); let d = pmShift(s,1); for(let i=0;i<60 && !pmIsWorkday(d,set);i++) d = pmShift(d,1); return d; }
function pmFirstWorkday(s){ const set = pmClosureSet(); let d = s; for(let i=0;i<60 && !pmIsWorkday(d,set);i++) d = pmShift(d,1); return d; }
// Last day of a job that starts on s and takes n work days (n=1 -> same day).
function pmAddWorkdays(s, n){ const set = pmClosureSet(); let d = pmFirstWorkday(s), left = Math.max(1, n||1) - 1; for(let i=0;left>0 && i<2000;i++){ d = pmShift(d,1); if(pmIsWorkday(d,set)) left--; } return d; }
function pmWorkdaysBetween(a, b){ if(!a||!b||b<a) return 0; const set = pmClosureSet(); let n=0, d=a; for(let i=0;d<=b && i<3000;i++){ if(pmIsWorkday(d,set)) n++; d = pmShift(d,1); } return n; }
function pmFmt(s, withYear){ if(!s) return ''; const d = pmD(s); const y = d.getFullYear() !== new Date().getFullYear(); return d.toLocaleDateString('en-US', { month:'short', day:'numeric', ...((withYear||y)?{year:'numeric'}:{}) }); }

// ── tree helpers ──
function pmKids(projectId, parentId){ return pm.items.filter(i=>i.project_id===projectId && (i.parent_id||null)===(parentId||null)).sort((a,b)=>(a.sort||0)-(b.sort||0)); }
function pmDesc(id){ const out=[]; const walk=pid=>pm.items.filter(i=>i.parent_id===pid).forEach(c=>{ out.push(c); walk(c.id); }); walk(id); return out; }
function pmProject(id){ return pm.projects.find(p=>p.id===id); }
function pmItem(id){ return pm.items.find(i=>i.id===id); }
// Date span of an item including everything under it.
function pmRange(it){
  const all = [it, ...pmDesc(it.id)];
  const starts = all.map(x=>x.start_date||x.due_date).filter(Boolean).sort();
  const ends = all.map(x=>x.due_date||x.start_date).filter(Boolean).sort();
  return { start: starts[0]||null, end: ends[ends.length-1]||null };
}
function pmRollup(items){
  const leaves = items.filter(i=>i.type!=='phase' && !pm.items.some(c=>c.parent_id===i.id));
  return {
    total: leaves.length, done: leaves.filter(i=>i.status==='done').length,
    hours: items.reduce((t,i)=>t+(Number(i.est_hours)||0),0),
    budget: items.reduce((t,i)=>t+(Number(i.budget)||0),0),
  };
}

// ── saving ──
const PM_ITEM_FIELDS = ['project_id','parent_id','type','title','description','owner','priority','status','start_date','due_date','duration_days','length_unit','est_hours','dep_type','dep_lag','dep_wait','started_at','party','party_name','meeting_notes','attendees','fee','billed','invoice_no','billed_on','budget','depends_on','auto_schedule','done_at','sort'];
function pmClean(it){ const o={}; PM_ITEM_FIELDS.forEach(k=>{ if(k in it) o[k] = (it[k]==='' && !['title','description','owner'].includes(k)) ? null : it[k]; }); return o; }
async function pmPatchItem(it){ await sbFetch('PATCH', `/rest/v1/pm_items?id=eq.${it.id}`, { ...pmClean(it), updated_at:new Date().toISOString() }); }

// Move items that depend on others so each starts the next work day after its predecessor
// finishes (or is due). Cascades down the chain. Returns the items that changed.
// When can an item start, given what it's waiting on?
//   dep_type 'finish': the work day after the other item finishes (actual finish if done, else its due date)
//   dep_type 'start' : the day the other item starts (actual start if started, else its planned start)
//   dep_lag: extra work days after that. dep_wait: leave unscheduled until the trigger actually happens.
function pmTrigger(it, pred){
  const type = it.dep_type==='start' ? 'start' : 'finish';
  const lag = Math.max(0, parseInt(it.dep_lag)||0);
  let anchor = null, happened = false;
  if(type==='finish'){
    if(pred.status==='done'){ anchor = pred.done_at || pmToday(); happened = true; }
    else anchor = pred.due_date || pmRange(pred).end;
  } else {
    const started = pred.started_at || (pred.status==='in_progress' || pred.status==='done' ? (pred.done_at || pmToday()) : null);
    if(started){ anchor = started; happened = true; }
    else anchor = pred.start_date || pred.due_date || pmRange(pred).start;
  }
  if(it.dep_wait && !happened) return { waiting:true, type, happened:false };
  if(!anchor) return { start:null, type, happened };
  let start = type==='finish' ? pmNextWorkday(anchor) : pmFirstWorkday(anchor);
  if(lag) start = pmNextWorkday(pmAddWorkdays(start, lag));
  return { start, type, happened };
}
function pmTriggerLabel(it, pred){
  const lag = parseInt(it.dep_lag)||0;
  return `${it.dep_type==='start'?'when':'after'} ${pred.title}${it.dep_type==='start'?' starts':''}${lag?` +${lag} day${lag===1?'':'s'}`:''}`;
}
function pmComputeSchedule(projectId){
  const changed = new Map();
  for(let pass=0; pass<30; pass++){
    let moved = false;
    pm.items.filter(i=>i.project_id===projectId && i.depends_on && i.auto_schedule!==false && i.status!=='done' && !(i.status==='in_progress' && i.started_at)).forEach(it=>{
      const pred = pmItem(it.depends_on); if(!pred) return;
      const trig = pmTrigger(it, pred);
      if(trig.waiting){
        // "Don't schedule until it happens": no dates until the trigger fires
        if(it.start_date || it.due_date){ it.start_date = null; it.due_date = null; changed.set(it.id, it); moved = true; }
        return;
      }
      if(!trig.start) return;
      const start = trig.start;
      let due;
      if(pmIsMilestone(it.type)) due = start;
      else if(it.duration_days) due = pmAddWorkdays(start, it.duration_days);
      else if(it.start_date && it.due_date) due = pmAddWorkdays(start, Math.max(1, pmWorkdaysBetween(it.start_date, it.due_date)));
      else due = it.due_date && it.due_date >= start ? it.due_date : start; // no length set: treat as a one-day item
      const newStart = pmIsMilestone(it.type) ? null : start;
      if((it.start_date||null)!==newStart || (it.due_date||null)!==due){ it.start_date = newStart; it.due_date = due; changed.set(it.id, it); moved = true; }
    });
    if(!moved) break;
  }
  return [...changed.values()];
}
async function pmReschedule(projectId){
  const changed = pmComputeSchedule(projectId);
  await Promise.all(changed.map(pmPatchItem));
  return changed.length;
}

async function pmToggleDone(id){
  const it = pmItem(id); if(!it) return;
  if(it.status==='done'){ it.status = it.started_at ? 'in_progress' : 'todo'; it.done_at=null; }
  else { it.status='done'; it.done_at=pmToday(); if(!it.started_at) it.started_at = pmToday(); }
  await pmSaveAndTrigger(it);
}
async function pmToggleStarted(id){
  const it = pmItem(id); if(!it || it.status==='done') return;
  if(it.status==='in_progress'){ it.status='todo'; it.started_at=null; }
  else { it.status='in_progress'; it.started_at=pmToday(); if(!it.start_date || it.start_date>pmToday()){ it.start_date = pmFirstWorkday(pmToday()); if(it.duration_days) it.due_date = pmAddWorkdays(it.start_date, it.duration_days); } }
  await pmSaveAndTrigger(it);
}
// Save an item, re-run the schedule, and say which waiting items it set off.
async function pmSaveAndTrigger(it){
  const before = new Map(pm.items.filter(i=>i.project_id===it.project_id).map(i=>[i.id, i.start_date||i.due_date||null]));
  try{
    await pmPatchItem(it);
    const n = await pmReschedule(it.project_id);
    pmRender();
    const kicked = pm.items.filter(i=>i.depends_on===it.id && !before.get(i.id) && (i.start_date||i.due_date));
    if(kicked.length) pmToast(`Triggered: ${kicked.map(k=>`${k.title} → ${pmFmt(k.start_date||k.due_date)}`).join(', ')}`);
    else if(n) pmToast(`${n} dependent item${n===1?'':'s'} rescheduled`);
  }catch(e){ alert('Could not save: '+e.message); }
}

async function pmMove(id, dir){
  const it = pmItem(id); if(!it) return;
  const sibs = pmKids(it.project_id, it.parent_id);
  sibs.forEach((s,i)=>{ if(s.sort!==i) s.sort=i; });
  const idx = sibs.findIndex(s=>s.id===id), j = idx+dir;
  if(j<0 || j>=sibs.length) return;
  const other = sibs[j]; const a = it.sort; it.sort = other.sort; other.sort = a;
  pmRender();
  try{ await Promise.all(sibs.map(pmPatchItem)); }catch(e){ alert('Could not reorder: '+e.message); }
}

async function pmDeleteItem(id){
  const it = pmItem(id); if(!it) return;
  const desc = pmDesc(id);
  if(!confirm(`Delete "${it.title}"${desc.length?` and the ${desc.length} item${desc.length===1?'':'s'} under it`:''}?`)) return;
  try{
    await sbFetch('DELETE', `/rest/v1/pm_items?id=eq.${id}`);
    const gone = new Set([id, ...desc.map(d=>d.id)]);
    pm.items = pm.items.filter(i=>!gone.has(i.id));
    pm.items.forEach(i=>{ if(gone.has(i.depends_on)) i.depends_on = null; });
    pmRender();
  }catch(e){ alert('Could not delete: '+e.message); }
}

// ── templates ──
// Turn a template tree into new item rows (with client-side ids so parents link in one insert).
function pmTemplateRows(tree, projectId, opts){
  const rows = [];
  const walk = (nodes, parentId, depth)=>nodes.forEach((n,i)=>{
    const id = crypto.randomUUID();
    rows.push({ id, project_id:projectId, parent_id:parentId, type: depth===0 ? 'phase' : (n.type==='phase'?'task':(n.type||'task')),
      title:n.title||'Untitled', description:n.description||'', owner:n.owner||'', priority:n.priority||'Medium', status:'todo',
      party: n.party==='client'||n.party==='sub' ? n.party : 'fs', party_name: n.party==='sub' ? (n.party_name||'') : '',
      start_date:null, due_date:null, length_unit: n.unit==='hours'?'hours':'days', duration_days: n.unit==='hours' ? pmDaysFor('hours', n.est_hours) : (n.duration||null), est_hours:n.est_hours??null, budget:n.budget??null,
      depends_on:null, auto_schedule:true, done_at:null, sort:(opts.sortBase||0)+i });
    if(n.children && n.children.length) walk(n.children, id, depth+1);
  });
  walk(tree, null, 0);
  // Optional rough schedule: lay leaf items end to end in order, each depending on the one before.
  if(opts.startDate){
    let cursor = pmFirstWorkday(opts.startDate), prev = null;
    const hasKids = new Set(rows.map(r=>r.parent_id).filter(Boolean));
    const order = []; const dfs = pid=>rows.filter(r=>r.parent_id===pid).forEach(r=>{ order.push(r); dfs(r.id); }); dfs(null);
    order.filter(r=>r.type!=='phase' && !hasKids.has(r.id)).forEach(r=>{
      if(pmIsMilestone(r.type)){ r.due_date = cursor; }
      else { r.start_date = cursor; r.due_date = pmAddWorkdays(cursor, r.duration_days||1); cursor = pmNextWorkday(r.due_date); }
      if(prev) r.depends_on = prev.id;
      prev = r;
    });
  }
  return rows;
}
function pmTreeFromProject(projectId){
  const build = pid=>pmKids(projectId, pid).map(it=>{
    const n = { title:it.title, type:it.type };
    if(it.type!=='phase' && it.owner) n.owner = it.owner;
    if(pmIsExternal(it)){ n.party = pmParty(it); if(it.party==='sub' && it.party_name) n.party_name = it.party_name; }
    if(it.description) n.description = it.description;
    if(pmLenUnit(it)==='hours'){ n.unit = 'hours'; }
    else if(it.duration_days) n.duration = it.duration_days;
    else if(it.start_date && it.due_date) n.duration = pmWorkdaysBetween(it.start_date, it.due_date);
    if(it.est_hours!=null) n.est_hours = Number(it.est_hours);
    const kids = build(it.id); if(kids.length) n.children = kids;
    return n;
  });
  return build(null);
}

async function pmDoSaveAsTemplate(projectId){

// Every decision made on a project (fence height, foul pole color, ...), kept for bid documents.
// Changing a decision adds a new entry and marks the old one Superseded, so the history stays.
const PM_DEC_CATEGORIES = ['Site & grading','Turf & surfaces','Irrigation & drainage','Fencing & netting','Lighting & electrical','Structures & amenities','Equipment & furnishings','Scope & phasing','Other'];
const PM_DEC_SOURCES = ['Meeting','Email','Phone call','Site visit','Text','Other'];
function pmDecs(projectId){ return pm.decisions.filter(d=>d.project_id===projectId); }
function pmDecCats(projectId){ return [...new Set([...PM_DEC_CATEGORIES, ...pm.decisions.map(d=>d.category).filter(Boolean)])]; }

function pmOpenDecisions(projectId){
  const p = pmProject(projectId); if(!p) return;
  pm._dec = pm._dec && pm._dec.projectId===projectId ? pm._dec : { projectId, q:'', history:false, cat:'' };
  const st = pm._dec;
  const all = pmDecs(projectId);
  const q = st.q.toLowerCase();
  const shown = all.filter(d=>(st.history || d.status!=='Superseded') && (!st.cat || d.category===st.cat)
    && (!q || [d.topic,d.decision,d.category,d.decided_by,d.notes].join(' ').toLowerCase().includes(q)));
  const cats = [...new Set(shown.map(d=>d.category||'Other'))].sort((a,b)=>{ const ia=PM_DEC_CATEGORIES.indexOf(a), ib=PM_DEC_CATEGORIES.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
  const live = all.filter(d=>d.status!=='Superseded');
  const badge = d=>d.status==='Tentative' ? '<span class="pm-chip" style="background:#fef3c7;color:#92400e">Tentative</span>'
    : d.status==='Superseded' ? '<span class="pm-chip" style="background:#f1f5f9;color:#64748b">Superseded</span>' : '<span class="pm-chip" style="background:#dcfce7;color:#166534">Final</span>';
  const link = d=>{ const it = d.item_id && pmItem(d.item_id); return it ? ` · re: ${pmEsc(it.title)}` : ''; };
  pmModal(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><div class="sheet-title" style="margin-bottom:2px">📋 Decision log</div><div style="font-size:12px;color:var(--text-3)">${pmEsc(p.name)} · ${live.length} decision${live.length===1?'':'s'}${live.filter(d=>d.status==='Tentative').length?` (${live.filter(d=>d.status==='Tentative').length} tentative)`:''}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <button class="pm-btn primary" onclick="pmEditDecision(null,'${projectId}')">+ Log a decision</button>
        <button class="pm-btn" onclick="pmBidNotes('${projectId}')" title="Printable list for bid documents">🖨 Bid notes</button>
        <button class="pm-btn" onclick="pmDecCsv('${projectId}')" title="Spreadsheet file">⬇ CSV</button>
        <button class="pm-btn" onclick="document.getElementById('pm-overlay').remove()">✕</button>
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px;align-items:center">
      <input class="pm-in" style="flex:1;min-width:180px" placeholder="Search decisions…" value="${pmEsc(st.q)}" oninput="pm._dec.q=this.value;clearTimeout(pm._decT);pm._decT=setTimeout(()=>{pmOpenDecisions('${projectId}');const i=document.querySelector('#pm-overlay input[placeholder^=Search]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250)">
      <select class="pm-in" style="width:auto" onchange="pm._dec.cat=this.value;pmOpenDecisions('${projectId}')"><option value="">All categories</option>${pmDecCats(projectId).filter(c=>all.some(d=>d.category===c)).map(c=>`<option${st.cat===c?' selected':''}>${pmEsc(c)}</option>`).join('')}</select>
      <label style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox" ${st.history?'checked':''} onchange="pm._dec.history=this.checked;pmOpenDecisions('${projectId}')"> Show changed / superseded</label>
    </div>
    <div style="max-height:60vh;overflow-y:auto">
    ${cats.map(c=>`<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-2);margin:12px 0 6px">${pmEsc(c)}</div>
      ${shown.filter(d=>(d.category||'Other')===c).sort((a,b)=>(a.topic||'').localeCompare(b.topic||'') || (b.decided_on||'').localeCompare(a.decided_on||'')).map(d=>`
        <div style="border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:6px;${d.status==='Superseded'?'opacity:.6':''}">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
            <div style="min-width:0"><div style="font-size:13px;font-weight:700">${pmEsc(d.topic)}</div>
              <div style="font-size:14px;margin-top:2px;white-space:pre-wrap;${d.status==='Superseded'?'text-decoration:line-through':''}">${pmEsc(d.decision)}</div></div>
            <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">${badge(d)}
              <button class="pm-ic" title="Edit" onclick="pmEditDecision('${d.id}','${projectId}')">✎</button>
              ${d.status!=='Superseded'?`<button class="pm-btn" style="font-size:11px;padding:3px 8px" onclick="pmEditDecision(null,'${projectId}','${d.id}')">Change decision</button>`:''}</div>
          </div>
          <div style="font-size:11px;color:var(--text-3);margin-top:4px">${d.decided_on?pmFmt(d.decided_on,true):'No date'}${d.decided_by?' · decided by '+pmEsc(d.decided_by):''}${d.source?' · '+pmEsc(d.source):''}${link(d)}${d.superseded_by&&pm.decisions.find(x=>x.id===d.superseded_by)?' · replaced '+pmFmt(pm.decisions.find(x=>x.id===d.superseded_by).decided_on||'',true):''}</div>
          ${d.notes?`<div style="font-size:12px;color:var(--text-2);margin-top:4px;white-space:pre-wrap">${pmEsc(d.notes)}</div>`:''}
        </div>`).join('')}`).join('') || `<div style="padding:16px;font-size:13px;color:var(--text-3)">${all.length?'Nothing matches.':'No decisions logged yet. Log them as they\'re made (fence heights, colors, materials, scope calls) so they\'re all here at bid time.'}</div>`}
    </div>`, 820);
}

function pmEditDecision(id, projectId, replacesId){
  const old = replacesId ? pm.decisions.find(x=>x.id===replacesId) : null;
  const d = id ? pm.decisions.find(x=>x.id===id) : { topic: old?old.topic:'', decision:'', category: old?old.category:'', decided_on: pmToday(), decided_by: old?old.decided_by:'', source:'Meeting', status:'Final', item_id: old?old.item_id:'', notes:'' };
  const items = pm.items.filter(i=>i.project_id===projectId).sort((a,b)=>(a.sort||0)-(b.sort||0));
  const p = pmProject(projectId);
  const people = [...new Set([...PM_OWNERS.map(o=>o.name), p&&p.client?p.client:null, ...pm.decisions.map(x=>x.decided_by)].filter(Boolean))];
  pmModal(`
    <div class="sheet-title">${id?'Edit decision':old?'Change decision':'Log a decision'}</div>
    ${old?`<div style="font-size:12px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0">Replacing: <b>${pmEsc(old.decision)}</b> (${pmFmt(old.decided_on||'',true)}). The old one stays in the log, marked Superseded.</div>`:''}
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:8px">
      <div><div class="pm-lbl">Topic</div><input id="pmd-topic" class="pm-in" value="${pmEsc(d.topic)}" placeholder="e.g. Backstop fence height"></div>
      <div><div class="pm-lbl">Category</div><input id="pmd-cat" class="pm-in" list="pmd-cats" value="${pmEsc(d.category||'')}" placeholder="Pick or type"><datalist id="pmd-cats">${pmDecCats(projectId).map(c=>`<option value="${pmEsc(c)}">`).join('')}</datalist></div>
    </div>
    <div style="margin-top:10px"><div class="pm-lbl">Decision</div><textarea id="pmd-dec" class="pm-in" rows="3" placeholder="e.g. 25 ft backstop, black vinyl-coated chain link, 8 ft fence along both foul lines">${pmEsc(d.decision)}</textarea></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px">
      <div><div class="pm-lbl">Date decided</div><input id="pmd-date" type="date" class="pm-in" value="${pmEsc(d.decided_on||'')}"></div>
      <div><div class="pm-lbl">Decided by</div><input id="pmd-by" class="pm-in" list="pmd-people" value="${pmEsc(d.decided_by||'')}" placeholder="Name or group"><datalist id="pmd-people">${people.map(n=>`<option value="${pmEsc(n)}">`).join('')}</datalist></div>
      <div><div class="pm-lbl">How</div><select id="pmd-src" class="pm-in">${PM_DEC_SOURCES.map(s=>`<option${(d.source||'')===s?' selected':''}>${s}</option>`).join('')}</select></div>
      <div><div class="pm-lbl">Status</div><select id="pmd-status" class="pm-in">${['Final','Tentative'].concat(id&&d.status==='Superseded'?['Superseded']:[]).map(s=>`<option${d.status===s?' selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div style="margin-top:10px"><div class="pm-lbl">Came up in (optional)</div><select id="pmd-item" class="pm-in"><option value="">Whole project</option>${items.map(i=>`<option value="${i.id}"${d.item_id===i.id?' selected':''}>${i.type==='phase'?'▤ ':'  '}${pmEsc(i.title)}</option>`).join('')}</select></div>
    <div style="margin-top:10px"><div class="pm-lbl">Notes (optional)</div><textarea id="pmd-notes" class="pm-in" rows="2" placeholder="Why, alternatives considered, cost impact, who to confirm with…">${pmEsc(d.notes||'')}</textarea></div>
    <div id="pmd-err" style="color:#b91c1c;font-size:12px;margin-top:8px"></div>
    <div style="display:flex;justify-content:space-between;margin-top:14px">
      <div>${id?`<button class="pm-btn" style="color:#b91c1c" onclick="pmDeleteDecision('${id}','${projectId}')">Delete</button>`:''}</div>
      <div style="display:flex;gap:8px"><button class="pm-btn" onclick="pmOpenDecisions('${projectId}')">Back</button>
      <button class="pm-btn primary" onclick="pmSaveDecision(${id?`'${id}'`:'null'},'${projectId}',${replacesId?`'${replacesId}'`:'null'})">Save</button></div>
    </div>`, 720);
  setTimeout(()=>document.getElementById(old?'pmd-dec':'pmd-topic')?.focus(), 0);
}
async function pmSaveDecision(id, projectId, replacesId){
  const g = k=>document.getElementById(k).value;
  const row = { project_id:projectId, topic:g('pmd-topic').trim(), decision:g('pmd-dec').trim(), category:g('pmd-cat').trim()||'Other',
    decided_on:g('pmd-date')||null, decided_by:g('pmd-by').trim(), source:g('pmd-src'), status:g('pmd-status'), item_id:g('pmd-item')||null, notes:g('pmd-notes').trim(),
    updated_at:new Date().toISOString() };
  if(!row.topic || !row.decision){ document.getElementById('pmd-err').textContent = 'Fill in the topic and the decision.'; return; }
  try{
    if(id){ await sbFetch('PATCH', `/rest/v1/pm_decisions?id=eq.${id}`, row); Object.assign(pm.decisions.find(x=>x.id===id), row); }
    else {
      const r = await sbFetch('POST','/rest/v1/pm_decisions', { ...row, created_by:(currentUser&&currentUser.email)||'' });
      const nd = r[0]; pm.decisions.push(nd);
      if(replacesId){ const old = pm.decisions.find(x=>x.id===replacesId); await sbFetch('PATCH', `/rest/v1/pm_decisions?id=eq.${replacesId}`, { status:'Superseded', superseded_by: nd.id }); old.status='Superseded'; old.superseded_by=nd.id; }
    }
    pmOpenDecisions(projectId); pmRender();
  }catch(e){ document.getElementById('pmd-err').textContent = 'Could not save: '+e.message; }
}
async function pmDeleteDecision(id, projectId){
  if(!confirm('Delete this decision? To record a change instead, use "Change decision" so the history is kept.')) return;
  try{ await sbFetch('DELETE', `/rest/v1/pm_decisions?id=eq.${id}`); pm.decisions = pm.decisions.filter(x=>x.id!==id); pmOpenDecisions(projectId); pmRender(); }
  catch(e){ alert(e.message); }
}
function pmDecForBid(projectId){
  return pmDecs(projectId).filter(d=>d.status!=='Superseded')
    .sort((a,b)=>{ const ia=PM_DEC_CATEGORIES.indexOf(a.category), ib=PM_DEC_CATEGORIES.indexOf(b.category); return (ia<0?99:ia)-(ib<0?99:ib) || (a.category||'').localeCompare(b.category||'') || (a.topic||'').localeCompare(b.topic||''); });
}
// Printable bid notes: opens a clean page; use the browser's Print → Save as PDF.

  const e = s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const cats = [...new Set(list.map(d=>d.category||'Other'))];
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Bid notes – ${e(p.name)}</title>
  <style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111;max-width:820px;margin:32px auto;padding:0 20px;line-height:1.4}
  h1{font-size:22px;margin:0}.sub{color:#555;font-size:13px;margin:4px 0 20px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#333;border-bottom:2px solid ${p.color||'#2563eb'};padding-bottom:4px;margin:22px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:13px}td{padding:6px 6px;border-bottom:1px solid #e5e7eb;vertical-align:top}td.t{width:28%;font-weight:600}td.m{width:24%;color:#555;font-size:11px}
  .tent{display:inline-block;font-size:10px;background:#fef3c7;color:#92400e;border-radius:99px;padding:1px 6px;margin-left:4px}.n{color:#555;font-size:12px;margin-top:2px}
  .bar{display:flex;gap:8px;margin-bottom:16px}.bar button{font:inherit;padding:6px 12px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
  @media print{.bar{display:none}body{margin:0}}</style></head><body>
  <div class="bar"><button onclick="window.print()">Print / Save as PDF</button></div>
  <h1>Bid notes: ${e(p.name)}</h1>
  <div class="sub">${p.client?e(p.client)+' · ':''}Decision log as of ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})} · ${list.length} decisions${list.some(d=>d.status==='Tentative')?' · items marked Tentative still need confirmation':''}</div>
  ${cats.map(c=>`<h2>${e(c)}</h2><table>${list.filter(d=>(d.category||'Other')===c).map(d=>`<tr><td class="t">${e(d.topic)}${d.status==='Tentative'?'<span class="tent">Tentative</span>':''}</td>
    <td>${e(d.decision).replace(/\n/g,'<br>')}${d.notes?`<div class="n">${e(d.notes).replace(/\n/g,'<br>')}</div>`:''}</td>
    <td class="m">${d.decided_on?new Date(d.decided_on+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):''}${d.decided_by?'<br>'+e(d.decided_by):''}${d.source?'<br>'+e(d.source):''}</td></tr>`).join('')}</table>`).join('')}
  ${(()=>{ const subs = pm.submittals.filter(x=>x.project_id===projectId).sort((a,b)=>(a.sent_on||'').localeCompare(b.sent_on||''));
    return subs.length ? `<h2>Documents issued</h2><table>${subs.map(x=>`<tr><td class="t">${e(x.title)}${x.revision?' · '+e(x.revision):''}</td><td>${x.sent_to?'To '+e(x.sent_to):''}${x.method?' ('+e(x.method)+')':''}${x.notes?`<div class="n">${e(x.notes)}</div>`:''}</td><td class="m">${x.sent_on?new Date(x.sent_on+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):''}</td></tr>`).join('')}</table>` : ''; })()}
  </body></html>`;
  const win = window.open('', '_blank');
  if(!win){ alert('Your browser blocked the new tab. Allow pop-ups for the tracker and try again.'); return; }
  win.document.write(html); win.document.close();
}
function pmDecCsv(projectId){
  const p = pmProject(projectId), list = pmDecs(projectId);
  if(!list.length){ alert('No decisions logged yet.'); return; }
  const q = v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows = [['Category','Topic','Decision','Status','Date decided','Decided by','How','Came up in','Notes']]
    .concat(list.sort((a,b)=>(a.category||'').localeCompare(b.category||'')||(a.topic||'').localeCompare(b.topic||'')).map(d=>[d.category,d.topic,d.decision,d.status,d.decided_on,d.decided_by,d.source,(d.item_id&&pmItem(d.item_id)||{}).title||'',d.notes]));
  const blob = new Blob(['\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n')], { type:'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `${p.name.replace(/[\\/:*?"<>|]/g,'')} - decision log.csv`; a.click();
}

// ===== Shared project math =====
function pmLeavesUnder(projectId, rootId){ const all = rootId ? pmDesc(rootId) : pm.items.filter(i=>i.project_id===projectId); return all.filter(i=>i.type!=='phase' && !pm.items.some(c=>c.parent_id===i.id)); }
function pmPhaseOf(it){ let c = it; while(c && c.parent_id) c = pmItem(c.parent_id); return c; }
function pmPhaseStatus(ph){ const l = pmLeavesUnder(ph.project_id, ph.id); if(!l.length) return { pct:0, state:'empty', done:0, total:0 }; const d = l.filter(x=>x.status==='done').length;
  return { pct: Math.round(d/l.length*100), state: d===l.length ? 'complete' : (d || l.some(x=>x.status==='in_progress')) ? 'active' : 'not started', done:d, total:l.length }; }
function pmCurrentPhase(projectId){ return pmKids(projectId, null).find(ph=>pmPhaseStatus(ph).state!=='complete' && pmPhaseStatus(ph).state!=='empty') || null; }
function pmHoursLogged(f){ return pm.time.filter(f).reduce((t,x)=>t+(Number(x.hours)||0),0); }
function pmHoursEst(projectId, rootId){ return pmLeavesUnder(projectId, rootId).reduce((t,i)=>t+(Number(i.est_hours)||0),0); }
const pmMoney = n=>'$'+Math.round(Number(n)||0).toLocaleString('en-US');
const pmH = n=>{ const v = Math.round((Number(n)||0)*10)/10; return v+'h'; };
function pmIsFsName(n){ return PM_OWNERS.some(o=>o.name===n); }

// ===== 1. Open questions =====
function pmQs(projectId){ return pm.questions.filter(q=>q.project_id===projectId); }
function pmOpenQuestions(projectId){
  const p = pmProject(projectId); if(!p) return;
  pm._qShowAll = pm._qShowAll || false;
  const list = pmQs(projectId).filter(q=>pm._qShowAll || q.status==='Open').sort((a,b)=>(a.status!=='Open')-(b.status!=='Open') || (a.due_date||'9').localeCompare(b.due_date||'9'));
  const openN = pmQs(projectId).filter(q=>q.status==='Open').length;
  pmModal(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><div class="sheet-title" style="margin-bottom:2px">❓ Open questions</div><div style="font-size:12px;color:var(--text-3)">${pmEsc(p.name)} · ${openN} open · things we're waiting to decide or hear back on</div></div>
      <div style="display:flex;gap:6px"><button class="pm-btn primary" onclick="pmEditQuestion(null,'${projectId}')">+ Add a question</button><button class="pm-btn" onclick="document.getElementById('pm-overlay').remove()">✕</button></div>
    </div>
    <label style="font-size:12px;display:flex;gap:4px;align-items:center;margin:10px 0"><input type="checkbox" ${pm._qShowAll?'checked':''} onchange="pm._qShowAll=this.checked;pmOpenQuestions('${projectId}')"> Show answered and dropped</label>
    <div style="max-height:60vh;overflow-y:auto">${list.map(q=>{
      const late = q.status==='Open' && q.due_date && q.due_date < pmToday(), it = q.item_id && pmItem(q.item_id);
      return `<div style="border:1px solid ${late?'#fca5a5':'var(--border)'};border-radius:8px;padding:9px 11px;margin-bottom:6px;${q.status!=='Open'?'opacity:.65':''}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div style="font-size:14px;font-weight:600;white-space:pre-wrap">${pmEsc(q.question)}</div>
          <div style="display:flex;gap:4px;flex-shrink:0;align-items:center">
            ${q.status==='Open'?`<button class="pm-btn primary" style="font-size:11px;padding:3px 8px" onclick="pmAnswerQuestion('${q.id}')">Answer</button>`:`<span class="pm-chip" style="background:${q.status==='Answered'?'#dcfce7;color:#166534':'#f1f5f9;color:#64748b'}">${q.status}</span>`}
            <button class="pm-ic" title="Edit" onclick="pmEditQuestion('${q.id}','${projectId}')">✎</button></div>
        </div>
        <div style="font-size:11px;color:${late?'#dc2626':'var(--text-3)'};margin-top:3px">${q.asked_of?'Waiting on <b>'+pmEsc(q.asked_of)+'</b>':'Who answers: not set'}${q.owner?' · '+pmEsc(q.owner)+' chasing':''}${q.due_date?` · ${late?'overdue, ':''}need by ${pmFmt(q.due_date)}`:''}${q.asked_on?' · asked '+pmFmt(q.asked_on):''}${it?' · re: '+pmEsc(it.title):''}</div>
        ${q.status==='Answered'?`<div style="font-size:13px;margin-top:5px;padding:6px 8px;background:var(--bg);border-radius:6px"><b>Answer${q.answered_on?' ('+pmFmt(q.answered_on)+')':''}:</b> ${pmEsc(q.answer)}${q.decision_id?' <span class="pm-chip">📋 in decision log</span>':''}</div>`:''}
      </div>`; }).join('') || `<div style="padding:14px;font-size:13px;color:var(--text-3)">${pmQs(projectId).length?'No open questions.':'Nothing yet. Add questions as they come up ("Does the AD want the cages inside the fence?") with who owes the answer and by when.'}</div>`}</div>`, 760);
}
function pmEditQuestion(id, projectId, prefill){
  const q = id ? pm.questions.find(x=>x.id===id) : { question:'', asked_of:'', owner: pmMe()||'', asked_on: pmToday(), due_date:'', item_id:'', status:'Open', ...(prefill||{}) };
  const p = pmProject(projectId);
  const items = pm.items.filter(i=>i.project_id===projectId).sort((a,b)=>(a.sort||0)-(b.sort||0));
  const askOpts = [...new Set([p&&p.client, ...PM_OWNERS.map(o=>o.name), ...pm.questions.map(x=>x.asked_of)].filter(Boolean))];

// ===== 4. Workload: hours and deadlines per person per week =====
const PM_WEEK_CAPACITY = 40;
function pmWorkloadData(weeks){
  const projs = new Map(pm.projects.filter(p=>p.status!=='Complete').map(p=>[p.id,p]));
  const set = pmClosureSet();
  const data = {}; PM_OWNERS.forEach(o=>{ data[o.name] = { weeks: weeks.map(()=>({ hrs:0, items:[], due:[] })), nodate:{ hrs:0, items:[] } }; });
  const wkIdx = d=>{ for(let i=weeks.length-1;i>=0;i--) if(d>=weeks[i]) return d<=pmShift(weeks[i],6) ? i : -1; return -1; };
  pm.items.forEach(it=>{
    if(!projs.has(it.project_id) || it.type==='phase' || it.status==='done' || !data[it.owner]) return;
    if(pm.items.some(c=>c.parent_id===it.id)) return;
    const row = data[it.owner], hrs = Number(it.est_hours)||0;
    if(pmIsMilestone(it.type) || (it.type==='deliverable' && !it.start_date)){
      const d = it.due_date || it.start_date; if(!d) return;
      const w = wkIdx(d); if(w>=0) row.weeks[w].due.push(it);
      return;
    }
    const s = it.start_date || it.due_date, e = it.due_date || it.start_date;
    if(!s){ row.nodate.hrs += hrs; row.nodate.items.push(it); return; }
    const days = []; for(let d=s, n=0; d<=e && n<400; d=pmShift(d,1), n++) if(pmIsWorkday(d,set)) days.push(d);
    if(!days.length) days.push(s);
    const per = hrs / days.length, touched = new Set();
    days.forEach(d=>{ const w = wkIdx(d); if(w<0) return; row.weeks[w].hrs += per; touched.add(w); });
    touched.forEach(w=>row.weeks[w].items.push(it));
    if(it.type==='deliverable'){ const w = wkIdx(e); if(w>=0) row.weeks[w].due.push(it); }
  });
  return data;
}
function pmWorkloadHtml(){
  const n = pm.wlWeeks || 8;
  let mon = pmToday(); while(pmD(mon).getDay()!==1) mon = pmShift(mon,-1);
  const weeks = Array.from({length:n}, (_,i)=>pmShift(mon, i*7));
  const data = pmWorkloadData(weeks);
  const set = pmClosureSet();
  const cap = w=>{ let wd=0; for(let i=0;i<5;i++) if(pmIsWorkday(pmShift(w,i),set)) wd++; return PM_WEEK_CAPACITY*wd/5; };
  const cell = (name, wi)=>{
    const c = data[name].weeks[wi], h = Math.round(c.hrs*10)/10, capW = cap(weeks[wi]);
    const bg = !h && !c.due.length ? 'transparent' : h>capW ? '#fee2e2' : h>capW*.8 ? '#fef3c7' : '#dcfce7';
    return `<td onclick="pmWorkloadCell('${name}',${wi})" style="cursor:pointer;text-align:center;padding:8px 4px;border:1px solid var(--border);background:${bg}">

      ${c.items.length?`<div style="font-size:10px;color:var(--text-3)">${c.items.length} task${c.items.length===1?'':'s'}</div>`:''}
      ${c.due.length?`<div style="font-size:11px;color:#b91c1c;font-weight:600">◆ ${c.due.length} due</div>`:''}
    </td>`;
  };
  pm._wl = { weeks, data };
  return `<div class="pm-card" style="max-width:1120px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <div style="font-size:16px;font-weight:700">Workload</div>
      <select class="pm-in" style="width:auto" onchange="pm.wlWeeks=+this.value;pmRender()">${[4,8,12,16].map(k=>`<option value="${k}"${n===k?' selected':''}>Next ${k} weeks</option>`).join('')}</select>
      <span style="font-size:11px;color:var(--text-3);margin-left:auto">Estimated hours of open tasks, spread over their work days · ◆ = milestones/deliverables due · green under 80% of ${PM_WEEK_CAPACITY}h, amber 80–100%, red over · click a cell for details</span>
    </div>
    <div style="overflow-x:auto"><table class="pm-tbl" style="border-collapse:collapse;width:100%;min-width:${120+n*70}px">
      <thead><tr><th style="text-align:left;font-size:11px;color:var(--text-3);padding:6px">Person</th>
        ${weeks.map(w=>`<th style="font-size:11px;color:var(--text-2);padding:6px;font-weight:600">Week of<br>${pmFmt(w)}</th>`).join('')}
        <th style="font-size:11px;color:var(--text-3);padding:6px">No dates</th></tr></thead>
      <tbody>${PM_OWNERS.map(o=>`<tr><td style="padding:8px;font-weight:600;font-size:13px;border:1px solid var(--border)">${o.name}</td>${weeks.map((_,wi)=>cell(o.name,wi)).join('')}
        <td onclick="pmWorkloadCell('${o.name}',-1)" style="cursor:pointer;text-align:center;border:1px solid var(--border);font-size:12px;color:var(--text-3)">${data[o.name].nodate.items.length?`${data[o.name].nodate.items.length} task${data[o.name].nodate.items.length===1?'':'s'}${data[o.name].nodate.hrs?'<br>'+pmH(data[o.name].nodate.hrs):''}`:'—'}</td></tr>`).join('')}</tbody>
    </table></div>
    <div style="font-size:11px;color:var(--text-3);margin-top:8px">Hours come from each task's estimate (Length in hours, or "Hours of work" on day-based tasks). Tasks without an hours estimate count as tasks but add no hours. Unassigned tasks and client/sub work assigned to someone for follow-up are included under that person.</div>
  </div>`;
}
function pmWorkloadCell(name, wi){
  const d = pm._wl.data[name], c = wi<0 ? { hrs:d.nodate.hrs, items:d.nodate.items, due:[] } : d.weeks[wi];
  const title = wi<0 ? `${name}: tasks with no dates` : `${name}: week of ${pmFmt(pm._wl.weeks[wi],true)}`;
  const row = it=>{ const p = pmProject(it.project_id); return `<div class="pm-row" style="cursor:pointer" onclick="pmEditItem('${it.id}')"><span class="pm-dot" style="margin:0;background:${pmEsc(p.color)}"></span>
    <span style="flex:1">${PM_TYPES[it.type].icon==='•'?'':PM_TYPES[it.type].icon+' '}${pmEsc(it.title)}<div style="font-size:11px;color:var(--text-3)">${pmEsc(p.name)}</div></span>
    ${it.est_hours?`<span class="pm-chip">${pmH(it.est_hours)}</span>`:''}<span style="font-size:12px;color:var(--text-2)">${it.start_date&&it.due_date&&it.start_date!==it.due_date?pmFmt(it.start_date)+' – ':''}${pmFmt(it.due_date||it.start_date)||''}</span></div>`; };
  pmModal(`<div class="sheet-title">${pmEsc(title)}</div><div style="font-size:12px;color:var(--text-3);margin-bottom:8px">${pmH(c.hrs)} estimated${wi>=0?` · ${c.due.length} due`:''}</div>
    ${c.due.length?`<div class="pm-lbl">Due this week</div>${c.due.map(row).join('')}`:''}
    ${c.items.length?`<div class="pm-lbl" style="margin-top:8px">Working on</div>${c.items.map(row).join('')}`:''}
    ${!c.due.length&&!c.items.length?'<div style="font-size:13px;color:var(--text-3)">Nothing scheduled.</div>':''}
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="pm-btn" onclick="document.getElementById('pm-overlay').remove()">Close</button></div>`, 620);
}

// ===== 5. Client update =====
function pmClientUpdate(projectId){
  const p = pmProject(projectId); if(!p) return;
  const since = pm._cuSince && pm._cuSince.p===projectId ? pm._cuSince.d : (p.last_update_at ? p.last_update_at.slice(0,10) : pmShift(pmToday(),-14));
  pm._cuSince = { p:projectId, d:since };
  const ahead = pmShift(pmToday(), 30);
  const its = pm.items.filter(i=>i.project_id===projectId && i.type!=='phase');
  const leaf = i=>!pm.items.some(c=>c.parent_id===i.id);
  const done = its.filter(i=>i.status==='done' && leaf(i) && (i.done_at||'') >= since);
  const coming = its.filter(i=>i.status!=='done' && i.party!=='client' && leaf(i) && (i.due_date||i.start_date) && (i.due_date||i.start_date) >= pmToday() && (i.due_date||i.start_date) <= ahead)
    .sort((a,b)=>(a.due_date||a.start_date).localeCompare(b.due_date||b.start_date));
  const decs = pm.decisions.filter(d=>d.project_id===projectId && d.status!=='Superseded' && (d.decided_on||'') >= since);
  const onClient = its.filter(i=>i.party==='client' && i.status!=='done');
  const qs = pm.questions.filter(q=>q.project_id===projectId && q.status==='Open' && q.asked_of && !pmIsFsName(q.asked_of));
  const cur = pmCurrentPhase(projectId);
  const b = arr=>arr.map(x=>'  - '+x).join('\n');
  const text = [
    `Here's where things stand on ${p.name}${cur?`. We're currently in ${cur.title} (${pmPhaseStatus(cur).pct}% complete)`:''}.`,
    done.length ? `\nCompleted since ${pmFmt(since)}:\n${b(done.map(i=>i.title))}` : '',
    coming.length ? `\nComing up:\n${b(coming.slice(0,10).map(i=>`${pmFmt(i.due_date||i.start_date)}: ${i.title}${pmIsMilestone(i.type)?' (meeting/milestone)':''}`))}` : '',
    decs.length ? `\nDecisions made:\n${b(decs.map(d=>`${d.topic}: ${d.decision}`))}` : '',
    (onClient.length||qs.length) ? `\nWhat we need from you:\n${b([...onClient.map(i=>`${i.title}${i.due_date?' (by '+pmFmt(i.due_date)+')':''}`), ...qs.map(q=>`${q.question}${q.due_date?' (by '+pmFmt(q.due_date)+')':''}`)])}` : '',
    `\nLet me know if you have any questions.`,
  ].filter(Boolean).join('\n');
  const subject = `${p.name}: project update ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  pmModal(`<div class="sheet-title">✉ Client update</div>
    <div style="font-size:12px;color:var(--text-3);margin:2px 0 10px">${pmEsc(p.name)}${p.last_update_at?` · last update sent ${pmFmt(p.last_update_at.slice(0,10),true)}`:' · no update sent yet'}</div>
    <div style="display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:8px">Covering changes since <input type="date" class="pm-in" style="width:auto" value="${since}" onchange="pm._cuSince={p:'${projectId}',d:this.value};pmClientUpdate('${projectId}')"></div>
    <div class="pm-lbl">Subject</div><input id="pmcu-subj" class="pm-in" value="${pmEsc(subject)}">
    <div class="pm-lbl" style="margin-top:8px">Message (edit freely)</div><textarea id="pmcu-body" class="pm-in" rows="16" style="font-family:inherit">${pmEsc(text)}</textarea>
    <div style="font-size:11px;color:var(--text-3);margin-top:4px">Built from tasks completed, upcoming dates, decisions, and anything marked as the client's or asked of them.</div>
    <div style="display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="pm-btn" onclick="pmMarkUpdateSent('${projectId}')">Mark as sent</button>
      <div style="display:flex;gap:8px"><button class="pm-btn" onclick="navigator.clipboard.writeText(document.getElementById('pmcu-body').value).then(()=>pmToast('Copied'))">Copy text</button>
      <button class="pm-btn primary" onclick="window.open('mailto:?subject='+encodeURIComponent(document.getElementById('pmcu-subj').value)+'&body='+encodeURIComponent(document.getElementById('pmcu-body').value));pmMarkUpdateSent('${projectId}',true)">Open in email</button></div>
    </div>`, 720);
}
async function pmMarkUpdateSent(projectId, quiet){
  const p = pmProject(projectId), now = new Date().toISOString();
  try{ await sbFetch('PATCH', `/rest/v1/pm_projects?id=eq.${projectId}`, { last_update_at: now }); p.last_update_at = now; pm._cuSince = null; if(!quiet){ document.getElementById('pm-overlay')?.remove(); } pmRender(); pmToast('Marked as sent'); }
  catch(e){ alert(e.message); }
}

// ===== 6. Overview: every project's health =====
function pmHealth(p){
  const its = pm.items.filter(i=>i.project_id===p.id && i.type!=='phase');
  const leaves = its.filter(i=>!pm.items.some(c=>c.parent_id===i.id));
  const done = leaves.filter(i=>i.status==='done').length;
  const next = its.filter(i=>(pmIsMilestone(i.type)||i.type==='deliverable') && i.status!=='done' && i.due_date && i.due_date>=pmToday()).sort((a,b)=>a.due_date.localeCompare(b.due_date))[0];
  const est = leaves.reduce((t,i)=>t+(Number(i.est_hours)||0),0), act = pmHoursLogged(t=>t.project_id===p.id);
  const fees = pmKids(p.id,null).filter(ph=>Number(ph.fee)>0);
  return { p, pct: leaves.length ? Math.round(done/leaves.length*100) : 0, total: leaves.length, cur: pmCurrentPhase(p.id), next,
    overdue: leaves.filter(pmOverdue).length, client: its.filter(i=>i.party==='client'&&i.status!=='done').length, subs: its.filter(i=>i.party==='sub'&&i.status!=='done').length,
    qs: pm.questions.filter(q=>q.project_id===p.id && q.status==='Open').length, qsLate: pm.questions.filter(q=>q.project_id===p.id && q.status==='Open' && q.due_date && q.due_date<pmToday()).length,
    est, act, cost: act*(Number(p.hourly_rate)||0),
    toBill: fees.filter(ph=>!ph.billed && pmPhaseStatus(ph).state==='complete'), feeTotal: fees.reduce((t,ph)=>t+Number(ph.fee),0),
    lastUpdate: p.last_update_at ? Math.floor((Date.now()-new Date(p.last_update_at))/864e5) : null };
}
function pmOverviewHtml(){
  const hs = pm.projects.filter(p=>p.status!=='Complete').map(pmHealth)
    .sort((a,b)=>(b.overdue>0)-(a.overdue>0) || (a.next?a.next.due_date:'9').localeCompare(b.next?b.next.due_date:'9'));
  const all = { overdue: hs.reduce((t,h)=>t+h.overdue,0), client: hs.reduce((t,h)=>t+h.client,0), qs: hs.reduce((t,h)=>t+h.qs,0), toBill: hs.reduce((t,h)=>t+h.toBill.length,0), toBillAmt: hs.reduce((t,h)=>t+h.toBill.reduce((s,ph)=>s+Number(ph.fee),0),0) };
  const th = 'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);padding:8px 6px;text-align:left;border-bottom:1px solid var(--border-2)';
  const td = 'padding:9px 6px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top';
  const stat = (v,l,c)=>`<div class="pm-card" style="padding:10px 12px"><div style="font-size:22px;font-weight:700;color:${v?c:'var(--text-3)'}">${v}</div><div style="font-size:11px;color:var(--text-3)">${l}</div></div>`;
  return `<div style="max-width:1180px;margin:0 auto">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">
      ${stat(hs.length,'active projects','var(--text)')}${stat(all.overdue,'tasks past due','#dc2626')}${stat(all.client,'items waiting on clients','#9a3412')}${stat(all.qs,'open questions','#1d4ed8')}
      ${stat(all.toBill ? pmMoney(all.toBillAmt) : 0, all.toBill ? `ready to bill (${all.toBill} phase${all.toBill===1?'':'s'})` : 'ready to bill','#15803d')}
    </div>
    <div class="pm-card" style="padding:0;overflow-x:auto"><table class="pm-tbl" style="width:100%;border-collapse:collapse;min-width:760px">
      <thead><tr><th style="${th}">Project</th><th style="${th}">Phase</th><th style="${th}">Next deadline</th><th style="${th}">Attention</th><th style="${th}">Hours</th><th style="${th}">Billing</th><th style="${th}">Client update</th></tr></thead>
      <tbody>${hs.map(h=>`<tr style="cursor:pointer" onclick="pm.sel='${h.p.id}';pmShow('projects')">
        <td style="${td}"><div style="display:flex;gap:8px"><span class="pm-dot" style="background:${pmEsc(h.p.color)}"></span><div><b>${pmEsc(h.p.name)}</b><div style="font-size:11px;color:var(--text-3)">${pmEsc(h.p.client||'Field Source')}</div></div></div></td>
        <td style="${td}">${h.cur?pmEsc(h.cur.title):'—'}<div style="height:5px;background:var(--border);border-radius:3px;margin-top:4px;width:110px;overflow:hidden"><div style="height:100%;width:${h.pct}%;background:${pmEsc(h.p.color)}"></div></div><div style="font-size:11px;color:var(--text-3)">${h.pct}% of ${h.total} tasks</div></td>
        <td style="${td}">${h.next?`${PM_TYPES[h.next.type].icon} ${pmEsc(h.next.title)}<div style="font-size:11px;color:var(--text-3)">${pmFmt(h.next.due_date)} · ${Math.max(0,pmWorkdaysBetween(pmToday(),h.next.due_date)-1)} work days</div>`:'<span style="color:var(--text-3)">—</span>'}</td>
        <td style="${td};font-size:12px">${[h.overdue?`<div style="color:#dc2626">${h.overdue} past due</div>`:'', h.client?`<div style="color:#9a3412">👤 ${h.client} on client</div>`:'', h.subs?`<div style="color:#5b21b6">🔧 ${h.subs} with subs</div>`:'', h.qs?`<div style="color:${h.qsLate?'#dc2626':'#1d4ed8'}">❓ ${h.qs} open question${h.qs===1?'':'s'}${h.qsLate?` (${h.qsLate} late)`:''}</div>`:''].join('')||'<span style="color:#16a34a">On track</span>'}</td>
        <td style="${td};font-size:12px">${h.act||h.est?`${pmH(h.act)}${h.est?` / ${pmH(h.est)}`:''}${h.est&&h.act>h.est?'<div style="color:#dc2626">over estimate</div>':''}`:'—'}${h.p.budget&&h.cost?`<div style="color:${h.cost>h.p.budget?'#dc2626':'var(--text-3)'}">${Math.round(h.cost/h.p.budget*100)}% of budget</div>`:''}</td>
        <td style="${td};font-size:12px">${h.toBill.length?`<b style="color:#15803d">${pmMoney(h.toBill.reduce((s,ph)=>s+Number(ph.fee),0))} ready</b>`:h.feeTotal?`<span style="color:var(--text-3)">${pmMoney(h.feeTotal)} in fees</span>`:'—'}</td>
        <td style="${td};font-size:12px;color:${h.lastUpdate===null||h.lastUpdate>14?'#b45309':'var(--text-3)'}">${h.lastUpdate===null?'Never sent':h.lastUpdate===0?'Today':h.lastUpdate+' days ago'}</td>
      </tr>`).join('') || `<tr><td colspan="7" style="${td};color:var(--text-3)">No active projects.</td></tr>`}</tbody>
    </table></div>
    <div style="font-size:11px;color:var(--text-3);margin-top:6px">Click a project to open it. Sorted by anything past due, then the nearest deadline. Client updates older than 2 weeks show in orange.</div>

// ===== 7. Phase fees & billing =====
function pmOpenFees(projectId){
  const p = pmProject(projectId); if(!p) return;
  const phases = pmKids(projectId, null);
  const tot = phases.reduce((t,ph)=>t+(Number(ph.fee)||0),0), billed = phases.filter(ph=>ph.billed).reduce((t,ph)=>t+(Number(ph.fee)||0),0);
  const ready = phases.filter(ph=>!ph.billed && Number(ph.fee)>0 && pmPhaseStatus(ph).state==='complete');
  pmModal(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><div class="sheet-title" style="margin-bottom:2px">💲 Fees &amp; billing</div><div style="font-size:12px;color:var(--text-3)">${pmEsc(p.name)}</div></div>
      <button class="pm-btn" onclick="document.getElementById('pm-overlay').remove()">✕</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">
      <div><div class="pm-lbl">QuickBooks estimate #</div><input id="pmf-qb" class="pm-in" value="${pmEsc(p.qb_estimate||'')}" placeholder="e.g. 1844" onchange="pmSaveProjField('${projectId}','qb_estimate',this.value.trim())"></div>
      <div><div class="pm-lbl">Project budget</div><div style="font-size:14px;padding:7px 0">${p.budget?pmMoney(p.budget):'<span style="color:var(--text-3)">Not set (Edit project)</span>'}</div></div>
    </div>
    <table class="pm-tbl" style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr>${['Phase','Fee','Progress','Billing'].map(h=>`<th style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);text-align:left;padding:6px;border-bottom:1px solid var(--border-2)">${h}</th>`).join('')}</tr></thead>
      <tbody>${phases.map(ph=>{ const st = pmPhaseStatus(ph); return `<tr>
        <td style="padding:7px 6px;border-bottom:1px solid var(--border)">${pmEsc(ph.title)}</td>
        <td style="padding:7px 6px;border-bottom:1px solid var(--border)"><input type="number" step="1" class="pm-in" style="width:110px;padding:4px 6px" value="${ph.fee??''}" placeholder="$" onchange="pmSavePhaseFee('${ph.id}',this.value)"></td>
        <td style="padding:7px 6px;border-bottom:1px solid var(--border);font-size:12px">${st.state==='empty'?'<span style="color:var(--text-3)">no tasks</span>':`${st.pct}% <span style="color:var(--text-3)">(${st.done}/${st.total})</span>`}</td>
        <td style="padding:7px 6px;border-bottom:1px solid var(--border);font-size:12px">${ph.billed?`<span class="pm-chip" style="background:#dcfce7;color:#166534">Billed${ph.invoice_no?' #'+pmEsc(ph.invoice_no):''}${ph.billed_on?' · '+pmFmt(ph.billed_on):''}</span> <button class="pm-ic" title="Undo" onclick="pmSetBilled('${ph.id}',false)">↺</button>`
          : st.state==='complete' && Number(ph.fee)>0 ? `<button class="pm-btn primary" style="font-size:11px;padding:3px 8px" onclick="pmSetBilled('${ph.id}',true)">Ready: mark billed</button>`
          : Number(ph.fee)>0 ? `<span style="color:var(--text-3)">Bill when complete</span> <button class="pm-ic" title="Mark billed anyway (partial / deposit)" onclick="pmSetBilled('${ph.id}',true)">＄</button>` : '<span style="color:var(--text-3)">—</span>'}</td></tr>`; }).join('')}
      </tbody>
      <tfoot><tr><td style="padding:8px 6px;font-weight:700">Total</td><td style="padding:8px 6px;font-weight:700">${pmMoney(tot)}</td><td colspan="2" style="padding:8px 6px;font-size:12px">${pmMoney(billed)} billed · <b style="color:#15803d">${pmMoney(ready.reduce((t,ph)=>t+Number(ph.fee),0))} ready to bill</b> · ${pmMoney(tot-billed)} remaining${p.budget&&tot&&tot!==Number(p.budget)?` · <span style="color:#b45309">fees ${tot>p.budget?'exceed':'are under'} the ${pmMoney(p.budget)} budget</span>`:''}</td></tr></tfoot>
    </table>
    <div style="font-size:11px;color:var(--text-3);margin-top:8px">A phase becomes "ready to bill" when all its tasks are checked off. Invoicing itself still happens in QuickBooks; record the invoice number here.</div>`, 760);
}
async function pmSaveProjField(projectId, field, value){ try{ await sbFetch('PATCH', `/rest/v1/pm_projects?id=eq.${projectId}`, { [field]: value }); pmProject(projectId)[field] = value; pmRender(); }catch(e){ alert(e.message); } }
async function pmSavePhaseFee(id, v){ const ph = pmItem(id); ph.fee = v===''?null:Number(v); try{ await pmPatchItem(ph); pmOpenFees(ph.project_id); pmRender(); }catch(e){ alert(e.message); } }
async function pmSetBilled(id, on){
  const ph = pmItem(id);
  if(on){ const inv = prompt(`Invoice number for "${ph.title}" (optional):`, ph.invoice_no||''); if(inv===null) return; ph.billed = true; ph.invoice_no = inv.trim(); ph.billed_on = pmToday(); }
  else { if(!confirm('Mark this phase as not billed?')) return; ph.billed = false; ph.invoice_no = ''; ph.billed_on = null; }
  try{ await pmPatchItem(ph); pmOpenFees(ph.project_id); pmRender(); }catch(e){ alert(e.message); }
}

async function pmSaveSubmittal(id, projectId){
  const g = k=>document.getElementById(k).value;
  const row = { project_id:projectId, title:g('pms-title').trim(), revision:g('pms-rev').trim(), sent_to:g('pms-to').trim(), sent_on:g('pms-date')||null, method:g('pms-method'), item_id:g('pms-item')||null, file_id:g('pms-file')||null, notes:g('pms-notes').trim() };
  if(!row.title){ alert('What was issued?'); return; }
  try{
    if(id){ await sbFetch('PATCH', `/rest/v1/pm_submittals?id=eq.${id}`, row); Object.assign(pm.submittals.find(x=>x.id===id), row); }
    else { const r = await sbFetch('POST','/rest/v1/pm_submittals', { ...row, created_by:(currentUser&&currentUser.email)||'' }); pm.submittals.push(r[0]); }
    pmOpenSubmittals(projectId); pmRender();
  }catch(e){ alert('Could not save: '+e.message); }
}

function pmRowHtml(it, depth){
  const kids = pmKids(it.project_id, it.id);
  if(!pm.showDone && it.status==='done' && it.type!=='phase') return '';
  const open = !pm.collapsed[it.id];
  const isPhase = it.type==='phase';
  const rng = (kids.length||isPhase) ? pmRange(it) : { start: it.start_date, end: it.due_date };
  const r = kids.length ? pmRollup(pmDesc(it.id)) : null;
  const dep = it.depends_on ? pmItem(it.depends_on) : null;
  const late = pmOverdue(it) && !kids.length;
  let dates = '';
  if(pmIsMilestone(it.type)) dates = it.due_date ? pmFmt(it.due_date) : 'No date';
  else if(rng.start && rng.end && rng.start!==rng.end) dates = `${pmFmt(rng.start)} – ${pmFmt(rng.end)}`;
  else if(rng.end||rng.start) dates = (kids.length||isPhase?'':'Due ')+pmFmt(rng.end||rng.start);
  const pr = it.priority==='High' ? `<span class="pm-chip" style="background:#fee2e2;color:#991b1b">High</span>` : '';
  const tw = it.type==='milestone_ext' ? 'color:#b91c1c' : it.type==='milestone_int' ? 'color:#7c3aed' : it.type==='deliverable' ? 'color:#0369a1' : 'color:var(--text-3)';
  return `<div class="pm-row" style="padding-left:${8+depth*22}px;${isPhase?'background:var(--surface);font-weight:600':''}${it.status==='done'&&!isPhase?';opacity:.55':''}">
      <span style="width:16px;flex-shrink:0;cursor:${kids.length?'pointer':'default'};color:var(--text-3)" onclick="${kids.length?`pm.collapsed['${it.id}']=${open};pmSaveCollapsed();pmRender()`:''}">${kids.length?(open?'▾':'▸'):''}</span>
      ${isPhase||kids.length ? '' : `<input type="checkbox" ${it.status==='done'?'checked':''} onclick="pmToggleDone('${it.id}')" style="cursor:pointer;flex-shrink:0">`}
      <span style="${tw};flex-shrink:0;width:12px;text-align:center" title="${PM_TYPES[it.type]?.label||''}">${isPhase?'':PM_TYPES[it.type]?.icon||'•'}</span>
      <span onclick="pmEditItem('${it.id}')" style="cursor:pointer;flex:1;min-width:120px;${it.status==='done'&&!isPhase?'text-decoration:line-through':''}">${pmEsc(it.title)}
        ${it.status==='in_progress'?'<span class="pm-chip" style="background:#dbeafe;color:#1d4ed8;margin-left:4px">In progress</span>':''}
        ${dep?`<span style="font-size:11px;color:var(--text-3);font-weight:400;margin-left:4px">⚡ ${pmEsc(pmTriggerLabel(it, dep))}</span>`:''}
        ${(()=>{ const nx = pm.items.filter(x=>x.depends_on===it.id); return nx.length ? `<span style="font-size:11px;color:#a16207;font-weight:400;margin-left:4px" title="Sets off: ${pmEsc(nx.map(x=>x.title).join(', '))}">⚡ sets off ${nx.length===1?pmEsc(nx[0].title):nx.length+' tasks'}</span>` : ''; })()}</span>
      ${pr}
      ${pmIsMilestone(it.type)?`<button class="pm-ic" title="${it.meeting_notes?'Meeting notes':'Add meeting notes'}" onclick="pmMeetingNotes('${it.id}')" style="${it.meeting_notes?'':'opacity:.45'}">📝</button>`:''}
      ${!r && pmHoursLogged(t=>t.item_id===it.id) ? `<span class="pm-chip" title="Hours logged${it.est_hours?' / estimated':''}" style="${it.est_hours && pmHoursLogged(t=>t.item_id===it.id)>it.est_hours?'background:#fee2e2;color:#991b1b':''}">⏱ ${pmH(pmHoursLogged(t=>t.item_id===it.id))}${it.est_hours?'/'+pmH(it.est_hours):''}</span>` : ''}
      ${pmPartyChip(it)}
      ${it.owner?`<span class="pm-chip" title="${pmIsExternal(it)?'Field Source follow-up':'Owner'}">${pmIsExternal(it)?'↻ ':''}${pmEsc(it.owner)}</span>`:''}
      ${r&&r.total?`<span class="pm-chip">${r.done}/${r.total}</span>`:''}
      ${r ? (r.hours?`<span class="pm-chip" title="Total estimated hours">${Math.round(r.hours)}h</span>`:'')
          : (!pmIsMilestone(it.type) ? `<span class="pm-chip${pmLenValue(it)?'':' pm-lenadd'}" style="cursor:pointer;${pmLenValue(it)?'':'opacity:.6'}" title="Length: click to change" onclick="pmQuickLength('${it.id}',this)">${pmLenLabel(it)||'+ length'}</span>` : '')}
      ${dep && it.dep_wait && !(it.start_date||it.due_date) && it.status!=='done'
        ? `<span class="pm-chip" style="background:#fef3c7;color:#92400e;min-width:90px;text-align:center" title="Gets dates when ${pmEsc(dep.title)} ${it.dep_type==='start'?'starts':'is done'}">⏳ Waiting</span>`
        : `<span onclick="pmEditItem('${it.id}')" title="Click to change dates" style="margin-left:auto;cursor:pointer;font-size:12px;white-space:nowrap;min-width:90px;text-align:right;color:${late?'#dc2626':'var(--text-2)'};font-weight:${late?600:400}">${dates}</span>`}
      <span class="pm-acts">
        ${!isPhase && !kids.length ? `<button class="pm-ic" title="Log time" onclick="pmLogTime('${it.id}')">⏱</button>` : ''}
        ${!isPhase && !kids.length && it.status!=='done' && !pmIsMilestone(it.type) ? `<button class="pm-ic" title="${it.status==='in_progress'?'Mark not started':'Mark started (sets off anything waiting for this to start)'}" onclick="pmToggleStarted('${it.id}')">${it.status==='in_progress'?'⏸':'▶'}</button>` : ''}
        <button class="pm-ic" title="Add ${isPhase?'task':'subtask'}" onclick="pmEditItem(null,{project_id:'${it.project_id}',parent_id:'${it.id}',type:'task'})">＋</button>
        <button class="pm-ic" title="Move up" onclick="pmMove('${it.id}',-1)">↑</button>
        <button class="pm-ic" title="Move down" onclick="pmMove('${it.id}',1)">↓</button>
        <button class="pm-ic" title="Delete" onclick="pmDeleteItem('${it.id}')">🗑</button>
      </span>
    </div>` + (open ? kids.map(k=>pmRowHtml(k, depth+1)).join('') : '');
}

// Click a length chip in the project tree to change it on the spot.
function pmQuickLength(id, el){
  const it = pmItem(id); if(!it) return;
  document.getElementById('pm-quick')?.remove();
  const r = el.getBoundingClientRect();
  const box = document.createElement('div'); box.id = 'pm-quick';
  box.style.cssText = `position:fixed;left:${Math.min(r.left, window.innerWidth-250)}px;top:${r.bottom+6}px;z-index:9998;background:var(--card);border:1px solid var(--border-2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:10px;width:230px`;
  box.innerHTML = `<div class="pm-lbl">Length</div>
    <div style="display:flex;gap:4px"><input id="pmq-v" type="number" min="0" step="0.5" class="pm-in" value="${pmEsc(pmLenValue(it)??'')}">
    <select id="pmq-u" class="pm-in" style="width:auto"><option value="days"${pmLenUnit(it)==='days'?' selected':''}>days</option><option value="hours"${pmLenUnit(it)==='hours'?' selected':''}>hours</option></select></div>
    <div style="font-size:11px;color:var(--text-3);margin-top:4px">${it.start_date?'The due date moves to match.':'Set a start date (click the dates) to schedule it.'}</div>
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px"><button class="pm-btn" onclick="document.getElementById('pm-quick').remove()">Cancel</button><button class="pm-btn primary" onclick="pmQuickLengthSave('${id}')">Save</button></div>`;
  document.body.appendChild(box);
  const inp = document.getElementById('pmq-v'); inp.focus(); inp.select();
  inp.onkeydown = e=>{ if(e.key==='Enter') pmQuickLengthSave(id); if(e.key==='Escape') box.remove(); };
  setTimeout(()=>document.addEventListener('mousedown', function off(ev){ if(!box.contains(ev.target)){ box.remove(); document.removeEventListener('mousedown', off); } }), 0);
}
async function pmQuickLengthSave(id){
  const it = pmItem(id), unit = document.getElementById('pmq-u').value, raw = document.getElementById('pmq-v').value;
  const val = raw==='' ? null : Number(raw);
  if(unit==='hours'){ it.est_hours = val; }        // hours-based: the hours are the length
  else if(it.length_unit==='hours'){ it.est_hours = null; } // switching hours -> days: drop the old hours length
  it.length_unit = unit;
  it.duration_days = pmDaysFor(unit, val);
  if(it.start_date && it.duration_days) it.due_date = pmAddWorkdays(it.start_date, it.duration_days);
  document.getElementById('pm-quick')?.remove();
  try{ await pmPatchItem(it); const n = await pmReschedule(it.project_id); pmRender(); if(n) pmToast(`${n} dependent item${n===1?'':'s'} rescheduled`); }
  catch(e){ alert('Could not save: '+e.message); }
}
// ── Deadlines step (pops up after creating a project; also on the project's Deadlines button) ──
// A date entered here is a fixed deadline: the item is pinned (it won't be moved by auto-scheduling),
// and a task with a length is laid out backwards from its deadline.
// Calendar's Deadlines button: straight to the filtered project, or pick one when showing all.
function pmCalDeadlines(){
  if(pm.calProject && pmProject(pm.calProject)){ pmDeadlines(pm.calProject); return; }
  const active = pm.projects.filter(p=>p.status!=='Complete');
  if(!active.length){ alert('No active projects yet.'); return; }
  if(active.length===1){ pmDeadlines(active[0].id); return; }
  const key = i=>pmIsMilestone(i.type)||i.type==='deliverable';
  pmModal(`<div class="sheet-title">Deadlines</div>
    <div style="font-size:12px;color:var(--text-3);margin:4px 0 10px">Pick a project to add or change its deadlines.</div>
    ${active.map(p=>{
      const its = pm.items.filter(i=>i.project_id===p.id && key(i) && i.status!=='done');
      const open = its.filter(i=>!i.due_date).length;
      const next = its.filter(i=>i.due_date && i.due_date>=pmToday()).sort((a,b)=>a.due_date.localeCompare(b.due_date))[0];
      return `<div onclick="pmDeadlines('${p.id}')" class="pm-proj" style="border-bottom:1px solid var(--border);border-radius:0">
        <span class="pm-dot" style="background:${pmEsc(p.color)}"></span>
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">${pmEsc(p.name)}</div>
        <div style="font-size:11px;color:var(--text-3)">${next?`Next: ${PM_TYPES[next.type].icon} ${pmEsc(next.title)} ${pmFmt(next.due_date)}`:'No upcoming deadlines'}${open?` · <span style="color:#b45309">${open} without a date</span>`:''}</div></div>
        <span style="color:var(--text-3)">›</span></div>`;
    }).join('')}
    <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="pm-btn" onclick="document.getElementById('pm-overlay').remove()">Close</button></div>`, 520);
}
function pmPrevWorkday(s){ const set = pmClosureSet(); let d = s; for(let i=0;i<60 && !pmIsWorkday(d,set);i++) d = pmShift(d,-1); return d; }
function pmStartForDeadline(due, days){ const set = pmClosureSet(); let d = pmPrevWorkday(due), left = Math.max(1, days||1) - 1; for(let i=0;left>0 && i<2000;i++){ d = pmShift(d,-1); if(pmIsWorkday(d,set)) left--; } return d; }
function pmDeadlines(projectId, opts){
  opts = opts || {};
  const p = pmProject(projectId); if(!p) return;
  const showAll = !!opts.all;
  const isKey = it=>pmIsMilestone(it.type) || it.type==='deliverable';
  const rows = [];
  const walk = (pid, depth)=>pmKids(projectId, pid).forEach(it=>{
    const kids = pm.items.some(c=>c.parent_id===it.id);
    if(it.type==='phase') rows.push({ it, depth, header:true });
    else if(it.status!=='done' && (showAll ? !kids : isKey(it))) rows.push({ it, depth });
    walk(it.id, depth+1);
  });
  walk(null, 0);
  const visible = rows.filter((r,i)=>!r.header || rows.slice(i+1).find(x=>x.header || !x.header)?.header===false);
  const body = visible.length ? visible.map(r=>{
    const it = r.it;
    if(r.header) return `<div style="font-size:12px;font-weight:700;color:var(--text-2);padding:10px 4px 4px;border-bottom:1px solid var(--border)">${pmEsc(it.title)}</div>`;
    const icon = PM_TYPES[it.type].icon, col = it.type==='milestone_ext'?'#b91c1c':it.type==='milestone_int'?'#7c3aed':it.type==='deliverable'?'#0369a1':'var(--text-3)';
    const len = pmLenLabel(it);
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border);font-size:13px">
      <span style="color:${col};width:14px;text-align:center">${icon}</span>
      <span style="flex:1;min-width:0">${pmEsc(it.title)}${len?` <span style="color:var(--text-3);font-size:11px">${len}</span>`:''}
        <div class="pmdl-warn" data-id="${it.id}" style="font-size:11px;color:#b45309"></div></span>
      <input type="date" class="pm-in pmdl-date" data-id="${it.id}" data-orig="${pmEsc(it.due_date||'')}" value="${pmEsc(it.due_date||'')}" style="width:150px" onchange="pmDeadlineCheck(this)">
    </div>`;
  }).join('') : `<div style="padding:12px;font-size:13px;color:var(--text-3)">${showAll?'Nothing left to schedule.':'This project has no milestones or deliverables yet.'}</div>`;
  pmModal(`
    <div class="sheet-title">${opts.fresh?'Set deadlines for ':'Deadlines · '}${pmEsc(p.name)}</div>
    <div style="font-size:12px;color:var(--text-3);margin:4px 0 10px">${opts.fresh?'Add dates for anything you already know: client meetings, submittals, presentations. Leave the rest blank and fill them in later from the project\'s <b>Deadlines</b> button.':'Fill in or change deadlines. Blank means no date yet.'}
      A date here is fixed: the item stays on that date, and if it has a length, its work is scheduled to finish by then.</div>
    <label style="font-size:12px;display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="checkbox" ${showAll?'checked':''} onchange="pmDeadlines('${projectId}',{fresh:${!!opts.fresh},all:this.checked})"> Show every task, not just milestones and deliverables</label>
    <div style="max-height:56vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 8px">${body}</div>
    <div style="font-size:11px;color:var(--text-3);margin-top:6px">◆ client milestone · ◇ internal milestone · ■ deliverable · • task</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
      <button class="pm-btn" onclick="document.getElementById('pm-overlay').remove()">${opts.fresh?'Skip for now':'Cancel'}</button>
      <button class="pm-btn primary" onclick="pmDeadlinesSave('${projectId}')">Save deadlines</button>
    </div>`, 640);
  document.querySelectorAll('.pmdl-date').forEach(pmDeadlineCheck);
}
// Warn (don't block) when a deadline falls on a closure or before the item it depends on is due.
function pmDeadlineCheck(input){
  const it = pmItem(input.dataset.id), warn = document.querySelector(`.pmdl-warn[data-id="${input.dataset.id}"]`);
  if(!it || !warn) return;
  const d = input.value, msgs = [];
  if(d){
    if(!pmIsWorkday(d)) msgs.push(pmClosureSet().has(d) ? 'Falls on an office closure' : 'Falls on a weekend');
    const pred = it.depends_on && pmItem(it.depends_on);
    const predEnd = pred && (document.querySelector(`.pmdl-date[data-id="${pred.id}"]`)?.value || pred.due_date);
    if(predEnd && d <= predEnd) msgs.push(`Before "${pred.title}" is due (${pmFmt(predEnd)})`);
    if(d < pmToday()) msgs.push('In the past');
  }
  warn.textContent = msgs.length ? '⚠ ' + msgs.join(' · ') : '';
}
async function pmDeadlinesSave(projectId){
  const changed = [];
  document.querySelectorAll('.pmdl-date').forEach(inp=>{
    if(inp.value === (inp.dataset.orig||'')) return;
    const it = pmItem(inp.dataset.id); if(!it) return;
    const due = inp.value || null;
    it.due_date = due;
    if(due){
      it.auto_schedule = false; // pinned to its deadline
      if(!pmIsMilestone(it.type) && it.duration_days) it.start_date = pmStartForDeadline(due, it.duration_days);
      else if(!pmIsMilestone(it.type) && it.start_date && it.start_date > due) it.start_date = null;
    } else {
      it.auto_schedule = true;
      if(!pmIsMilestone(it.type)) it.start_date = null;
    }
    changed.push(it);
  });
  try{
    await Promise.all(changed.map(pmPatchItem));
    const moved = await pmReschedule(projectId);
    document.getElementById('pm-overlay')?.remove();
    pmRender();
    if(changed.length) pmToast(`Saved ${changed.length} deadline${changed.length===1?'':'s'}${moved?`, ${moved} linked item${moved===1?'':'s'} rescheduled`:''}`);
  }catch(e){ alert('Could not save: '+e.message); }
}

function pmCollapseAll(projectId, collapse){
  pm.items.filter(i=>i.project_id===projectId && pm.items.some(c=>c.parent_id===i.id)).forEach(i=>{ if(collapse) pm.collapsed[i.id]=true; else delete pm.collapsed[i.id]; });
  pmSaveCollapsed(); pmRender();
}

// ── modals ──
function pmModal(html, width){
  document.getElementById('pm-overlay')?.remove();
  const o = document.createElement('div');
  o.className='modal-overlay centered'; o.id='pm-overlay';
  o.innerHTML = `<div class="modal-sheet" style="max-width:${width||620}px;max-height:92vh;overflow-y:auto"><div class="sheet-handle"></div>${html}</div>`;
  o.onclick = e=>{ if(e.target===o) o.remove(); };
  document.body.appendChild(o);
  return o;
}
function pmPeople(){
  const names = new Set(PM_PEOPLE_EXTRA);
  if(typeof USER_DISPLAY_NAMES!=='undefined') Object.values(USER_DISPLAY_NAMES).forEach(n=>names.add(n));
  pm.items.forEach(i=>{ if(i.owner) names.add(i.owner); });
  return [...names].sort();
}

// Forward triggers: the items this one sets off (stored on each of those items as depends_on = this item).
function pmTrigInit(it){
  pm._trig = { selfId: it.id||null, projectId: it.project_id, parentId: it.parent_id||null,
    rows: it.id ? pm.items.filter(x=>x.depends_on===it.id).map(x=>({ id:x.id, title:x.title, dep_type:x.dep_type==='start'?'start':'finish', dep_lag:parseInt(x.dep_lag)||0, plan:!x.dep_wait })) : [] };
  pmTrigRender();
}
// Items that can't be set off by this one: itself, its ancestors and descendants, phases, and anything upstream of it (would loop).
function pmTrigBlocked(){
  const t = pm._trig, out = new Set();
  if(t.selfId){
    out.add(t.selfId); pmDesc(t.selfId).forEach(d=>out.add(d.id));
    let c = pmItem(t.selfId); while(c && c.parent_id){ out.add(c.parent_id); c = pmItem(c.parent_id); }
    let up = pmItem(t.selfId); const seen = new Set(); while(up && up.depends_on && !seen.has(up.depends_on)){ seen.add(up.depends_on); out.add(up.depends_on); up = pmItem(up.depends_on); }
  }
  return out;
}
function pmTrigRender(){
  const t = pm._trig, list = document.getElementById('pmi-trig-list'), add = document.getElementById('pmi-trig-add');
  if(!list) return;
  list.innerHTML = t.rows.filter(r=>!r.removed).map((r,i)=>{
    const other = !r.isNew && pmItem(r.id), already = other && other.depends_on && other.depends_on!==t.selfId ? pmItem(other.depends_on) : null;
    const idx = t.rows.indexOf(r);
    return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)">
      <b style="flex:1;min-width:140px">${r.isNew?'＋ ':''}${pmEsc(r.title)}${r.isNew?' <span style="font-weight:400;color:var(--text-3);font-size:11px">(new)</span>':''}</b>
      <select class="pm-in" style="width:auto;font-size:12px;padding:3px" onchange="pm._trig.rows[${idx}].dep_type=this.value"><option value="finish"${r.dep_type==='finish'?' selected':''}>when this is done</option><option value="start"${r.dep_type==='start'?' selected':''}>when this starts</option></select>
      + <input type="number" min="0" class="pm-in" style="width:52px;font-size:12px;padding:3px" value="${r.dep_lag}" oninput="pm._trig.rows[${idx}].dep_lag=Math.max(0,parseInt(this.value)||0)"> days
      <label style="font-size:11px;color:var(--text-2);display:flex;gap:3px;align-items:center" title="Put estimated dates on the calendar now; they move if this item moves"><input type="checkbox" ${r.plan?'checked':''} onchange="pm._trig.rows[${idx}].plan=this.checked"> pencil in dates</label>
      <button class="pm-ic" title="Don't set this off" onclick="pm._trig.rows[${idx}].removed=true;pmTrigRender()">✕</button>
      ${already?`<div style="width:100%;font-size:11px;color:#b45309">Currently set off by "${pmEsc(already.title)}". Saving moves it to this one.</div>`:''}
    </div>`;
  }).join('') || '<div style="font-size:12px;color:var(--text-3);padding:4px 0">Nothing yet.</div>';
  if(add){
    const blocked = pmTrigBlocked(), chosen = new Set(t.rows.filter(r=>!r.removed && !r.isNew).map(r=>r.id));
    const path = x=>{ const n=[]; let c=x; while(c){ n.unshift(c.title); c = c.parent_id && pmItem(c.parent_id); } return n.join(' › '); };
    const opts = pm.items.filter(x=>x.project_id===t.projectId && x.type!=='phase' && x.status!=='done' && !blocked.has(x.id) && !chosen.has(x.id))
      .sort((a,b)=>path(a).localeCompare(path(b)));
    add.innerHTML = `<option value="">+ Add an existing task…</option>` + opts.map(x=>`<option value="${x.id}">${pmEsc(path(x))}</option>`).join('');
  }
}
function pmTrigAddExisting(id){
  if(!id) return; const x = pmItem(id); if(!x) return;
  const prev = pm._trig.rows.find(r=>r.id===id); if(prev){ prev.removed=false; pmTrigRender(); return; }
  pm._trig.rows.push({ id, title:x.title, dep_type:'finish', dep_lag:0, plan:false });
  pmTrigRender();

// After the item is saved: link, unlink and create the items it sets off.
async function pmTrigSave(selfId){
  const t = pm._trig; if(!t) return;
  const self = pmItem(selfId);
  const toPatch = [];
  for(const r of t.rows){
    if(r.isNew){
      if(r.removed) continue;
      const sibs = pmKids(self.project_id, self.parent_id).filter(x=>(x.sort||0) > (self.sort||0));
      sibs.forEach(x=>{ x.sort = (x.sort||0)+1; toPatch.push(x); });
      const row = pmFullRow ? pmFullRow({ id:r.id, project_id:self.project_id, parent_id:self.parent_id||null, type:'task', title:r.title, sort:(self.sort||0)+1,
        depends_on:selfId, dep_type:r.dep_type, dep_lag:r.dep_lag, dep_wait:!r.plan, auto_schedule:true, owner:self.owner||'', party:'fs', party_name:'' }) : null;
      const ins = await sbFetch('POST','/rest/v1/pm_items', row);
      pm.items.push(...(ins||[]));
      continue;
    }
    const x = pmItem(r.id); if(!x) continue;
    if(r.removed){ if(x.depends_on===selfId){ x.depends_on = null; toPatch.push(x); } continue; }
    Object.assign(x, { depends_on:selfId, dep_type:r.dep_type, dep_lag:r.dep_lag, dep_wait:!r.plan, auto_schedule:true });
    if(x.dep_wait && x.status==='todo' && !(self.status==='done' || (x.dep_type==='start' && self.status==='in_progress'))){ x.start_date = null; if(!pmIsMilestone(x.type)) x.due_date = null; }
    toPatch.push(x);
  }
  await Promise.all([...new Set(toPatch)].map(pmPatchItem));
  pm._trig = null;
}
